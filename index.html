</head>
<body>
    <div id="app">
        <div id="loading-screen" class="screen active"><div class="loader"></div><p>Загрузка...</p></div>
        <div id="main-menu" class="screen">
            <h1>Miasma Massacre</h1>
            <div class="menu-buttons">
                <button id="btn-solo" class="btn primary">Играть (Solo)</button>
                <button id="btn-multi" class="btn secondary">Мультиплеер</button>
            </div>
            <div class="version">v1.0.0</div>
        </div>
        <div id="role-select" class="screen">
            <h2>Выбери роль</h2>
            <button id="btn-play-killer" class="btn primary">Убийца</button>
            <button id="btn-play-survivor" class="btn secondary">Выживший</button>
        </div>
        <div id="lobby-create" class="screen">
            <h2>Лобби</h2>
            <div id="lobby-status">Создание лобби...</div>
            <div id="lobby-players"></div>
            <button id="btn-start-game" class="btn" disabled style="background:#666;">Начать (ждём игроков)</button>
            <button id="btn-leave-lobby" class="btn secondary" onclick="leaveLobby()">Выйти</button>
        </div>
        <div id="lobby-join" class="screen">
            <h2>Поиск игры</h2>
            <div id="search-status">Поиск доступных лобби...</div>
            <div id="search-count"></div>
            <button id="btn-leave-search" class="btn secondary">Назад</button>
        </div>
        <div id="game-screen" class="screen">
            <div id="game-container"></div>
            <div id="hud">
                <div id="role-indicator">Роль: <span id="player-role">---</span></div>
                <div id="generators-info">Генераторы: <span id="gen-count">0/5</span></div>
                <div id="exit-status">Выход: <span id="exit-state">закрыт</span></div>
            </div>
            <div id="player-list-hud">
                <div id="alive-count">Выжившие: 4/4</div>
            </div>
        </div>
        <div id="game-over" class="screen">
            <h2 id="game-result-title">Победа!</h2>
            <p id="game-result-message"></p>
            <button id="btn-back-menu" class="btn primary">В меню</button>
        </div>
    </div>
    <div id="toast"></div>

    <script>
    (function(){
        var UI = {
            showScreen: function(n){
                var s = ['loading-screen','main-menu','role-select','lobby-create','lobby-join','game-screen','game-over'];
                s.forEach(function(x){
                    var el = document.getElementById(x);
                    if(el) el.classList.remove('active');
                });
                var target = document.getElementById(n);
                if(target) target.classList.add('active');
            },
            showToast: function(m){
                var t = document.getElementById('toast');
                if(t){ t.textContent = m; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show'); }
            },
            showGameOver: function(won){
                var title = document.getElementById('game-result-title');
                var msg   = document.getElementById('game-result-message');
                if(title) title.textContent = won ? 'ПОБЕДА!' : 'ПОРАЖЕНИЕ';
                if(msg)   msg.textContent   = won ? 'Ты сбежал!' : (isKiller ? 'Ты поймал всех!' : 'Тебя поймали!');
                UI.showScreen('game-over');
            }
        };

        // ── Game constants ──────────────────────────────────────────────────
        var GAME_CONFIG = Object.freeze({
            PLAYER_SPEED:     155,
            KILLER_SPEED:     170,
            INJURED_SPEED:    185,
            DYING_SPEED:       30,
            GENERATOR_COUNT:    5,
            CATCH_DISTANCE:    50,
            CATCH_COOLDOWN:   1.5,
            HIT_DISTANCE:      55,
            STUN_TIME:        1.5,
            HOOK_TIME:         60,
            HEAL_TIME:         15,
            GATE_OPEN_TIME:    20,
            HATCH_APPEAR_CHANCE: 0.3
        });

        // ── State ───────────────────────────────────────────────────────────
        var game         = null;
        var player       = null;
        var generators   = [];
        var isKiller     = false;
        var exitOpen     = false;
        var survivorsLeft= 4;
        var catchCooldown= 0;
        var killerStunned= 0;
        var survivorSpeedBoost = 0;

        // ── Anti-cheat ──────────────────────────────────────────────────────
        var AntiCheat = {
            lastPosition: {x:0,y:0}, lastTimestamp:0, violations:0,
            lastActionTime:{}, maxViolations:5,
            reset: function(){ this.lastPosition={x:0,y:0}; this.lastTimestamp=0; this.violations=0; this.lastActionTime={}; },
            checkConfigIntegrity: function(){
                if(GAME_CONFIG.PLAYER_SPEED!==155||GAME_CONFIG.KILLER_SPEED!==170){ this.violations+=10; return false; }
                return true;
            },
            validatePosition: function(x,y){
                if(x<-100||x>1300||y<-100||y>1000){ this.violations++; return false; }
                return true;
            },
            validateSpeed: function(ox,oy,nx,ny,dt){
                if(this.lastTimestamp>0){
                    var dist=Math.sqrt(Math.pow(nx-ox,2)+Math.pow(ny-oy,2));
                    var spd=dist/(dt/1000);
                    var maxSpd=(isKiller?GAME_CONFIG.KILLER_SPEED:GAME_CONFIG.PLAYER_SPEED)*2;
                    if(spd>maxSpd&&dt/1000>0.01){ this.violations++; return false; }
                }
                this.lastPosition={x:nx,y:ny}; this.lastTimestamp=Date.now(); return true;
            },
            validateAction: function(type){
                var now=Date.now();
                if(this.lastActionTime[type]&&now-this.lastActionTime[type]<500){ this.violations++; return false; }
                this.lastActionTime[type]=now; return true;
            },
            validateGeneratorProgress: function(p){ return p>=0&&p<=100; }
        };

        // ── Game start / stop ───────────────────────────────────────────────
        function startGame(km){
            isKiller=km; exitOpen=false; survivorsLeft=4; catchCooldown=0; generators=[];
            AntiCheat.reset();

            var gameScreen = document.getElementById('game-screen');
            var gameContainer = document.getElementById('game-container');

            if(gameScreen){
                gameScreen.classList.add('active');
                gameScreen.style.cssText='display:block!important;position:fixed!important;top:0!important;left:0!important;width:100%!important;height:100%!important;background:transparent!important;z-index:1000!important;';
            }
            if(gameContainer){
                gameContainer.style.cssText='display:block!important;position:fixed!important;top:0!important;left:0!important;width:100%!important;height:100%!important;background:#1a1a1a!important;z-index:1!important;visibility:visible!important;';
            }

            UI.showToast(isKiller ? 'Поймай всех!' : 'Найди генераторы!');
            initGame();
        }

        function stopGame(){
            if(game){ game.destroy(true); game=null; player=null; }
            var j=document.querySelector('[data-joystick]');
            var a=document.querySelector('[data-action-btn]');
            if(j) j.remove();
            if(a) a.remove();
        }

        // ── Phaser init ─────────────────────────────────────────────────────
        function initGame(){
            console.log('initGame, isKiller:', isKiller);
            if(game){ game.destroy(true); game=null; }

            var container = document.getElementById('game-container');
            container.innerHTML='';
            container.style.background='#1a1a1a';

            var W = window.innerWidth  || 800;
            var H = window.innerHeight || 600;

            if(typeof Phaser==='undefined'){
                container.innerHTML='<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#1a1a1a;color:#ff3333;font-family:sans-serif;"><h2>Ошибка: Phaser не загружен</h2><p>Проверьте интернет-соединение</p></div>';
                return;
            }

            game = new Phaser.Game({
                type: Phaser.CANVAS,
                parent: 'game-container',
                width: W,
                height: H,
                backgroundColor: '#1a1a1a',
                physics:{ default:'arcade', arcade:{ gravity:{y:0}, debug:false } },
                scene:{ preload:preload, create:create, update:update },
                scale:{
                    mode: Phaser.Scale.RESIZE,
                    autoCenter: Phaser.Scale.CENTER_BOTH
                }
            });
        }

        // ── Preload ─────────────────────────────────────────────────────────
        function preload(){
            console.log('Preload started');
            var g = this.make.graphics();

            g.fillStyle(0x1B5E20);g.fillRect(10,40,25,35);g.fillStyle(0x2E7D32);g.fillCircle(22,40,20);g.fillCircle(12,35,12);g.fillCircle(32,35,10);g.generateTexture('tree',45,85);g.clear();
            g.fillStyle(0x388E3C);g.fillCircle(20,20,18);g.fillStyle(0x2E7D32);g.fillCircle(10,18,10);g.fillCircle(30,16,10);g.generateTexture('bush',40,40);g.clear();
            g.fillStyle(0x607D8B);g.fillCircle(18,18,16);g.fillStyle(0x78909C);g.fillCircle(12,14,8);g.fillCircle(24,14,8);g.generateTexture('rock',40,40);g.clear();

            // Survivors
            g.fillStyle(0xD32F2F);g.fillRect(10,28,20,25);g.fillStyle(0x1976D2);g.fillRect(10,53,8,12);g.fillRect(22,53,8,12);g.fillStyle(0xFFCCBC);g.fillCircle(20,16,11);g.fillStyle(0x5D4037);g.fillCircle(20,10,11);g.fillStyle(0x212121);g.fillRect(16,9,3,3);g.fillRect(21,9,3,3);g.generateTexture('survivor1',40,65);g.clear();
            g.fillStyle(0x7B1FA2);g.fillRect(12,28,16,25);g.fillStyle(0x4A148C);g.fillRect(12,53,16,12);g.fillStyle(0xFFCCBC);g.fillCircle(20,16,10);g.fillStyle(0xFF8F00);g.fillCircle(20,10,10);g.fillStyle(0x212121);g.fillCircle(17,14,2);g.fillCircle(23,14,2);g.generateTexture('survivor2',40,65);g.clear();
            g.fillStyle(0x388E3C);g.fillRect(10,28,20,25);g.fillStyle(0x1565C0);g.fillRect(10,53,8,12);g.fillRect(22,53,8,12);g.fillStyle(0xD7CCC8);g.fillCircle(20,16,11);g.fillStyle(0x424242);g.fillCircle(20,8,11);g.fillStyle(0x212121);g.fillRect(16,7,3,2);g.fillRect(21,7,3,2);g.generateTexture('survivor3',40,65);g.clear();
            g.fillStyle(0xFF5722);g.fillRect(12,28,16,25);g.fillStyle(0x3F51B5);g.fillRect(12,53,16,12);g.fillStyle(0xFFCCBC);g.fillCircle(20,16,10);g.fillStyle(0x8D6E63);g.fillCircle(20,9,10);g.fillStyle(0x212121);g.fillCircle(17,14,2);g.fillCircle(23,14,2);g.generateTexture('survivor4',40,65);g.clear();

            // Killer
            g.fillStyle(0x212121);g.fillRect(8,28,24,30);g.fillStyle(0xB71C1C);g.fillRect(5,24,30,18);g.fillStyle(0xD7CCC8);g.fillCircle(20,14,12);g.fillStyle(0x37474F);g.fillRect(8,6,24,18);g.fillStyle(0xFF1744);g.fillCircle(14,10,4);g.fillCircle(26,10,4);g.fillStyle(0x000000);g.fillRect(15,18,10,4);g.generateTexture('killer_m',40,70);g.clear();

            // Generator
            g.fillStyle(0x546E7A);g.fillRect(2,2,36,26);g.fillStyle(0x37474F);g.fillRect(4,4,14,10);g.fillRect(22,4,14,10);g.fillStyle(0x00E676);g.fillRect(6,6,5,6);g.fillRect(24,6,5,6);g.fillStyle(0xF44336);g.fillCircle(18,15,8);g.fillStyle(0xFFFFFF);g.fillCircle(18,15,4);g.generateTexture('generator',40,30);g.clear();

            // Exit / ground / hook / hatch
            g.fillStyle(0x4E342E);g.fillRect(0,0,70,55);g.fillStyle(0x3E2723);g.fillRect(5,5,25,45);g.fillRect(40,5,25,45);g.fillStyle(0x4CAF50);g.fillRect(15,15,40,20);g.generateTexture('exit',70,55);g.clear();
            g.fillStyle(0x1B1B1B);g.fillRect(0,0,32,32);g.fillStyle(0x2D2D2D);g.fillCircle(8,8,5);g.fillCircle(24,20,4);g.generateTexture('ground',32,32);g.clear();
            g.fillStyle(0x424242);g.fillCircle(15,15,12);g.fillStyle(0x616161);g.fillCircle(15,15,8);g.fillStyle(0x757575);g.fillCircle(15,15,4);g.generateTexture('hook',30,30);g.clear();
            g.fillStyle(0x424242);g.fillCircle(15,15,14);g.fillStyle(0xB71C1C);g.fillCircle(15,15,4);g.generateTexture('hatch',30,30);g.clear();
            g.fillStyle(0xB71C1C);g.fillRect(0,0,80,60);g.fillStyle(0x7f0000);g.fillRect(5,5,70,50);g.fillStyle(0x424242);g.fillRect(35,20,10,25);g.generateTexture('gate',80,60);g.clear();
        }

        // ── Create ──────────────────────────────────────────────────────────
        function create(){
            var mw=1200, mh=900;
            this.physics.world.setBounds(0,0,mw,mh);

            // Ground tiles
            for(var x=0;x<mw;x+=32){
                for(var y=0;y<mh;y+=32){
                    this.add.image(x+16,y+16,'ground').setAlpha(0.5+Math.random()*0.5);
                }
            }

            // Static decoration
            var trees=[{x:80,y:80},{x:180,y:100},{x:1100,y:60},{x:1050,y:140},{x:60,y:820},{x:140,y:860},{x:1100,y:800},{x:1050,y:860},{x:600,y:60},{x:320,y:320},{x:920,y:320},{x:320,y:620},{x:920,y:620}];
            trees.forEach(function(p){ this.add.image(p.x,p.y,'tree').setDepth(p.y); },this);

            var rocks=[{x:250,y:180},{x:450,y:150},{x:850,y:180},{x:250,y:700},{x:950,y:500},{x:600,y:720}];
            rocks.forEach(function(p){ this.add.image(p.x,p.y,'rock').setDepth(p.y); },this);

            var bushes=[{x:180,y:280},{x:380,y:180},{x:780,y:220},{x:180,y:680},{x:1020,y:420},{x:580,y:680}];
            bushes.forEach(function(p){ this.add.image(p.x,p.y,'bush').setDepth(p.y); },this);

            // Generators
            var genPos=[{x:120,y:120},{x:1080,y:120},{x:600,y:450},{x:120,y:780},{x:1080,y:780}];
            genPos.forEach(function(p){
                var gen=this.add.sprite(p.x,p.y,'generator');
                gen.progress=0; gen.repaired=false;
                var bar=this.add.graphics(); bar.x=0; bar.y=0;
                gen.bar=bar; gen.barX=p.x; gen.barY=p.y;
                var light=this.add.circle(p.x+15,p.y-12,5,0x00ff00).setAlpha(0).setDepth(p.y+1);
                gen.light=light;
                generators.push(gen);
            },this);

            // Gates
            this.gates=[{x:60,y:450},{x:1140,y:450}].map(function(gp){
                var gate=this.add.sprite(gp.x,gp.y,'gate');
                gate.progress=0; gate.opened=false; gate.bar=null;
                return gate;
            },this);

            // Exit (hidden until gens done)
            this.exit=this.add.sprite(600,870,'exit').setTint(0x440000).setVisible(false);

            // Hooks
            this.hooks=[{x:300,y:200},{x:900,y:200},{x:300,y:700},{x:900,y:700},{x:600,y:450}].map(function(hp){
                var hook=this.add.sprite(hp.x,hp.y,'hook').setTint(0x888888).setScale(1.2);
                hook.occupied=false; hook.hookedPlayer=null; hook.hookTimer=0;
                return hook;
            },this);

            this.hatch=null;

            // ── Spawn player ──
            var killerSpawn={x:600,y:450};
            var survivorSpawns=[{x:100,y:100},{x:1100,y:100},{x:100,y:800},{x:1100,y:800}];
            var spawnPos=isKiller?killerSpawn:survivorSpawns[0];

            player=this.add.sprite(spawnPos.x,spawnPos.y,isKiller?'killer_m':'survivor1');
            player.health=100; player.injured=false; player.dying=false; player.hooked=false; player.carriedBy=null;
            this.physics.add.existing(player);
            player.body.setCollideWorldBounds(true);
            player.setDepth(1000);

            // ── AI survivors (for killer mode) ──
            this.survivors=[];
            if(isKiller){
                [{x:survivorSpawns[1].x,y:survivorSpawns[1].y,'tex':'survivor2'},
                 {x:survivorSpawns[2].x,y:survivorSpawns[2].y,'tex':'survivor3'},
                 {x:survivorSpawns[3].x,y:survivorSpawns[3].y,'tex':'survivor4'}].forEach(function(s){
                    var sv=this.add.sprite(s.x,s.y,s.tex);
                    sv.health=100; sv.injured=false; sv.dying=false; sv.hooked=false; sv.carriedBy=null; sv.alive=true;
                    this.physics.add.existing(sv);
                    sv.body.setCollideWorldBounds(true);
                    sv.setDepth(s.y);
                    this.survivors.push(sv);
                },this);
            }

            // ── Camera ──
            this.cameras.main.setBounds(0,0,mw,mh);
            this.cameras.main.startFollow(player,true,0.1,0.1);
            this.cameras.main.setBackgroundColor('#1a1a1a');

            // ── Input ──
            initInput(this);

            console.log('Game scene created! isKiller:', isKiller);
            UI.showToast(isKiller ? '🔪 Поймай всех выживших!' : '⚙️ Почини генераторы!');
        }

        // ── Update ──────────────────────────────────────────────────────────
        function update(time, dt){
            if(!player) return;

            var vec=getInputVector();
            var spd=GAME_CONFIG.PLAYER_SPEED;

            if(isKiller){
                spd=killerStunned>0?0:GAME_CONFIG.KILLER_SPEED;
                if(killerStunned>0) killerStunned-=dt/1000;
            } else {
                if(player.injured) spd=GAME_CONFIG.INJURED_SPEED;
                if(player.dying)   spd=GAME_CONFIG.DYING_SPEED;
                if(player.hooked)  spd=0;
                if(survivorSpeedBoost>0){ survivorSpeedBoost-=dt/1000; spd=GAME_CONFIG.INJURED_SPEED; }
            }

            if(spd>0) player.body.setVelocity(vec.x*spd, vec.y*spd);
            else       player.body.setVelocity(0,0);

            // ── Killer logic ──
            if(isKiller){
                // Hit survivors
                if(isActionPressed()&&killerStunned<=0&&AntiCheat.validateAction('hit')){
                    this.survivors.forEach(function(s){
                        if(!s.alive||s.hooked) return;
                        var d=Phaser.Math.Distance.Between(player.x,player.y,s.x,s.y);
                        if(d<GAME_CONFIG.HIT_DISTANCE){
                            if(s.injured){
                                s.dying=true; s.setTint(0x666666);
                                UI.showToast('Выживший сбит с ног!');
                            } else {
                                s.injured=true; s.setTint(0xff6666);
                                survivorSpeedBoost=2; killerStunned=GAME_CONFIG.STUN_TIME;
                                UI.showToast('Выживший ранен!');
                            }
                        }
                    });
                }

                // AI survivor flee
                if(killerStunned<=0){
                    this.survivors.forEach(function(s){
                        if(!s.alive||s.hooked) return;
                        if(Math.random()<0.02) s.body.setVelocity((Math.random()-0.5)*60,(Math.random()-0.5)*60);
                        var d=Phaser.Math.Distance.Between(s.x,s.y,player.x,player.y);
                        if(d<150){
                            var a=Phaser.Math.Angle.Between(s.x,s.y,player.x,player.y);
                            var rs=s.injured?GAME_CONFIG.INJURED_SPEED:GAME_CONFIG.PLAYER_SPEED;
                            s.body.setVelocity(Math.cos(a)*rs,Math.sin(a)*rs);
                        }
                    });
                }

                // Hook dying survivor
                this.survivors.forEach(function(s){
                    if(!s.dying||s.hooked||s.carriedBy) return;
                    var d=Phaser.Math.Distance.Between(player.x,player.y,s.x,s.y);
                    if(d<GAME_CONFIG.HIT_DISTANCE&&isActionPressed()){
                        var hook=this.hooks.find(function(h){ return !h.occupied; });
                        if(hook){
                            s.hooked=true; s.x=hook.x; s.y=hook.y;
                            s.body.setVelocity(0,0);
                            hook.occupied=true; hook.hookedPlayer=s; hook.hookTimer=GAME_CONFIG.HOOK_TIME;
                            survivorsLeft--;
                            UI.showToast('Выживший повешен!');
                        }
                    }
                },this);

                // Damage generators
                generators.forEach(function(gen){
                    if(gen.repaired) return;
                    var d=Phaser.Math.Distance.Between(player.x,player.y,gen.x,gen.y);
                    if(d<50&&gen.progress>0&&isActionPressed()){
                        gen.progress=Math.max(0,gen.progress-dt/50);
                        drawBar(gen,gen.barX,gen.barY,0xff0000);
                        if(gen.progress<=0) gen.setTint(0x444444);
                    }
                });

                // Win check
                var allHooked=this.survivors.length>0&&this.survivors.every(function(s){ return s.hooked||!s.alive; });
                if(allHooked){
                    UI.showGameOver(false);
                    stopGame(); return;
                }
            }

            // ── Survivor logic ──
            if(!isKiller&&!player.dying&&!player.hooked){
                var nearGen=false;
                if(isActionPressed()){
                    generators.forEach(function(gen){
                        if(gen.repaired) return;
                        var d=Phaser.Math.Distance.Between(player.x,player.y,gen.x,gen.y);
                        if(d<50){
                            nearGen=true;
                            if(AntiCheat.validateAction('repair')){
                                gen.progress=Math.min(100,gen.progress+dt/100);
                            }
                            drawBar(gen,gen.barX,gen.barY,0xffff00);
                            if(gen.progress>=100){
                                gen.repaired=true;
                                gen.light.setAlpha(1);
                                gen.setTint(0x00ff00);
                                UI.showToast('⚙️ Генератор починен!');
                            }
                        }
                    });
                    // Hatch escape
                    if(this.hatch){
                        var dh=Phaser.Math.Distance.Between(player.x,player.y,this.hatch.x,this.hatch.y);
                        if(dh<40){ UI.showGameOver(true); stopGame(); return; }
                    }
                }
                if(nearGen) player.body.setVelocity(0,0);

                // Exit escape
                if(exitOpen){
                    var de=Phaser.Math.Distance.Between(player.x,player.y,this.exit.x,this.exit.y);
                    if(de<50){ UI.showGameOver(true); stopGame(); return; }
                }

                // Open exit when all gens done
                var rep=generators.filter(function(g){ return g.repaired; }).length;
                if(rep>=GAME_CONFIG.GENERATOR_COUNT&&!exitOpen){
                    exitOpen=true;
                    this.exit.setTint(0x00ff00).setVisible(true);
                    if(Math.random()<GAME_CONFIG.HATCH_APPEAR_CHANCE){
                        var hx=100+Math.random()*1000, hy=100+Math.random()*700;
                        this.hatch=this.add.sprite(hx,hy,'hatch').setTint(0xffaa00);
                        this.hatch.active=true;
                    }
                    UI.showToast('🚪 ВЫХОД ОТКРЫТ!');
                }
            }

            // Hook timers
            if(this.hooks){
                this.hooks.forEach(function(h){
                    if(h.occupied&&h.hookTimer>0){
                        h.hookTimer-=dt/1000;
                        if(h.hookTimer<=0&&!isKiller){ UI.showGameOver(false); stopGame(); return; }
                    }
                });
            }

            // HUD
            var rep2=generators.filter(function(g){ return g.repaired; }).length;
            var roleEl=document.getElementById('player-role');
            var genEl=document.getElementById('gen-count');
            var exitEl=document.getElementById('exit-state');
            var aliveEl=document.getElementById('alive-count');
            if(roleEl) roleEl.textContent=isKiller?'Убийца':(player.injured?'Ранен':(player.dying?'Падает':'Выживший'));
            if(genEl)  genEl.textContent=rep2+'/5';
            if(exitEl) exitEl.textContent=exitOpen?'открыт':'закрыт';
            if(aliveEl) aliveEl.textContent='Выжившие: '+survivorsLeft;

            player.setDepth(player.y+1000);
        }

        function drawBar(gen, bx, by, color){
            gen.bar.clear();
            gen.bar.fillStyle(0x000000,0.7);
            gen.bar.fillRect(bx-20,by-22,40,6);
            gen.bar.fillStyle(color);
            gen.bar.fillRect(bx-19,by-21,38*(gen.progress/100),4);
        }

        // ── Input ───────────────────────────────────────────────────────────
        var inputVector={x:0,y:0};
        var actionPressed=false;

        function initInput(scene){
            var gameScreen=document.getElementById('game-screen');

            // Joystick
            var joystick=document.createElement('div');
            joystick.setAttribute('data-joystick','true');
            joystick.style.cssText='position:fixed;bottom:30px;left:30px;width:110px;height:110px;z-index:9999;touch-action:none;';
            joystick.innerHTML='<div style="width:100%;height:100%;background:rgba(255,255,255,0.15);border:3px solid rgba(255,255,255,0.4);border-radius:50%;position:relative;"><div id="joystick-knob" style="width:45px;height:45px;background:rgba(255,50,50,0.9);border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)"></div></div>';
            document.body.appendChild(joystick);

            // Action button
            var actionBtn=document.createElement('div');
            actionBtn.setAttribute('data-action-btn','true');
            actionBtn.textContent='ДЕЙСТВИЕ';
            actionBtn.style.cssText='position:fixed;bottom:50px;right:30px;width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#ff6600,#ff3300);border:3px solid rgba(255,255,255,0.5);color:#fff;font-size:11px;font-weight:bold;display:flex;align-items:center;justify-content:center;z-index:9999;touch-action:none;';
            document.body.appendChild(actionBtn);

            var knob=document.getElementById('joystick-knob');
            var joyInner=joystick.firstChild;
            var touching=false, maxDist=45, joystickId=null;

            function updateJoystick(cx,cy){
                var rect=joyInner.getBoundingClientRect();
                var dx=cx-(rect.left+rect.width/2);
                var dy=cy-(rect.top+rect.height/2);
                var dist=Math.min(Math.sqrt(dx*dx+dy*dy),maxDist);
                var angle=Math.atan2(dy,dx);
                var nx=dist/maxDist*Math.cos(angle);
                var ny=dist/maxDist*Math.sin(angle);
                knob.style.transform='translate(calc(-50% + '+(nx*maxDist)+'px), calc(-50% + '+(ny*maxDist)+'px))';
                inputVector.x=nx; inputVector.y=ny;
            }
            function resetJoystick(){ touching=false; joystickId=null; inputVector.x=0; inputVector.y=0; knob.style.transform='translate(-50%,-50%)'; }

            joystick.addEventListener('touchstart',function(e){ e.preventDefault(); touching=true; joystickId=e.changedTouches[0].identifier; updateJoystick(e.touches[0].clientX,e.touches[0].clientY); },{passive:false});
            joystick.addEventListener('touchmove',function(e){ e.preventDefault(); if(touching){ for(var i=0;i<e.changedTouches.length;i++){ if(e.changedTouches[i].identifier===joystickId){ updateJoystick(e.changedTouches[i].clientX,e.changedTouches[i].clientY); break; } } } },{passive:false});
            joystick.addEventListener('touchend',resetJoystick);
            joystick.addEventListener('touchcancel',resetJoystick);

            // Mouse fallback for desktop testing
            joystick.addEventListener('mousedown',function(e){ touching=true; updateJoystick(e.clientX,e.clientY); });
            document.addEventListener('mousemove',function(e){ if(touching) updateJoystick(e.clientX,e.clientY); });
            document.addEventListener('mouseup',function(){ if(touching) resetJoystick(); });

            actionBtn.addEventListener('touchstart',function(e){ e.preventDefault(); actionPressed=true; actionBtn.style.transform='scale(0.95)'; },{passive:false});
            actionBtn.addEventListener('touchend',function(e){ e.preventDefault(); actionPressed=false; actionBtn.style.transform='scale(1)'; });
            actionBtn.addEventListener('touchcancel',function(){ actionPressed=false; actionBtn.style.transform='scale(1)'; });
            actionBtn.addEventListener('mousedown',function(){ actionPressed=true; actionBtn.style.transform='scale(0.95)'; });
            actionBtn.addEventListener('mouseup',function(){ actionPressed=false; actionBtn.style.transform='scale(1)'; });
        }

        function getInputVector(){ return inputVector; }
        function isActionPressed(){ return actionPressed; }

        // ── Multiplayer lobby ───────────────────────────────────────────────
        var currentPlayerId=null;
        var currentRoomId=null;
        var isHost=false;
        var roomUnsubscribe=null;

        function getTelegramId(){
            try{
                if(Telegram&&Telegram.WebApp&&Telegram.WebApp.initDataUnsafe&&Telegram.WebApp.initDataUnsafe.user){
                    return 'tg_'+Telegram.WebApp.initDataUnsafe.user.id;
                }
            } catch(e){}
            var saved=localStorage.getItem('userId');
            if(saved) return saved;
            var id='guest_'+Date.now()+'_'+Math.random().toString(36).substr(2,6);
            localStorage.setItem('userId',id);
            return id;
        }

        function createLobby(){
            if(!window.firebaseLoaded){ UI.showToast('Firebase не загружена'); return; }
            var code='room_'+Date.now()+'_'+Math.random().toString(36).substr(2,6);
            currentRoomId=code; isHost=true;
            UI.showScreen('lobby-create');
            document.getElementById('lobby-status').textContent='Создание лобби...';
            document.getElementById('lobby-players').innerHTML='<div class="player-slot host">👹 Маньяк (Вы)</div>';
            var hostName='Маньяк';
            try{ if(Telegram&&Telegram.WebApp&&Telegram.WebApp.initDataUnsafe&&Telegram.WebApp.initDataUnsafe.user) hostName=Telegram.WebApp.initDataUnsafe.user.first_name||'Маньяк'; }catch(e){}
            window.db.ref('rooms/'+code).set({
                code:code, hostId:currentPlayerId, hostName:hostName, status:'waiting', createdAt:Date.now(),
                players:{ [currentPlayerId]:{id:currentPlayerId,name:hostName,role:'killer',isHost:true} }
            }).then(function(){
                UI.showToast('Лобби создано!');
                document.getElementById('lobby-status').textContent='Ожидание игроков...';
                listenToRoom(code);
            }).catch(function(err){ UI.showToast('Ошибка: '+err.message); });
        }

        function joinLobby(){
            if(!window.firebaseLoaded){ UI.showToast('Firebase не загружена'); return; }
            UI.showScreen('lobby-join');
            document.getElementById('search-status').textContent='Поиск лобби...';
            var survivorName='Выживший';
            try{ if(Telegram&&Telegram.WebApp&&Telegram.WebApp.initDataUnsafe&&Telegram.WebApp.initDataUnsafe.user) survivorName=Telegram.WebApp.initDataUnsafe.user.first_name||'Выживший'; }catch(e){}
            var searchInterval=setInterval(function(){
                window.db.ref('rooms').once('value').then(function(snap){
                    var rooms=snap.val()||{};
                    var found=false;
                    Object.keys(rooms).forEach(function(rid){
                        var room=rooms[rid];
                        if(found||room.status!=='waiting') return;
                        var players=room.players||{};
                        if(Object.keys(players).length<4){
                            found=true; currentRoomId=rid; isHost=false;
                            window.db.ref('rooms/'+rid+'/players/'+currentPlayerId).set({id:currentPlayerId,name:survivorName,role:'survivor',isHost:false}).then(function(){
                                clearInterval(searchInterval);
                                UI.showScreen('lobby-create');
                                document.getElementById('lobby-status').textContent='Подключено к лобби';
                                document.getElementById('btn-start-game').style.display='none';
                                listenToRoom(rid);
                                UI.showToast('Подключился к лобби');
                            });
                        }
                    });
                    if(!found) document.getElementById('search-status').textContent='Поиск лобби... (нет доступных комнат)';
                }).catch(function(err){ document.getElementById('search-status').textContent='Ошибка: '+err.message; clearInterval(searchInterval); });
            },2000);
            document.getElementById('btn-leave-search').onclick=function(){ clearInterval(searchInterval); UI.showScreen('main-menu'); };
        }

        function listenToRoom(roomCode){
            if(roomUnsubscribe) roomUnsubscribe();
            var ref=window.db.ref('rooms/'+roomCode);
            ref.on('value',function(snap){
                if(!snap.exists()) return;
                var data=snap.val();
                var players=data.players||{};
                var count=Object.keys(players).length;
                var html='';
                Object.values(players).forEach(function(p){
                    var cls=p.role==='killer'?'host':'';
                    html+='<div class="player-slot '+cls+'">'+(p.role==='killer'?'👹':'🏃')+' '+p.name+'</div>';
                });
                for(var i=count;i<4;i++) html+='<div class="player-slot empty">⏳ Ожидание...</div>';
                document.getElementById('lobby-players').innerHTML=html;
                var btnStart=document.getElementById('btn-start-game');
                if(isHost){
                    if(count>=2){ btnStart.disabled=false; btnStart.textContent='Начать игру ('+count+'/4)'; btnStart.style.background='#ff3333'; }
                    else { btnStart.disabled=true; btnStart.textContent='Начать (ждём игроков)'; btnStart.style.background='#666'; }
                }
                if(data.status==='playing'){
                    ref.off(); roomUnsubscribe=null;
                    startMultiplayerGame(data);
                }
            });
            roomUnsubscribe=function(){ ref.off(); };
        }

        function startMultiplayerGame(roomData){
            isKiller=(currentPlayerId===roomData.hostId);
            exitOpen=false; survivorsLeft=4; catchCooldown=0; generators=[];
            UI.showScreen('game-screen');
            UI.showToast(isKiller?'Поймай всех!':'Найди генераторы!');
            setTimeout(initGame,100);
        }

        window.leaveLobby=function(){
            if(roomUnsubscribe){ roomUnsubscribe(); roomUnsubscribe=null; }
            if(currentRoomId&&window.firebaseLoaded){
                window.db.ref('rooms/'+currentRoomId+'/players/'+currentPlayerId).remove();
            }
            currentRoomId=null; isHost=false;
            UI.showScreen('main-menu');
            UI.showToast('Вы вышли из лобби');
        };

        // ── App init ────────────────────────────────────────────────────────
        function initApp(){
            if(typeof Phaser==='undefined'||typeof Phaser.Game==='undefined') return false;
            currentPlayerId=getTelegramId();
            document.getElementById('loading-screen').classList.remove('active');
            document.getElementById('main-menu').classList.add('active');
            setupButtons();
            try{ Telegram.WebApp.ready(); Telegram.WebApp.expand(); }catch(e){}
            return true;
        }

        var attempts=0;
        function tryInit(){
            if(initApp()) return;
            if(++attempts<60) setTimeout(tryInit,100);
            else { var p=document.querySelector('#loading-screen p'); if(p) p.textContent='Ошибка загрузки — проверьте интернет'; }
        }
        tryInit();

        function setupButtons(){
            function on(id,fn){ var el=document.getElementById(id); if(el) el.onclick=fn; }
            on('btn-solo',       function(){ UI.showScreen('role-select'); });
            on('btn-multi',      function(){ UI.showScreen('role-select'); });
            on('btn-play-killer',function(){ startGame(true); });
            on('btn-play-survivor',function(){ startGame(false); });
            on('btn-back-menu',  function(){ stopGame(); UI.showScreen('main-menu'); });
            on('btn-start-game', function(){
                if(!currentRoomId||!isHost) return;
                window.db.ref('rooms/'+currentRoomId).update({status:'playing'}).then(function(){ UI.showToast('Игра началась!'); });
            });
            on('btn-leave-lobby', window.leaveLobby);
        }

    })();
    </script>
</body>
