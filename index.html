<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#111;color:#fff;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#app{width:100%;height:100%;position:relative;overflow:hidden}
.screen{position:fixed;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,#111 0%,#1a1a1a 100%)}
.screen.active{display:flex}
#game-screen.active{display:block!important;padding:0;background:#1a1a1a}
h1{font-size:28px;color:#ff3333;margin-bottom:30px;text-align:center;text-shadow:0 0 20px rgba(255,51,51,.5)}
h2{font-size:22px;color:#ff3333;margin-bottom:20px;text-align:center}
.btn{width:210px;padding:14px 20px;margin:7px 0;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;background:#333;color:#fff;touch-action:manipulation}
.btn.primary{background:linear-gradient(135deg,#ff3333,#cc0000)}
.btn.secondary{background:#444}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:active{transform:scale(.97)}
.menu-buttons{display:flex;flex-direction:column;align-items:center}
.player-slot{padding:10px 18px;background:rgba(255,255,255,.08);border-radius:6px;text-align:center;border:1px solid rgba(255,255,255,.15);font-size:15px;margin:4px 0;width:100%;max-width:280px}
.player-slot.host{background:rgba(255,51,51,.25);border-color:#ff3333;color:#ff8888}
.player-slot.empty{color:#555;font-style:italic}
#lobby-players{display:flex;flex-direction:column;align-items:center;margin:15px 0;width:100%}
#lobby-status,#search-status{font-size:15px;color:#aaa;margin-bottom:8px;text-align:center}
.version{position:absolute;bottom:15px;color:#555;font-size:11px}
.loader{width:38px;height:38px;border:3px solid #333;border-top-color:#ff3333;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:15px}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:140px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.92);color:#fff;padding:11px 22px;border-radius:8px;font-size:14px;z-index:99999;display:none;white-space:nowrap;pointer-events:none}
#toast.show{display:block;animation:fadeInOut 2.5s forwards}
@keyframes fadeInOut{0%{opacity:0;transform:translateX(-50%) translateY(15px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}75%{opacity:1}100%{opacity:0}}
#hud{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none;z-index:9000;flex-wrap:wrap;gap:4px}
#hud>div{background:rgba(0,0,0,.75);padding:6px 10px;border-radius:6px;font-size:11px;white-space:nowrap}
#hud #role-indicator{color:#ff8888;font-weight:700}
#game-container{width:100%;height:100%;position:fixed;top:0;left:0;z-index:10;background:#1a1a1a}
#game-container canvas{display:block!important;visibility:visible!important}
#game-over{z-index:10000}
#game-result-message{color:#aaa;margin-bottom:25px;text-align:center;font-size:15px}

<script>
(function(){
'use strict';
/* ═══════ CONSTANTS ═══════ */
var C={
  MAP_W:2400,MAP_H:1800,
  PLAYER_SPEED:145,KILLER_SPEED:162,INJURED_SPEED:115,DYING_SPEED:38,
  HIT_DIST:58,INTERACT_DIST:62,
  STUN_TIME:1.8,BOOST_TIME:2.2,
  HOOK_TIME:90,
  GEN_REPAIR_RATE:100/28,GEN_BREAK_RATE:100/10,
  HEAL_RATE:100/18,UNHOOK_RATE:100/4,
  GATE_RATE:100/20,
  GEN_COUNT:5
};
/* ═══════ USER INIT ═══════ */
var gUser=null,gIsTelegram=false;
function getTelegramUser(){
  try{if(Telegram&&Telegram.WebApp&&Telegram.WebApp.initDataUnsafe&&Telegram.WebApp.initDataUnsafe.user){
    var u=Telegram.WebApp.initDataUnsafe.user;
    return{id:'tg_'+u.id,name:u.first_name||'Игрок',username:u.username||'',photo:u.photo_url||''};
  }}catch(e){}
  return null;
}
function isRunningInTelegram(){
  try{return!!Telegram&&!!Telegram.WebApp&&!!Telegram.WebApp.initDataUnsafe&&!!Telegram.WebApp.initDataUnsafe.user;}catch(e){return false;}
}
function initUser(callback){
  var tgUser=getTelegramUser();
  gIsTelegram=isRunningInTelegram();
  if(gIsTelegram&&tgUser){
    if(!window.fsLoaded){console.warn('Firestore not loaded');callback&&callback(null);return;}
    window.fbFS.collection('users').doc(tgUser.id).get().then(function(doc){
      if(doc.exists){
        gUser={id:tgUser.id,name:tgUser.name,isNew:false};
        console.log('Existing user:',gUser);
      } else {
        gUser={id:tgUser.id,name:tgUser.name,isNew:true};
        window.fbFS.collection('users').doc(tgUser.id).set({
          id:tgUser.id,name:tgUser.name,username:tgUser.username,photo:tgUser.photo,
          createdAt:firebase.firestore.FieldValue.serverTimestamp(),lastSeen:firebase.firestore.FieldValue.serverTimestamp(),gamesPlayed:0,gamesWon:0
        }).then(function(){
          console.log('New user created:',gUser);
        }).catch(function(e){console.error('User write error:',e);});
      }
      callback&&callback(gUser);
    }).catch(function(e){console.error('User read error:',e);callback&&callback(null);});
  } else {
    var s=localStorage.getItem('uid');if(s){gUser={id:s,name:'Игрок',isNew:false};callback&&callback(gUser);return;}
    var id='g_'+Date.now()+'_'+Math.random().toString(36).substr(2,6);
    localStorage.setItem('uid',id);gUser={id:id,name:'Игрок',isNew:true};callback&&callback(gUser);
  }
}
/* ═══════ UI ═══════ */

  toast:function(msg){var t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.remove('show');void t.offsetWidth;t.classList.add('show');},
  gameOver:function(won,msg){var ti=document.getElementById('game-result-title');var m=document.getElementById('game-result-message');if(ti)ti.textContent=won?'🎉 ПОБЕДА!':'💀 ПОРАЖЕНИЕ';if(m)m.textContent=msg||'';UI.showScreen('game-over');}
};
/* ═══════ GAME STATE ═══════ */
var gGame=null,gScene=null,gIsKiller=false;
var gGenerators=[],gHooks=[],gGates=[],gHatch=null,gStaticGroup=null;
var gExitOpen=false,gHatchOpen=false,gHatchClosed=false,gSurvivorsAlive=0;
var gMyPlayer=null,gAIPlayers=[];
var gKillerStun=0,gBoostTimer=0,gActionPressed=false,gInputVec={x:0,y:0};
var _floatBars=[],_floatBarGfx=null,_keys={};
var gGameEnded=false;

/* ═══════ TEXTURES ═══════ */
function buildTextures(sc){
  var g=sc.make.graphics({x:0,y:0,add:false});

  /* ─── GROUND with grass pattern ─── */
  g.fillStyle(0x1a2610);g.fillRect(0,0,64,64);

  g.fillStyle(0x2a4018);
  for(var i=0;i<25;i++){g.fillCircle(Math.random()*64,Math.random()*64,1.5);}
  g.fillStyle(0x1e2e12);
  g.fillRect(0,0,64,2);g.fillRect(0,62,64,2);
  g.fillRect(0,0,2,64);g.fillRect(62,0,2,64);
  g.generateTexture('ground',64,64);g.clear();

  /* ─── FENCE POST ─── */
  // Wooden post with grain
  g.fillStyle(0x5a4a3a);g.fillRect(4,0,16,64);

  /* ─── FENCE RAIL ─── */

  g.fillStyle(0x6b5a48);g.fillRect(0,2,64,2);
  g.fillStyle(0x4a3a2a);g.fillRect(0,8,64,2);
  g.generateTexture('fence_rail',64,12);g.clear();

  /* ─── BRICK WALL ─── */

  g.fillStyle(0x8B4513);g.fillRect(0,0,48,24);
  // Brick pattern
  g.fillStyle(0x6B3008);g.fillRect(0,0,48,2); // mortar top
  g.fillStyle(0x6B3008);g.fillRect(0,11,48,2); // mortar middle

  g.fillStyle(0x9a5520,0.4);g.fillRect(26,3,18,6);
  g.fillStyle(0x9a5520,0.4);g.fillRect(3,14,18,6);
  g.fillStyle(0x9a5520,0.4);g.fillRect(26,14,18,6);
  g.generateTexture('brick',48,24);g.clear();

  /* ─── STONE ─── */
  g.fillStyle(0x696969);g.fillEllipse(22,18,42,34);
  g.fillStyle(0x808080);g.fillEllipse(22,20,38,30);

  /* ─── TREE ─── */

  g.fillStyle(0x5a4030);g.fillRect(17,40,3,30);
  g.fillStyle(0x3a2515);g.fillRect(23,40,2,30);

  g.generateTexture('tree',42,72);g.clear();

  /* ─── BUSH ─── */
  g.fillStyle(0x1a5a10);g.fillCircle(18,16,16);
  g.fillStyle(0x228a20);g.fillCircle(9,14,10);g.fillCircle(26,12,11);g.fillCircle(18,8,9);
  g.fillStyle(0x2aaa2a);g.fillCircle(6,16,6);g.fillCircle(30,16,6);g.fillCircle(18,4,6);

function getMapObstacles(){
  var obs=[];
  function addBrickRow(sx,sy,n){for(var i=0;i<n;i++)obs.push({t:'brick',x:sx+i*50,y:sy,sw:46,sh:22,solid:true});}
  function addBrickCol(sx,sy,n){for(var i=0;i<n;i++)obs.push({t:'brick',x:sx,y:sy+i*26,sw:46,sh:22,solid:true});}
  // Brick wall compounds
  addBrickRow(280,260,5);addBrickCol(280,260,6);
  addBrickRow(880,340,6);addBrickCol(880,340,5);
  addBrickRow(1880,580,5);addBrickCol(1880,580,6);
  addBrickRow(360,1380,5);addBrickCol(360,1380,5);
  addBrickRow(1580,1040,5);addBrickCol(1580,1040,4);
  addBrickRow(1080,1480,6);
  addBrickCol(680,820,5);addBrickRow(680,820,4);
  // More corridors
  addBrickRow(1200,500,4);addBrickCol(1200,500,4);
  addBrickRow(500,1100,4);addBrickCol(500,1100,4);
  addBrickRow(1700,1300,4);addBrickCol(1700,1300,4);

  // Stones
  [[200,400],[500,200],[1200,300],[1800,200],[2200,500],
   [300,1000],[600,1400],[1400,900],[2000,1100],[1700,1600],
   [800,1600],[1100,700],[1500,400],[2100,1400],[450,700],
   [950,1200],[1700,350],[2300,900],[400,1550],[1600,250],
   [1050,1600],[750,450],[1800,1000],[2200,1200]
  ].forEach(function(p){obs.push({t:'stone',x:p[0],y:p[1],sw:44,sh:38,solid:true});});

  // Trees (decorative)
  [[150,150],[600,100],[1100,150],[1600,100],[2200,200],
   [100,600],[400,400],[900,500],[1400,300],[2000,400],
   [150,1100],[500,900],[1000,1300],[1500,1100],[2100,800],
   [300,1700],[700,1700],[1200,1700],[1700,1700],[2200,1600],
   [50,400],[50,1200],[2350,600],[2350,1200],
   [800,300],[1300,550],[1900,1000],[700,1100],[550,1650],
   [1400,1550],[850,750],[1600,700],[2150,1000]
  ].forEach(function(p){obs.push({t:'tree',x:p[0],y:p[1],sw:40,sh:68,solid:false});});

  // Bushes (decorative)
  [[250,500],[700,300],[1050,400],[1800,700],[2100,300],
   [350,1200],[800,1000],[1300,1400],[1600,800],[2200,1200],
   [600,600],[1100,900],[1700,1300],[900,1500],[2000,600],
   [450,850],[1250,750],[1750,900],[600,1250],[1850,1450]
  ].forEach(function(p){obs.push({t:'bush',x:p[0],y:p[1],sw:36,sh:30,solid:false});});

  // Shack 1
  addShack(obs,500,1050);
  // Shack 2
  addShack(obs,1700,650);
  // Shack 3
  addShack(obs,1050,1200);

  return obs;
}

function addShack(obs,sx,sy){
  var sw2=240,sh2=160,wt=20;
  // top wall with door gap
  obs.push({t:'shack_wall',x:sx,y:sy,sw:90,sh:wt,solid:true});
  obs.push({t:'shack_wall',x:sx+sw2-90,y:sy,sw:90,sh:wt,solid:true});
  // bottom wall with door gap
  obs.push({t:'shack_wall',x:sx,y:sy+sh2,sw:90,sh:wt,solid:true});
  obs.push({t:'shack_wall',x:sx+sw2-90,y:sy+sh2,sw:90,sh:wt,solid:true});
  // left wall
  for(var i=0;i<sh2/wt;i++)obs.push({t:'shack_wall',x:sx,y:sy+i*wt,sw:wt,sh:wt,solid:true});
  // right wall
  for(var j=0;j<sh2/wt;j++)obs.push({t:'shack_wall',x:sx+sw2-wt,y:sy+j*wt,sw:wt,sh:wt,solid:true});
}

/* ═══════ START / STOP ═══════ */
function startSoloGame(killerMode){
  gIsKiller=killerMode;
  resetState();
  showGameScreen();
  setTimeout(initPhaser,80);
}
function resetState(){
  gGameEnded=false;
  gGenerators=[];gHooks=[];gGates=[];gHatch=null;gStaticGroup=null;
  gExitOpen=false;gHatchOpen=false;gHatchClosed=false;
  gSurvivorsAlive=gIsKiller?3:0;
  gMyPlayer=null;gAIPlayers=[];
  gKillerStun=0;gBoostTimer=0;gActionPressed=false;gInputVec={x:0,y:0};
  _floatBars=[];_floatBarGfx=null;
}
function showGameScreen(){
  UI.showScreen('game-screen');
  var gs=document.getElementById('game-screen');
  var gc=document.getElementById('game-container');
  if(gs)gs.style.cssText='display:block!important;position:fixed!important;top:0!important;left:0!important;width:100%!important;height:100%!important;z-index:100!important;';
  if(gc)gc.style.cssText='display:block!important;position:fixed!important;top:0!important;left:0!important;width:100%!important;height:100%!important;background:#1a1a1a!important;z-index:1!important;';
}
function stopGame(){
  removeControls();
  if(gGame){gGame.destroy(true);gGame=null;}
  gScene=null;
}
function initPhaser(){
  if(gGame){gGame.destroy(true);gGame=null;}
  document.getElementById('game-container').innerHTML='';
  var W=window.innerWidth||800,H=window.innerHeight||600;
  gGame=new Phaser.Game({
    type:Phaser.CANVAS,parent:'game-container',width:W,height:H,
    backgroundColor:'#1a1a1a',
    physics:{default:'arcade',arcade:{gravity:{y:0},debug:false}},
    scene:{preload:gPreload,create:gCreate,update:gUpdate},
    scale:{mode:Phaser.Scale.RESIZE,autoCenter:Phaser.Scale.CENTER_BOTH}
  });
}

/* ═══════ PHASER SCENE ═══════ */
function gPreload(){buildTextures(this);}

function gCreate(){
  gScene=this;
  var W=C.MAP_W,H=C.MAP_H;
  this.physics.world.setBounds(0,0,W,H);

  // Ground with multiple layers for depth
  for(var x=0;x<W;x+=64)for(var y=0;y<H;y+=64){
    var tile=this.add.image(x+32,y+32,'ground').setAlpha(0.6+Math.random()*0.35);
    tile.setDepth(0);
  }

  // Dark grass patches for variation
  var darkPatches=[[300,300],[900,500],[1500,400],[600,900],[1800,800],[1200,1200],[2100,1400],[400,1600]];
  darkPatches.forEach(function(p){
    var c=this.add.graphics();
    c.fillStyle(0x0a1208,0.4);
    c.fillCircle(p[0],p[1],80+Math.random()*60);
    c.setDepth(1);
  },this);

  // Static group for all solid obstacles
  gStaticGroup=this.physics.add.staticGroup();

  // Iron fence border (visual + solid)
  buildFence.call(this,W,H);

  // Obstacles
  var obstacles=getMapObstacles();
  obstacles.forEach(function(o){
    if(o.solid){
      var sp=gStaticGroup.create(o.x+o.sw/2, o.y+o.sh/2, o.t);
      sp.setDisplaySize(o.sw,o.sh);
      sp.refreshBody();
      sp.setDepth(o.y+o.sh/2);
    } else {
      var img=gScene.add.image(o.x+o.sw/2, o.y+o.sh/2, o.t);
      img.setDisplaySize(o.sw,o.sh);
      img.setDepth(o.y+o.sh/2+1);
    }
  });

  // Ambient particles (fireflies/dust)
  for(var i=0;i<50;i++){
    var px=Math.random()*W,py=Math.random()*H;
    var dot=this.add.graphics();
    dot.fillStyle(0xffffaa,0.3+Math.random()*0.3);
    dot.fillCircle(0,0,1+Math.random()*2);
    dot.setDepth(5000);
    dot._baseY=py;dot._speed=0.5+Math.random();dot._phase=Math.random()*Math.PI*2;
  }

  // Generators with glow
  [{x:300,y:200},{x:2100,y:200},{x:1200,y:900},{x:300,y:1600},{x:2100,y:1600}]
  .forEach(function(p,i){
    // Glow aura
    var glow=this.add.graphics();
    glow.fillStyle(0x00ff44,0.1);
    glow.fillCircle(p.x,p.y,40);
    glow.setDepth(p.y+1);
    // Generator sprite
    var sp=this.add.sprite(p.x,p.y,'gen').setDepth(p.y+2);
    sp.genId=i;sp.progress=0;sp.repaired=false;
    sp.barGfx=this.add.graphics().setDepth(p.y+3);
    sp.bx=p.x;sp.by=p.y;
    sp.glowGfx=glow;
    gGenerators.push(sp);
  },this);

  // Hooks with subtle glow
  [{x:500,y:450},{x:1900,y:450},{x:500,y:1350},{x:1900,y:1350},
   {x:1200,y:500},{x:1200,y:1300},{x:800,y:900},{x:1600,y:900}]
  .forEach(function(p){
    var sp=this.add.sprite(p.x,p.y,'hook').setDepth(p.y+1).setScale(1.3);
    sp.occupied=false;sp.hookedSurvivor=null;sp.hookTimer=0;sp.bx=p.x;sp.by=p.y;
    gHooks.push(sp);
  },this);

  // Gates (left & right edges) with glow when open
  [{x:30,y:900},{x:C.MAP_W-30,y:900}]
  .forEach(function(p){
    var sp=this.add.sprite(p.x,p.y,'gate').setDepth(p.y+1).setScale(1.8);
    sp.progress=0;sp.opened=false;
    sp.barGfx=this.add.graphics().setDepth(p.y+2);
    sp.bx=p.x;sp.by=p.y;
    gGates.push(sp);
  },this);

  // Spawn players
  spawnPlayers.call(this);

  // Camera
  this.cameras.main.setBounds(0,0,W,H);
  this.cameras.main.startFollow(gMyPlayer.sprite,true,0.1,0.1);
  this.cameras.main.setBackgroundColor('#050505');

  // Fog overlay (dark vignette at edges)
  var fog=this.add.graphics().setScrollFactor(0).setDepth(59999);
  fog.fillStyle(0x000000,0.6);
  fog.fillRect(0,0,W,H);
  // Clear center for visibility
  fog.fillStyle(0x000000,0);
  var cx=W/2,cy=H/2;
  fog.fillCircle(cx,cy,Math.min(W,H)*0.35);
  // Gradient edges
  for(var r=Math.min(W,H)*0.35;r<Math.max(W,H)*0.7;r+=50){
    fog.fillStyle(0x000000,0.02);
    fog.fillCircle(cx,cy,r);
  }

  // Floating bar graphics (world space)
  _floatBarGfx=this.add.graphics().setDepth(55000);

  // Controls
  createControls();

  UI.toast(gIsKiller?'🔪 Поймай всех выживших!':'⚙️ Почини все генераторы!');
}

function buildFence(W,H){
  var step=48;
  // Top & bottom rows
  for(var x=0;x<=W;x+=step){
    placeFencePost.call(this,x,0);
    placeFencePost.call(this,x,H);
  }
  // Left & right columns (skip corners)
  for(var y=step;y<H;y+=step){
    placeFencePost.call(this,0,y);
    placeFencePost.call(this,W,y);
  }
}
function placeFencePost(x,y){
  var sp=gStaticGroup.create(x,y,'fence_post');
  sp.setDisplaySize(20,60);
  sp.refreshBody();
}

function spawnPlayers(){
  var kSpawn={x:1200,y:900};
  var sSpawns=[{x:200,y:200},{x:2200,y:200},{x:200,y:1600},{x:2200,y:1600}];

  if(gIsKiller){
    gMyPlayer=makePlayer(this,kSpawn.x,kSpawn.y,'killer',true);
    this.physics.add.collider(gMyPlayer.sprite,gStaticGroup);
    var sTex=['s1','s2','s3'];
    sTex.forEach(function(t,i){
      var ai=makePlayer(gScene,sSpawns[i].x,sSpawns[i].y,t,false);
      ai.aiDir={x:0,y:0};ai.aiTimer=0;
      gScene.physics.add.collider(ai.sprite,gStaticGroup);
      gAIPlayers.push(ai);
    });
    // survivors collide with each other
    gAIPlayers.forEach(function(a){
      gScene.physics.add.collider(gMyPlayer.sprite,a.sprite);
      gAIPlayers.forEach(function(b){if(a!==b)gScene.physics.add.collider(a.sprite,b.sprite);});
    });
  } else {
    gMyPlayer=makePlayer(this,sSpawns[0].x,sSpawns[0].y,'s1',true);
    this.physics.add.collider(gMyPlayer.sprite,gStaticGroup);
    // AI killer far away
    var aiK=makePlayer(this,kSpawn.x,kSpawn.y,'killer',false);
    aiK.isAIKiller=true;aiK.aiTimer=0;aiK.aiHitCooldown=0;
    this.physics.add.collider(aiK.sprite,gStaticGroup);
    this.physics.add.collider(gMyPlayer.sprite,aiK.sprite);
    gAIPlayers.push(aiK);
    gSurvivorsAlive=1;
  }
}

function makePlayer(scene,x,y,tex,isMe){
  var sp=scene.add.sprite(x,y,tex);
  sp.setDepth(1000+y);
  scene.physics.add.existing(sp);
  sp.body.setCollideWorldBounds(true);
  sp.body.setSize(24,28,true);

  // Player glow aura
  var glow=scene.add.graphics();
  var glowColor=(tex==='killer')?0xff2222:0x44aaff;
  glow.fillStyle(glowColor,0.15);
  glow.fillCircle(0,0,25);
  glow.setDepth(999);
  glow.setAlpha(0.5);

  var p={sprite:sp,tex:tex,role:(tex==='killer')?'killer':'survivor',
    state:'alive',health:100,hookTimer:0,carryTarget:null,progressAction:null,isMe:isMe,
    glowFx:glow,glowColor:glowColor};
  sp._pRef=p;
  return p;
}

/* ═══════ MAIN UPDATE ═══════ */
var _gameTime=0;
function gUpdate(time,dt){
  if(!gScene||!gMyPlayer||gGameEnded)return;
  _gameTime+=dt;

  // Animate generator glows (pulsing)
  gGenerators.forEach(function(gen,i){
    if(gen.glowGfx&&!gen.repaired){
      var pulse=0.8+Math.sin(_gameTime*0.003+i)*0.3;
      gen.glowGfx.setAlpha(pulse*0.15);
    }
  });

  // Animate player glow
  var allPlayers=[gMyPlayer].concat(gAIPlayers);
  allPlayers.forEach(function(p){
    if(p.glowFx){
      var pulse=0.5+Math.sin(_gameTime*0.004)*0.2;
      p.glowFx.setAlpha(pulse*0.4);
      p.glowFx.setPosition(p.sprite.x,p.sprite.y);
    }
  });

  // Animate gate glow when exit open
  if(gExitOpen){
    gGates.forEach(function(gate){
      if(gate.glowGfx){
        var gp=0.6+Math.sin(_gameTime*0.005)*0.4;
        gate.glowGfx.setAlpha(gp*0.3);
      }
    });
  }

  // Animate hatch glow
  if(gHatch&&gHatch.glowGfx){
    var hp=0.7+Math.sin(_gameTime*0.006)*0.3;
    gHatch.glowGfx.setAlpha(hp*0.25);
  }

  updateMyPlayer(dt);
  updateAI(dt);
  updateHooks(dt);
  flushFloatBars();
  updateHUD();
  checkWinLose();
}

function checkWinLose(){
  if(gGameEnded)return;
  if(gIsKiller){
    var any=gAIPlayers.some(function(a){return a.state!=='dead'&&a.state!=='hooked';});
    var anyHooked=gAIPlayers.some(function(a){return a.state==='hooked';});
    // killer wins when no survivor is alive (not hooked, not dead - dead means timer ran out)
    var alive=gAIPlayers.filter(function(a){return a.state!=='dead';}).length;
    if(alive===0){doEndGame(false,'Ты поймал всех выживших!');}
  } else {
    if(gMyPlayer.state==='dead'){doEndGame(false,'Тебя поймали!');}
    if((gMyPlayer.state==='alive'||gMyPlayer.state==='injured')){
      if(gExitOpen){
        gGates.forEach(function(gate){
          if(gate.opened&&dist(gMyPlayer.sprite,gate)<80){doEndGame(true,'Ты сбежал через ворота!');}
        });
        if(gHatch&&gHatchOpen&&!gHatchClosed&&dist(gMyPlayer.sprite,gHatch)<50){
          doEndGame(true,'Ты сбежал через люк!');
        }
      }
    }
  }
}

function doEndGame(won,msg){
  if(gGameEnded)return;
  gGameEnded=true;
  setTimeout(function(){stopGame();UI.gameOver(won,msg);},600);
}

/* ─── My player ─── */
function updateMyPlayer(dt){
  var p=gMyPlayer,sp=p.sprite;
  sp.setDepth(1000+sp.y);
  if(p.role==='killer'){
    if(gKillerStun>0){gKillerStun-=dt/1000;sp.body.setVelocity(0,0);return;}
    var spd=C.KILLER_SPEED;
    var v=normalize(gInputVec);
    sp.body.setVelocity(v.x*spd,v.y*spd);
    if(gActionPressed)killerAction(dt);
  } else {
    if(p.state==='hooked'){sp.body.setVelocity(0,0);return;}
    if(p.state==='dead'){sp.body.setVelocity(0,0);return;}
    var spd2=C.PLAYER_SPEED;
    if(p.state==='injured')spd2=C.INJURED_SPEED;
    if(p.state==='dying')spd2=C.DYING_SPEED;
    if(gBoostTimer>0){gBoostTimer-=dt/1000;spd2=Math.min(spd2*1.25,C.PLAYER_SPEED*1.25);}
    var v2=normalize(gInputVec);
    sp.body.setVelocity(v2.x*spd2,v2.y*spd2);
    if(gActionPressed)survivorAction(dt);
    else cancelProgress(p);
  }
}

function killerAction(dt){
  var p=gMyPlayer,sp=p.sprite;
  // Carrying survivor → go to hook
  if(p.carryTarget){
    var ct=p.carryTarget;
    ct.sprite.setPosition(sp.x,sp.y-28);
    var hook=nearestFreeHook(sp);
    if(hook&&dist(sp,hook)<C.INTERACT_DIST+20){
      hangSurvivor(ct,hook);
      p.carryTarget=null;
      UI.toast('🪝 Выживший повешен!');
    }
    return;
  }
  // Hit nearby survivor
  var target=nearestAliveTarget(sp,C.HIT_DIST);
  if(target){
    var t=target._pRef;
    if(!t)return;
    if(t.state==='alive'){
      t.state='injured';t.sprite.setTint(0xff8888);
      gKillerStun=C.STUN_TIME;
      if(t.isMe)gBoostTimer=C.BOOST_TIME;
      UI.toast('💥 Выживший ранен!');
    } else if(t.state==='injured'){
      t.state='dying';t.sprite.setTint(0xff4444);
      gKillerStun=C.STUN_TIME;
      UI.toast('⬇️ Выживший упал!');
    } else if(t.state==='dying'){
      p.carryTarget=t;
      UI.toast('💪 Поднимаешь выжившего...');
    }
    return;
  }
  // Break generator
  gGenerators.forEach(function(gen){
    if(gen.repaired||gen.progress<=0)return;
    if(dist(sp,gen)<C.INTERACT_DIST){
      gen.progress=Math.max(0,gen.progress-C.GEN_BREAK_RATE*(dt/1000));
      drawBar(gen.barGfx,gen.bx,gen.by,gen.progress,0xff3322);
      if(gen.progress<=0){gen.setTint(0x444444);if(gen.glowGfx)gen.glowGfx.setAlpha(0);UI.toast('💥 Генератор сломан!');}
    }
  });
  // Close hatch
  if(gHatch&&gHatchOpen&&!gHatchClosed&&dist(sp,gHatch)<C.INTERACT_DIST){
    gHatchClosed=true;gHatchOpen=false;
    gHatch.setTint(0x220000);
    UI.toast('🔒 Маньяк закрыл люк!');
  }
}

function survivorAction(dt){
  var p=gMyPlayer,sp=p.sprite;
  if(p.state==='dying'||p.state==='hooked')return;
  var acted=false;
  // Repair generator
  if(!acted)gGenerators.some(function(gen){
    if(gen.repaired)return false;
    if(dist(sp,gen)<C.INTERACT_DIST){
      acted=true;sp.body.setVelocity(0,0);
      if(!p.progressAction||p.progressAction.target!==gen)p.progressAction={type:'repair',target:gen};
      gen.progress=Math.min(100,gen.progress+C.GEN_REPAIR_RATE*(dt/1000));
      drawBar(gen.barGfx,gen.bx,gen.by,gen.progress,0xffee00);
      if(gen.progress>=100){gen.repaired=true;gen.setTint(0x22ff66);if(gen.glowGfx)gen.glowGfx.setAlpha(0);p.progressAction=null;UI.toast('✅ Генератор починен!');checkAllGens();}
      return true;
    }
  });
  // Unhook survivor
  if(!acted)gHooks.some(function(hook){
    if(!hook.occupied||!hook.hookedSurvivor)return false;
    var hs=hook.hookedSurvivor;if(hs===p)return false;
    if(dist(sp,hook)<C.INTERACT_DIST){
      acted=true;sp.body.setVelocity(0,0);
      if(!p.progressAction||p.progressAction.target!==hook)p.progressAction={type:'unhook',target:hook,pct:0};
      p.progressAction.pct=Math.min(100,(p.progressAction.pct||0)+C.UNHOOK_RATE*(dt/1000));
      _floatBars.push({wx:hook.bx,wy:hook.by-30,pct:p.progressAction.pct,color:0x88aaff});
      if(p.progressAction.pct>=100){
        hs.state='injured';hs.sprite.setTint(0xff8888);
        hs.sprite.setPosition(hook.x+30,hook.y);hs.sprite.setVisible(true);
        hook.occupied=false;hook.hookedSurvivor=null;hook.hookTimer=0;
        p.progressAction=null;UI.toast('🙌 Снят с крюка!');
      }
      return true;
    }
  });
  // Heal nearby survivor
  if(!acted)gAIPlayers.some(function(ai){
    if(ai.state!=='injured')return false;
    if(dist(sp,ai.sprite)<C.INTERACT_DIST){
      acted=true;sp.body.setVelocity(0,0);
      if(!p.progressAction||p.progressAction.target!==ai)p.progressAction={type:'heal',target:ai,pct:0};
      p.progressAction.pct=Math.min(100,(p.progressAction.pct||0)+C.HEAL_RATE*(dt/1000));
      _floatBars.push({wx:ai.sprite.x,wy:ai.sprite.y-42,pct:p.progressAction.pct,color:0x44ff88});
      if(p.progressAction.pct>=100){
        ai.state='alive';ai.sprite.clearTint();
        p.progressAction=null;UI.toast('💊 Вылечен!');
      }
      return true;
    }
  });
  // Open gate
  if(!acted)gGates.some(function(gate){
    if(gate.opened)return false;
    if(!gExitOpen)return false;
    if(dist(sp,gate)<C.INTERACT_DIST+30){
      acted=true;sp.body.setVelocity(0,0);
      if(!p.progressAction||p.progressAction.target!==gate)p.progressAction={type:'gate',target:gate};
      gate.progress=Math.min(100,gate.progress+C.GATE_RATE*(dt/1000));
      drawBar(gate.barGfx,gate.bx,gate.by,gate.progress,0x66ffaa);
      if(gate.progress>=100){gate.opened=true;gate.setTint(0x22ff66);p.progressAction=null;UI.toast('🚪 Ворота открыты! Беги!');}
      return true;
    }
  });
  if(!acted)cancelProgress(p);
}

function cancelProgress(p){p.progressAction=null;}

function checkAllGens(){
  var done=gGenerators.filter(function(g){return g.repaired;}).length;
  if(done>=C.GEN_COUNT&&!gExitOpen){
    gExitOpen=true;
    UI.toast('⚡ Все генераторы! Открывай ворота!');
    // Add glow to gates
    gGates.forEach(function(gate){
      gate.glowGfx=gScene.add.graphics();
      gate.glowGfx.fillStyle(0x66ffaa,0.25);
      gate.glowGfx.fillCircle(gate.x,gate.y,60);
      gate.glowGfx.setDepth(gate.y-1);
    });
    spawnHatch();
  }
}

function spawnHatch(){
  if(gHatch)return;
  var hx=400+Math.random()*(C.MAP_W-800),hy=400+Math.random()*(C.MAP_H-800);
  // Glow aura
  var glow=gScene.add.graphics();
  glow.fillStyle(0xffaa00,0.2);
  glow.fillCircle(hx,hy,60);
  glow.setDepth(hy);
  gHatch=gScene.add.sprite(hx,hy,'hatch').setDepth(hy+1).setScale(1.5);
  gHatch.setTint(0xffaa00);gHatchOpen=true;
  gHatch.glowGfx=glow;
  UI.toast('🪤 Люк появился на карте!');
}

/* ─── Hooks ─── */
function updateHooks(dt){
  gHooks.forEach(function(hook){
    if(!hook.occupied||!hook.hookedSurvivor)return;
    var p=hook.hookedSurvivor;
    p.sprite.setPosition(hook.x,hook.y-12);
    p.hookTimer+=dt/1000;
    var pct=100-(p.hookTimer/C.HOOK_TIME*100);
    _floatBars.push({wx:hook.bx,wy:hook.by-32,pct:Math.max(0,pct),color:0xff4444});
    if(p.hookTimer>=C.HOOK_TIME){
      p.state='dead';p.sprite.setAlpha(0.15);
      hook.occupied=false;hook.hookedSurvivor=null;
      if(p.isMe){doEndGame(false,'Ты умер на крюке!');}
      else{gSurvivorsAlive=Math.max(0,gSurvivorsAlive-1);}
    }
  });
}

/* ─── AI ─── */
function updateAI(dt){
  gAIPlayers.forEach(function(ai){
    var sp=ai.sprite;
    if(ai.state==='dead'){sp.body.setVelocity(0,0);return;}
    if(ai.state==='hooked'){sp.body.setVelocity(0,0);return;}
    sp.setDepth(1000+sp.y);

    if(ai.isAIKiller){
      // AI killer chases player
      if(ai.aiHitCooldown>0)ai.aiHitCooldown-=dt/1000;
      var target=gMyPlayer;
      if(!target||target.state==='dead')return;
      var d=dist(sp,target.sprite);
      if(d<C.HIT_DIST){
        sp.body.setVelocity(0,0);
        if(ai.aiHitCooldown<=0){
          ai.aiHitCooldown=C.STUN_TIME+0.3;
          var p2=gMyPlayer;
          if(p2.state==='alive'){p2.state='injured';p2.sprite.setTint(0xff8888);gBoostTimer=C.BOOST_TIME;UI.toast('💥 Ты ранен!');}
          else if(p2.state==='injured'){p2.state='dying';p2.sprite.setTint(0xff4444);UI.toast('⬇️ Ты упал!');}
          else if(p2.state==='dying'){
            var hook=nearestFreeHook(sp);
            if(hook){hangSurvivor(p2,hook);UI.toast('🪝 Тебя повесили!');}
          }
        }
      } else {
        moveTo(sp,target.sprite.x,target.sprite.y,C.KILLER_SPEED);
      }
    } else {
      // AI survivor: wander with occasional direction change
      ai.aiTimer=(ai.aiTimer||0)-dt/1000;
      if(ai.aiTimer<=0){
        ai.aiTimer=0.8+Math.random()*2;
        var ang=Math.random()*Math.PI*2;
        ai.aiDir={x:Math.cos(ang),y:Math.sin(ang)};
      }
      // flee from killer if nearby
      if(gIsKiller&&gMyPlayer){
        var dk=dist(sp,gMyPlayer.sprite);
        if(dk<180){
          var ak=Math.atan2(sp.y-gMyPlayer.sprite.y,sp.x-gMyPlayer.sprite.x);
          ai.aiDir={x:Math.cos(ak),y:Math.sin(ak)};ai.aiTimer=1.2;
        }
      }
      var as=ai.state==='dying'?C.DYING_SPEED:ai.state==='injured'?C.INJURED_SPEED:C.PLAYER_SPEED;
      sp.body.setVelocity(ai.aiDir.x*as,ai.aiDir.y*as);
    }
  });
}

/* ─── HUD ─── */
function updateHUD(){
  var p=gMyPlayer;
  var stateStr=p.state==='injured'?'🩸Ранен':p.state==='dying'?'💀Упал':p.state==='hooked'?'🪝Крюк':'жив';
  var roleEl=document.getElementById('player-role');
  var genEl=document.getElementById('gen-count');
  var exitEl=document.getElementById('exit-state');
  var aliveEl=document.getElementById('alive-count');
  if(roleEl)roleEl.textContent=p.role==='killer'?'Убийца':stateStr;
  var rep=gGenerators.filter(function(g){return g.repaired;}).length;
  if(genEl)genEl.textContent=rep+'/'+C.GEN_COUNT;
  if(exitEl)exitEl.textContent=gExitOpen?(gHatchClosed?'люк🔒':'открыт!'):'закрыт';
  if(aliveEl){
    if(gIsKiller){aliveEl.textContent='🏃 '+gAIPlayers.filter(function(a){return a.state!=='dead';}).length;}
    else aliveEl.textContent='🏃 '+gSurvivorsAlive;
  }
}

/* ─── Progress bars ─── */
function drawBar(gfx,bx,by,pct,color){
  gfx.clear();pct=Math.max(0,Math.min(100,pct));
  gfx.fillStyle(0x000000,0.75);gfx.fillRect(bx-25,by-30,50,8);
  gfx.fillStyle(color,1);gfx.fillRect(bx-24,by-29,48*(pct/100),6);
}
function flushFloatBars(){
  if(!_floatBarGfx)return;
  _floatBarGfx.clear();
  _floatBars.forEach(function(b){
    var pct=Math.max(0,Math.min(100,b.pct));
    _floatBarGfx.fillStyle(0x000000,0.75);_floatBarGfx.fillRect(b.wx-25,b.wy,50,8);
    _floatBarGfx.fillStyle(b.color,1);_floatBarGfx.fillRect(b.wx-24,b.wy+1,48*(pct/100),6);
  });
  _floatBars=[];
}

/* ─── Helpers ─── */
function dist(a,b){var ax=a.x||0,ay=a.y||0,bx=b.x||0,by=b.y||0;return Math.sqrt((ax-bx)*(ax-bx)+(ay-by)*(ay-by));}
function normalize(v){var len=Math.sqrt(v.x*v.x+v.y*v.y);if(len<0.01)return{x:0,y:0};return{x:v.x/len,y:v.y/len};}
function moveTo(sp,tx,ty,spd){var dx=tx-sp.x,dy=ty-sp.y,d=Math.sqrt(dx*dx+dy*dy);if(d<2){sp.body.setVelocity(0,0);return;}sp.body.setVelocity(dx/d*spd,dy/d*spd);}
function nearestAliveTarget(sp,maxD){
  var best=null,bd=maxD;
  var pool=gIsKiller?gAIPlayers:[gAIPlayers.find(function(a){return a.isAIKiller;})].filter(Boolean);
  pool.forEach(function(ai){
    if(!ai||ai.state==='dead')return;
    var d=dist(sp,ai.sprite);if(d<bd){bd=d;best=ai.sprite;}
  });
  return best;
}
function nearestFreeHook(sp){
  var best=null,bd=9999;
  gHooks.forEach(function(h){if(h.occupied)return;var d=dist(sp,h);if(d<bd){bd=d;best=h;}});
  return best;
}
function hangSurvivor(p,hook){
  hook.occupied=true;hook.hookedSurvivor=p;p.hookTimer=0;
  p.state='hooked';p.sprite.setTint(0xaaaaaa);p.sprite.setVisible(true);
  p.sprite.setPosition(hook.x,hook.y-12);
  if(!p.isMe)gSurvivorsAlive=Math.max(0,gSurvivorsAlive-1);
}

/* ═══════ CONTROLS ═══════ */
function createControls(){
  removeControls();
  var joy=document.createElement('div');
  joy.id='joystick-zone';
  joy.style.cssText='position:fixed;bottom:28px;left:28px;width:114px;height:114px;z-index:99999;touch-action:none;';
  joy.innerHTML='<div id="joy-base" style="width:100%;height:100%;background:rgba(255,255,255,0.12);border:3px solid rgba(255,255,255,0.3);border-radius:50%;position:relative;"><div id="joy-knob" style="width:46px;height:46px;background:rgba(220,50,50,0.88);border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 0 10px rgba(220,50,50,0.5);"></div></div>';
  document.body.appendChild(joy);

  var ab=document.createElement('div');ab.id='action-btn';ab.textContent='⚡';
  ab.style.cssText='position:fixed;bottom:48px;right:28px;width:82px;height:82px;border-radius:50%;background:linear-gradient(135deg,#ff6600,#cc2200);border:3px solid rgba(255,255,255,0.4);color:#fff;font-size:30px;font-weight:bold;display:flex;align-items:center;justify-content:center;z-index:99999;touch-action:none;box-shadow:0 0 16px rgba(255,80,0,0.5);';
  document.body.appendChild(ab);

  var jbase=document.getElementById('joy-base');
  var knob=document.getElementById('joy-knob');
  var maxD=44,tid=null,touching=false;

  function updateJoy(cx,cy){
    var r=jbase.getBoundingClientRect();
    var dx=cx-(r.left+r.width/2),dy=cy-(r.top+r.height/2);
    var d=Math.sqrt(dx*dx+dy*dy),lim=Math.min(d,maxD);
    var ang=Math.atan2(dy,dx);
    var nx=lim/maxD*Math.cos(ang),ny=lim/maxD*Math.sin(ang);
    knob.style.transform='translate(calc(-50% + '+(nx*maxD)+'px), calc(-50% + '+(ny*maxD)+'px))';
    gInputVec.x=nx;gInputVec.y=ny;
  }
  function resetJoy(){touching=false;tid=null;gInputVec.x=0;gInputVec.y=0;knob.style.transform='translate(-50%,-50%)';}

  joy.addEventListener('touchstart',function(e){e.preventDefault();touching=true;tid=e.changedTouches[0].identifier;updateJoy(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
  joy.addEventListener('touchmove',function(e){e.preventDefault();for(var i=0;i<e.changedTouches.length;i++)if(e.changedTouches[i].identifier===tid){updateJoy(e.changedTouches[i].clientX,e.changedTouches[i].clientY);break;}},{passive:false});
  joy.addEventListener('touchend',resetJoy);joy.addEventListener('touchcancel',resetJoy);
  joy.addEventListener('mousedown',function(e){touching=true;updateJoy(e.clientX,e.clientY);});
  document.addEventListener('mousemove',function(e){if(touching)updateJoy(e.clientX,e.clientY);});
  document.addEventListener('mouseup',function(){if(touching)resetJoy();});

  ab.addEventListener('touchstart',function(e){e.preventDefault();gActionPressed=true;ab.style.transform='scale(0.92)';},{passive:false});
  ab.addEventListener('touchend',function(e){e.preventDefault();gActionPressed=false;ab.style.transform='scale(1)';});
  ab.addEventListener('touchcancel',function(){gActionPressed=false;ab.style.transform='scale(1)';});
  ab.addEventListener('mousedown',function(){gActionPressed=true;ab.style.transform='scale(0.92)';});
  ab.addEventListener('mouseup',function(){gActionPressed=false;ab.style.transform='scale(1)';});

  document.addEventListener('keydown',onKey);document.addEventListener('keyup',onKey);
}

function onKey(e){
  _keys[e.code]=(e.type==='keydown');
  gInputVec.x=((_keys.ArrowRight||_keys.KeyD)?1:0)-((_keys.ArrowLeft||_keys.KeyA)?1:0);
  gInputVec.y=((_keys.ArrowDown||_keys.KeyS)?1:0)-((_keys.ArrowUp||_keys.KeyW)?1:0);
  var len=Math.sqrt(gInputVec.x*gInputVec.x+gInputVec.y*gInputVec.y);
  if(len>1){gInputVec.x/=len;gInputVec.y/=len;}
  if(e.code==='Space'||e.code==='KeyE')gActionPressed=(e.type==='keydown');
}

function removeControls(){
  var j=document.getElementById('joystick-zone');if(j)j.remove();
  var a=document.getElementById('action-btn');if(a)a.remove();
  document.removeEventListener('keydown',onKey);document.removeEventListener('keyup',onKey);
}

/* ═══════ LOBBY ═══════ */
var gMyId=null,gRoomId=null,gIsHost=false,gRoomUnsub=null,gMyRole=null; // 'killer' or 'survivor'

function getMyId(){
  try{if(Telegram&&Telegram.WebApp&&Telegram.WebApp.initDataUnsafe&&Telegram.WebApp.initDataUnsafe.user)return'tg_'+Telegram.WebApp.initDataUnsafe.user.id;}catch(e){}
  var s=localStorage.getItem('uid');if(s)return s;
  var id='g_'+Date.now()+'_'+Math.random().toString(36).substr(2,6);localStorage.setItem('uid',id);return id;
}

function createLobby(){
  if(!window.firebaseLoaded){UI.toast('Firebase не загружена');return;}
  var code='ROOM_'+Date.now()+'_'+Math.random().toString(36).substr(2,5);
  gRoomId=code;gIsHost=true;gMyRole='killer';
  var hName=gUser?gUser.name:'Маньяк';
  if(gIsTelegram){try{var u=Telegram.WebApp.initDataUnsafe.user;if(u)hName=u.first_name||'Маньяк';}catch(e){}}
  UI.showScreen('lobby-create');
  document.getElementById('lobby-status').textContent='Код лобби: '+code;
  document.getElementById('display-room-code').textContent=code;
  document.getElementById('btn-start-game').disabled=true;
  document.getElementById('btn-start-game').style.background='#555';
  document.getElementById('btn-start-game').textContent='Ждём игроков...';
  window.fbDB.ref('rooms/'+code).set({
    code:code,hostId:gMyId,hostName:hName,status:'waiting',createdAt:Date.now(),
    players:{[gMyId]:{id:gMyId,name:hName,role:'killer',isHost:true}}
  }).then(function(){
    listenRoom(code);
    UI.toast('Лобби создано!');
  }).catch(function(e){UI.toast('Ошибка: '+e.message);});
}

function findAndJoinLobby(){
  if(!window.firebaseLoaded){UI.toast('Firebase не загружена');return;}
  UI.showScreen('lobby-join');
  gMyRole='survivor';
  document.getElementById('found-lobbies').innerHTML='<p style="color:#aaa">Ищу лобби...</p>';
  var sName=gUser?gUser.name:'Выживший';
  if(gIsTelegram){try{var u=Telegram.WebApp.initDataUnsafe.user;if(u)sName=u.first_name||'Выживший';}catch(e){}}

  // Use Firebase listener instead of polling
  var ref=window.fbDB.ref('rooms');
  function renderLobbies(snap){
    var rooms=snap.val();
    var container=document.getElementById('found-lobbies');
    if(!container)return;
    console.log('Rooms snapshot:', rooms);
    var html='';
    var found=false;
    if(rooms){
      Object.keys(rooms).forEach(function(rid){
        var rm=rooms[rid];
        console.log('Room', rid, ':', rm);
        if(!rm || rm.status!=='waiting')return;
        var pl=rm.players||{};
        var playerCount=Object.keys(pl).length;
        if(playerCount>=4)return; // full
        found=true;
        html+='<div class="player-slot" style="cursor:pointer;border:2px solid #ff3333" onclick="joinLobbyById(\''+rid+'\',\''+sName.replace(/'/g,"\\'")+'\')">🔪 '+rm.hostName+' <span style="color:#aaa;font-size:12px">('+playerCount+'/4 игроков)</span></div>';
      });
    }
    container.innerHTML=found?html:'<p style="color:#666">Нет доступных лобби. Стань маньяком!</p>';
    document.getElementById('search-status').textContent=found?'Нажми на лобби для входа':'Нет лобби — создай своё!';
  }

  // Initial load
  ref.once('value',renderLobbies);
  // Real-time updates
  ref.on('value',renderLobbies);

  // Store unsubscribe for cleanup
  if(window._lobbySearchUnsub)window._lobbySearchUnsub();
  window._lobbySearchUnsub=function(){ref.off('value',renderLobbies);};

  document.getElementById('btn-leave-search').onclick=function(){
    if(window._lobbySearchUnsub){window._lobbySearchUnsub();window._lobbySearchUnsub=null;}
    UI.showScreen('main-menu');
  };
}

function joinLobbyById(code,sName){
  if(gSearchInterval){clearInterval(gSearchInterval);gSearchInterval=null;}
  gRoomId=code;gIsHost=false;
  window.fbDB.ref('rooms/'+code+'/players/'+gMyId).set({id:gMyId,name:sName,role:'survivor',isHost:false}).then(function(){
    UI.showScreen('lobby-create');
    document.getElementById('display-room-code').textContent=code;
    document.getElementById('lobby-status').textContent='Вы присоединились!';
    listenRoom(code);
    UI.toast('Подключился к лобби!');
  }).catch(function(e){UI.toast('Ошибка: '+e.message);});
}

function listenRoom(code){
  if(gRoomUnsub)gRoomUnsub();
  var ref=window.fbDB.ref('rooms/'+code);
  var kicked=false;
  ref.on('value',function(snap){
    if(kicked)return;
    if(!snap.exists()){kicked=true;UI.toast('Лобби закрыто!');UI.showScreen('main-menu');return;}
    var d=snap.val();
    if(d.status==='closed'){
      kicked=true;
      UI.toast('Маньяк покинул лобби!',5000);
      UI.showScreen('main-menu');
      return;
    }
    var pl=d.players||{};
    var playerIds=Object.keys(pl);
    var survivorCount=playerIds.filter(function(id){return pl[id].role==='survivor';}).length;
    var el=document.getElementById('lobby-players');
    if(el){
      el.innerHTML='';
      // Show killer first
      playerIds.forEach(function(pid){
        if(pl[pid].role!=='killer')return;
        var div=document.createElement('div');
        div.className='player-slot host';
        div.textContent='🔪 '+pl[pid].name+(pl[pid].isHost?' (хост)':'');
        el.appendChild(div);
      });
      // Then survivors
      playerIds.forEach(function(pid){
        if(pl[pid].role!=='survivor')return;
        var div=document.createElement('div');
        div.className='player-slot';
        div.textContent='🏃 '+pl[pid].name;
        el.appendChild(div);
      });
      for(var i=playerIds.length;i<4;i++){
        var div2=document.createElement('div');
        div2.className='player-slot empty';
        div2.textContent='⏳ Ожидание...';
        el.appendChild(div2);
      }
    }
    var btn=document.getElementById('btn-start-game');
    if(gIsHost&&gMyRole==='killer'){
      if(survivorCount>=1){
        btn.disabled=false;
        btn.style.background='linear-gradient(135deg,#ff3333,#cc0000)';
        btn.textContent='▶ Начать игру ('+playerIds.length+'/4)';
      } else {
        btn.disabled=true;
        btn.style.background='#555';
        btn.textContent='Ждём игроков...';
      }
    }
    if(d.status==='playing'){
      ref.off();
      gIsKiller=(gMyRole==='killer');
      resetState();
      showGameScreen();
      setTimeout(initPhaser,80);
    }
  });
  gRoomUnsub=function(){ref.off();};
}

window.leaveLobby=function(){
  var wasKiller=(gMyRole==='killer');
  // Killer needs confirmation before leaving
  if(wasKiller){
    var confirmed=confirm('Ты уверен что хочешь выйти? Все выжившие будут исключены из лобби!');
    if(!confirmed)return;
    UI.toast('Лобби закрыто');
  }
  if(gRoomUnsub){gRoomUnsub();gRoomUnsub=null;}
  if(window._lobbySearchUnsub){window._lobbySearchUnsub();window._lobbySearchUnsub=null;}
  if(gRoomId&&window.firebaseLoaded){
    if(wasKiller){
      // Mark room as closed and notify players
      window.fbDB.ref('rooms/'+gRoomId).update({status:'closed',closedBy:'killer',closedAt:Date.now()}).catch(function(){});
      // Remove all players from room
      window.fbDB.ref('rooms/'+gRoomId+'/players').remove().catch(function(){});
      // Delete the room
      window.fbDB.ref('rooms/'+gRoomId).remove().catch(function(){});
    } else {
      // Survivor just leaves
      window.fbDB.ref('rooms/'+gRoomId+'/players/'+gMyId).remove().catch(function(){});
    }
  }
  gRoomId=null;gIsHost=false;gMyRole=null;
  UI.showScreen('main-menu');
  if(!wasKiller)UI.toast('Вышли из лобби');
};

/* ═══════ APP INIT ═══════ */
function setupButtons(){
  function on(id,fn){var el=document.getElementById(id);if(el)el.onclick=fn;}
  on('btn-create-lobby',function(){createLobby();});
  on('btn-find-lobby',function(){findAndJoinLobby();});
  on('btn-solo',function(){UI.showScreen('role-select');});
  on('btn-multi',function(){UI.showScreen('role-select');});
  on('btn-back-role',function(){UI.showScreen('main-menu');});
  on('btn-play-killer',function(){startSoloGame(true);});
  on('btn-play-survivor',function(){startSoloGame(false);});
  on('btn-back-menu',function(){stopGame();UI.showScreen('main-menu');});
  on('btn-start-game',function(){
    if(!gRoomId||!gIsHost)return;
    window.fbDB.ref('rooms/'+gRoomId).update({status:'playing'});
  });
  on('btn-leave-lobby',window.leaveLobby);
}

var _initTries=0;
function tryInit(){
  if(typeof Phaser!=='undefined'&&typeof Phaser.Game!=='undefined'){
    initUser(function(user){
      gMyId=getMyId();
      document.getElementById('loading-screen').classList.remove('active');
      document.getElementById('main-menu').classList.add('active');
      setupButtons();
      if(gIsTelegram){try{Telegram.WebApp.ready();Telegram.WebApp.expand();}catch(e){}}
      console.log('App ready. User:', user);
    });
    return;
  }
  if(++_initTries<80)setTimeout(tryInit,100);
  else{var t=document.getElementById('load-text');if(t)t.textContent='Ошибка загрузки Phaser';}
}
tryInit();
})();
</script>
