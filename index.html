<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111">
<title>Miasma Massacre</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#111;color:#fff;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#app{width:100%;height:100%;position:relative;overflow:hidden}
.screen{position:fixed;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,#111 0%,#1a1a1a 100%)}
.screen.active{display:flex}
#game-screen.active{display:block!important;padding:0;background:#1a1a1a}
h1{font-size:28px;color:#ff3333;margin-bottom:30px;text-align:center;text-shadow:0 0 20px rgba(255,51,51,.5)}
h2{font-size:22px;color:#ff3333;margin-bottom:20px;text-align:center}
.btn{width:210px;padding:14px 20px;margin:7px 0;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;background:#333;color:#fff;touch-action:manipulation}
.btn.primary{background:linear-gradient(135deg,#ff3333,#cc0000)}
.btn.secondary{background:#444}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:active{transform:scale(.97)}
.menu-buttons{display:flex;flex-direction:column;align-items:center}
.player-slot{padding:10px 18px;background:rgba(255,255,255,.08);border-radius:6px;text-align:center;border:1px solid rgba(255,255,255,.15);font-size:15px;margin:4px 0;width:100%;max-width:280px}
.player-slot.host{background:rgba(255,51,51,.25);border-color:#ff3333;color:#ff8888}
.player-slot.empty{color:#555;font-style:italic}
#lobby-players{display:flex;flex-direction:column;align-items:center;margin:15px 0;width:100%}
#lobby-status,#search-status{font-size:15px;color:#aaa;margin-bottom:8px;text-align:center}
.version{position:absolute;bottom:15px;color:#555;font-size:11px}
.loader{width:38px;height:38px;border:3px solid #333;border-top-color:#ff3333;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:15px}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:140px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.92);color:#fff;padding:11px 22px;border-radius:8px;font-size:14px;z-index:99999;display:none;white-space:nowrap;pointer-events:none}
#toast.show{display:block;animation:fadeInOut 2.5s forwards}
@keyframes fadeInOut{0%{opacity:0;transform:translateX(-50%) translateY(15px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}75%{opacity:1}100%{opacity:0}}
#hud{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none;z-index:9000;flex-wrap:wrap;gap:4px}
#hud>div{background:rgba(0,0,0,.75);padding:6px 10px;border-radius:6px;font-size:11px;white-space:nowrap}
#hud #role-indicator{color:#ff8888;font-weight:700}
#game-container{width:100%;height:100%;position:fixed;top:0;left:0;z-index:10;background:#1a1a1a}
#game-container canvas{display:block!important;visibility:visible!important}
#game-over{z-index:10000}
#game-result-message{color:#aaa;margin-bottom:25px;text-align:center;font-size:15px}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="src/firebase/config.js"></script>
<script src="src/firebase/database.js"></script>
<script src="src/game/room.js"></script>
<script src="src/game/game.js"></script>
</head>
<body>
<div id="app">
  <div id="loading-screen" class="screen active"><div class="loader"></div><p id="load-text">Загрузка...</p></div>
  <div id="main-menu" class="screen"><h1>☣ Miasma Massacre</h1><div class="menu-buttons"><button id="btn-create-lobby" class="btn primary">🔪 Создать лобби (Маньяк)</button><button id="btn-find-lobby" class="btn secondary">🔍 Найти игру (Выживший)</button><button id="btn-solo" class="btn" style="background:#222;margin-top:8px">🎮 Играть Solo</button></div><div class="version">v4.0</div></div>
  <div id="role-select" class="screen"><h2>Выбери роль</h2><button id="btn-play-killer" class="btn primary">🔪 Убийца</button><button id="btn-play-survivor" class="btn secondary">🏃 Выживший</button><button id="btn-back-role" class="btn" style="margin-top:15px;background:#222">← Назад</button></div>
  <div id="lobby-create" class="screen"><h2>🏠 Лобби: <span id="display-room-code" style="color:#fff;font-size:20px"></span></h2><p id="lobby-status" style="color:#aaa;margin-bottom:15px;text-align:center">Ожидание игроков...</p><div id="lobby-players" style="display:flex;flex-direction:column;align-items:center;width:100%;max-width:300px;margin-bottom:15px"></div><button id="btn-start-game" class="btn primary" disabled style="background:#555">Начать игру</button><button id="btn-leave-lobby" class="btn secondary" style="margin-top:8px">← Выйти</button></div>
  <div id="lobby-join" class="screen"><h2>🔍 Поиск игры</h2><p id="found-lobbies" style="color:#aaa;text-align:center;margin-bottom:15px">Ищу доступные лобби...</p><button id="btn-leave-search" class="btn secondary">← Назад</button></div>
  <div id="game-screen" class="screen">
    <div id="game-container"></div>
    <div id="hud">
      <div id="role-indicator">Роль: <span id="player-role">—</span></div>
      <div>⚙️ <span id="gen-count">0/5</span></div>
      <div>🚪 <span id="exit-state">закрыт</span></div>
      <div id="alive-count">🏃 4</div>
    </div>
  </div>
  <div id="game-over" class="screen"><h2 id="game-result-title">Победа!</h2><p id="game-result-message"></p><button id="btn-back-menu" class="btn primary">В меню</button></div>
</div>
<div id="toast"></div>

<script>
(function(){
'use strict';

/* ═══════ GLOBAL STATE ═══════ */
let gUser = null;
let gIsTelegram = false;
let gMyId = null;
let gRoomId = null;
let gIsHost = false;
let gMyRole = null;
let gGameSessionId = null;

/* ═══════ USER INIT ═══════ */
function getTelegramUser() {
    try {
        if (Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user) {
            var u = Telegram.WebApp.initDataUnsafe.user;
            return {
                id: 'tg_' + u.id,
                name: u.first_name || 'Игрок',
                username: u.username || '',
                photo: u.photo_url || ''
            };
        }
    } catch (e) {}
    return null;
}

function isRunningInTelegram() {
    try {
        return !!(Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user);
    } catch (e) {
        return false;
    }
}

function getMyId() {
    try {
        if (Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user) {
            return 'tg_' + Telegram.WebApp.initDataUnsafe.user.id;
        }
    } catch (e) {}
    var s = localStorage.getItem('uid');
    if (s) return s;
    var id = 'g_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
    localStorage.setItem('uid', id);
    return id;
}

function getPlayerName() {
    try {
        if (Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe) {
            var u = Telegram.WebApp.initDataUnsafe.user;
            if (u) return u.first_name || 'Игрок';
        }
    } catch (e) {}
    return 'Игрок';
}

function initUser(callback) {
    gMyId = getMyId();
    gIsTelegram = isRunningInTelegram();

    if (gIsTelegram) {
        try {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
        } catch (e) {}

        var tgUser = getTelegramUser();
        if (tgUser && window.fsLoaded) {
            window.fbFS.collection('users').doc(tgUser.id).get().then(function(doc) {
                if (doc.exists) {
                    gUser = { id: tgUser.id, name: tgUser.name, isNew: false };
                } else {
                    gUser = { id: tgUser.id, name: tgUser.name, isNew: true };
                    window.fbFS.collection('users').doc(tgUser.id).set({
                        id: tgUser.id,
                        name: tgUser.name,
                        username: tgUser.username,
                        photo: tgUser.photo,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
                        gamesPlayed: 0,
                        gamesWon: 0
                    }).catch(function(e) { console.error('User write error:', e); });
                }
                callback && callback(gUser);
            }).catch(function(e) {
                console.error('User read error:', e);
                callback && callback(null);
            });
            return;
        }
    }

    gUser = { id: gMyId, name: getPlayerName(), isNew: false };
    callback && callback(gUser);
}

/* ═══════ LOBBY FUNCTIONS ═══════ */
function createLobby() {
    if (!window.isFirebaseReady()) {
        UI.showToast('Firebase не загружен');
        return;
    }

    gMyId = getMyId();
    gMyRole = 'killer';
    gIsHost = true;

    var hName = getPlayerName();

    UI.showScreen('lobby-create');
    document.getElementById('display-room-code').textContent = 'Создание...';
    document.getElementById('lobby-status').textContent = 'Создание лобби...';
    document.getElementById('btn-start-game').disabled = true;
    document.getElementById('btn-start-game').style.background = '#555';

    createRoom('Комната', 4, gMyId, hName).then(function(result) {
        if (result.success) {
            gRoomId = result.roomId;
            document.getElementById('display-room-code').textContent = result.roomId;
            document.getElementById('lobby-status').textContent = 'Код лобби: ' + result.roomId;
            subscribeToLobby(gRoomId);
            UI.showToast('Лобби создано: ' + result.roomId);
        } else {
            UI.showToast('Ошибка: ' + result.error);
            UI.showScreen('main-menu');
        }
    }).catch(function(e) {
        console.error('Create lobby error:', e);
        UI.showToast('Ошибка создания лобби');
        UI.showScreen('main-menu');
    });
}

function findAndJoinLobby() {
    if (!window.isFirebaseReady()) {
        UI.showToast('Firebase не загружен');
        return;
    }

    UI.showScreen('lobby-join');
    gMyId = getMyId();
    gMyRole = 'survivor';

    var sName = getPlayerName();
    document.getElementById('found-lobbies').innerHTML = '<p style="color:#aaa">Поиск лобби...</p>';

    // Listen for available rooms
    var roomsQuery = firebase.database().ref('rooms')
        .orderByChild('status')
        .equalTo('waiting');

    var foundLobby = false;

    roomsQuery.on('child_added', function(snapshot) {
        if (foundLobby) return;

        var room = snapshot.val();
        var playerCount = Object.keys(room.players || {}).length;

        if (playerCount < 4 && room.hostId !== gMyId) {
            foundLobby = true;
            roomsQuery.off();

            joinRoom(snapshot.key, gMyId, sName).then(function(result) {
                if (result.success) {
                    gRoomId = result.roomId;
                    gIsHost = false;
                    UI.showScreen('lobby-create');
                    document.getElementById('display-room-code').textContent = result.roomId;
                    document.getElementById('lobby-status').textContent = 'Вы присоединились!';
                    subscribeToLobby(gRoomId);
                    UI.showToast('Подключился к лобби!');
                } else {
                    UI.showToast('Ошибка: ' + result.error);
                    UI.showScreen('main-menu');
                }
            }).catch(function(e) {
                console.error('Join lobby error:', e);
                UI.showScreen('main-menu');
            });
        }
    });

    // Timeout if no lobby found
    setTimeout(function() {
        if (!foundLobby) {
            roomsQuery.off();
            document.getElementById('found-lobbies').innerHTML = '<p style="color:#666">Нет доступных лобби...</p>';
        }
    }, 10000);

    document.getElementById('btn-leave-search').onclick = function() {
        roomsQuery.off();
        UI.showScreen('main-menu');
    };
}

function subscribeToLobby(roomCode) {
    if (window.gRoomUnsub) window.gRoomUnsub();

    window.gRoomUnsub = firebase.database().ref('rooms/' + roomCode).on('value', function(snapshot) {
        if (!snapshot.exists()) {
            UI.showToast('Лобби закрыто!');
            UI.showScreen('main-menu');
            return;
        }

        var room = snapshot.val();

        if (room.status === 'closed') {
            UI.showToast('Лобби закрыто!', 3000);
            UI.showScreen('main-menu');
            return;
        }

        var players = room.players || {};
        var playerIds = Object.keys(players);
        var survivorCount = playerIds.filter(function(id) { return players[id].role === 'survivor'; }).length;

        // Update player list
        var el = document.getElementById('lobby-players');
        if (el) {
            el.innerHTML = '';

            // Show killer first
            playerIds.forEach(function(pid) {
                if (players[pid].role !== 'killer') return;
                var div = document.createElement('div');
                div.className = 'player-slot host';
                div.textContent = '🔪 ' + players[pid].name + (players[pid].isHost ? ' (хост)' : '');
                el.appendChild(div);
            });

            // Show survivors
            playerIds.forEach(function(pid) {
                if (players[pid].role !== 'survivor') return;
                var div = document.createElement('div');
                div.className = 'player-slot';
                div.textContent = '🏃 ' + players[pid].name;
                el.appendChild(div);
            });

            // Empty slots
            for (var i = playerIds.length; i < 4; i++) {
                var div2 = document.createElement('div');
                div2.className = 'player-slot empty';
                div2.textContent = '⏳ Ожидание...';
                el.appendChild(div2);
            }
        }

        // Update start button
        var btn = document.getElementById('btn-start-game');
        if (gIsHost && gMyRole === 'killer') {
            if (survivorCount >= 1) {
                btn.disabled = false;
                btn.style.background = 'linear-gradient(135deg,#ff3333,#cc0000)';
                btn.textContent = '▶ Начать игру (' + playerIds.length + '/4)';
            } else {
                btn.disabled = true;
                btn.style.background = '#555';
                btn.textContent = 'Ждём игроков...';
            }
        }

        // Game started
        if (room.status === 'playing') {
            if (window.gRoomUnsub) {
                window.gRoomUnsub();
                window.gRoomUnsub = null;
            }

            gIsKiller = (gMyRole === 'killer');
            gGameSessionId = roomCode;

            // Initialize game session for sync
            initGameSession(roomCode, gMyId, gIsKiller).then(function() {
                console.log('Game session initialized');
            }).catch(function(e) {
                console.error('Game session error:', e);
            });

            // Start the game
            if (typeof Game !== 'undefined') {
                Game.start(gIsKiller, true, roomCode, gMyId);
            }
        }
    }, function(error) {
        console.error('Lobby listen error:', error);
    });
}

window.leaveLobby = function() {
    var wasKiller = (gMyRole === 'killer');

    if (wasKiller) {
        var confirmed = confirm('Ты уверен что хочешь выйти? Все выжившие будут исключены из лобби!');
        if (!confirmed) return;

        // Delete room
        if (gRoomId) {
            firebase.database().ref('rooms/' + gRoomId).remove().catch(function() {});
        }
        UI.showToast('Лобби закрыто');
    } else {
        // Just leave
        if (gRoomId) {
            firebase.database().ref('rooms/' + gRoomId + '/players/' + gMyId).remove().catch(function() {});
        }
    }

    if (window.gRoomUnsub) {
        window.gRoomUnsub();
        window.gRoomUnsub = null;
    }

    gRoomId = null;
    gIsHost = false;
    gMyRole = null;
    UI.showScreen('main-menu');

    if (!wasKiller) UI.showToast('Вышли из лобби');
};

/* ═══════ SOLO GAME ═══════ */
function startSoloGame(killerMode) {
    if (typeof Game !== 'undefined') {
        Game.start(killerMode, false, null, null);
    }
}

/* ═══════ BUTTON SETUP ═══════ */
function setupButtons() {
    function on(id, fn) {
        var el = document.getElementById(id);
        if (el) el.onclick = fn;
    }

    on('btn-create-lobby', createLobby);
    on('btn-find-lobby', findAndJoinLobby);
    on('btn-solo', function() { UI.showScreen('role-select'); });
    on('btn-back-role', function() { UI.showScreen('main-menu'); });
    on('btn-play-killer', function() { startSoloGame(true); });
    on('btn-play-survivor', function() { startSoloGame(false); });
    on('btn-back-menu', function() {
        if (typeof Game !== 'undefined') Game.stop();
        UI.showScreen('main-menu');
    });
    on('btn-start-game', function() {
        if (!gRoomId || !gIsHost) return;
        UI.showToast('Начинаем игру...');
        startGame(gRoomId).catch(function(e) {
            console.error('Start game error:', e);
            UI.showToast('Ошибка запуска игры');
        });
    });
    on('btn-leave-lobby', window.leaveLobby);
}

/* ═══════ APP INIT ═══════ */
var _initTries = 0;

function tryInit() {
    if (typeof Phaser !== 'undefined' && typeof Phaser.Game !== 'undefined') {
        // Initialize Firebase
        initFirebaseDB().then(function() {
            console.log('Firebase DB initialized');
        }).catch(function(e) {
            console.error('Firebase DB init error:', e);
        });

        // Initialize user
        initUser(function(user) {
            document.getElementById('loading-screen').classList.remove('active');
            document.getElementById('main-menu').classList.add('active');
            setupButtons();
            console.log('App ready. User:', user);
        });
        return;
    }

    if (++_initTries < 80) {
        setTimeout(tryInit, 100);
    } else {
        var t = document.getElementById('load-text');
        if (t) t.textContent = 'Ошибка загрузки Phaser';
    }
}

// Start initialization
tryInit();
})();
</script>
</body>
</html>
