<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Miasma Massacre</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <div id="loading-screen">
            <div class="loader"></div>
            <p>Загрузка...</p>
        </div>
        
        <div id="main-menu" style="display:none">
            <h1>Miasma Massacre</h1>
            <button id="btn-single" class="btn primary">Играть (Solo)</button>
            <div class="version">v1.0.0</div>
        </div>
        
        <div id="role-select" style="display:none">
            <h2>Выбери роль</h2>
            <button id="btn-play-killer" class="btn primary">Убийца</button>
            <button id="btn-play-survivor" class="btn secondary">Выживший</button>
        </div>
        
        <div id="game-screen" style="display:none">
            <div id="game-container"></div>
            <div id="hud">
                <div id="role-indicator">Роль: <span id="player-role">---</span></div>
                <div id="generators-info">Генераторы: <span id="gen-count">0/5</span></div>
                <div id="exit-status">Выход: <span id="exit-state">закрыт</span></div>
            </div>
            <div id="player-list-hud">
                <div id="alive-count">Выжившие: 4/4</div>
            </div>
        </div>
        
        <div id="game-over" style="display:none">
            <h2 id="game-result-title">Победа!</h2>
            <p id="game-result-message"></p>
            <button id="btn-back-menu" class="btn primary">В меню</button>
        </div>
    </div>
    
    <div id="toast"></div>
    
    <script>
    var UI = {
        showScreen: function(name) {
            var screens = ['loading-screen', 'main-menu', 'role-select', 'game-screen', 'game-over'];
            screens.forEach(function(s) { document.getElementById(s).style.display = 'none'; });
            document.getElementById(name).style.display = 'flex';
        },
        showToast: function(msg) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.remove('show');
            void t.offsetWidth;
            t.classList.add('show');
        }
    };
    
    var CONFIG = { PLAYER_SPEED: 140, KILLER_SPEED: 160, GENERATOR_COUNT: 5, CATCH_DISTANCE: 45, CATCH_COOLDOWN: 2 };
    var game = null, player = null, generators = [], isKiller = false, exitOpen = false, survivorsLeft = 4, catchCooldown = 0;
    
    function startGame(killerMode) {
        isKiller = killerMode;
        exitOpen = false; survivorsLeft = 4; catchCooldown = 0; generators = [];
        UI.showScreen('game-screen');
        UI.showToast(isKiller ? 'Поймай всех!' : 'Найди генераторы!');
        initGame();
    }
    
    function stopGame() {
        if (game) { game.destroy(true); game = null; }
    }
    
    function initGame() {
        document.getElementById('game-container').innerHTML = '';
        game = new Phaser.Game({
            type: Phaser.AUTO,
            parent: 'game-container',
            width: window.innerWidth,
            height: window.innerHeight,
            backgroundColor: '#2d5a27',
            physics: { default: 'arcade', arcade: { gravity: { y: 0 } } },
            scene: { preload: preload, create: create, update: update }
        });
    }
    
    function preload() {
        var g = this.make.graphics();
        
        // Tree
        g.fillStyle(0x4a3728); g.fillRect(10, 30, 20, 40);
        g.fillStyle(0x228b22); g.fillCircle(20, 25, 30); g.fillCircle(10, 20, 20); g.fillCircle(30, 20, 20);
        g.generateTexture('tree', 40, 70); g.clear();
        
        // Bush
        g.fillStyle(0x228b22); g.fillCircle(15, 15, 15); g.fillCircle(25, 15, 12); g.fillCircle(20, 22, 12);
        g.generateTexture('bush', 40, 35); g.clear();
        
        // Survivor 1
        g.fillStyle(0x2d4a3e); g.fillRect(10, 22, 20, 28);
        g.fillStyle(0x8B4513); g.fillRect(12, 45, 7, 18); g.fillRect(21, 45, 7, 18);
        g.fillStyle(0xffdbac); g.fillCircle(20, 12, 10);
        g.fillStyle(0x4a3728); g.fillCircle(20, 6, 9);
        g.fillStyle(0x222222); g.fillRect(16, 10, 3, 3); g.fillRect(21, 10, 3, 3);
        g.generateTexture('survivor1', 40, 65); g.clear();
        
        // Survivor 2
        g.fillStyle(0x8e44ad); g.fillRect(12, 22, 16, 30);
        g.fillStyle(0xffdbac); g.fillCircle(20, 12, 9);
        g.fillStyle(0xd4a574); g.fillCircle(20, 6, 8); g.fillCircle(12, 10, 6); g.fillCircle(28, 10, 6);
        g.fillStyle(0x222222); g.fillCircle(17, 11, 2); g.fillCircle(23, 11, 2);
        g.fillStyle(0xffdbac); g.fillRect(14, 50, 4, 15); g.fillRect(22, 50, 4, 15);
        g.generateTexture('survivor2', 40, 65); g.clear();
        
        // Survivor 3
        g.fillStyle(0xc0392b); g.fillRect(10, 22, 20, 25);
        g.fillStyle(0x2980b9); g.fillRect(12, 42, 7, 22); g.fillRect(21, 42, 7, 22);
        g.fillStyle(0xffdbac); g.fillCircle(20, 12, 10);
        g.fillStyle(0x1a1a1a); g.fillCircle(20, 5, 9);
        g.fillStyle(0x222222); g.fillRect(16, 10, 3, 3); g.fillRect(21, 10, 3, 3);
        g.fillStyle(0x95a5a6); g.fillCircle(25, 14, 2);
        g.generateTexture('survivor3', 40, 65); g.clear();
        
        // Survivor 4
        g.fillStyle(0xf39c12); g.fillRect(12, 22, 16, 24);
        g.fillStyle(0x3498db); g.fillRect(14, 42, 12, 12);
        g.fillStyle(0xffdbac); g.fillCircle(20, 12, 9);
        g.fillStyle(0x8B4513); g.fillCircle(20, 5, 8); g.fillCircle(28, 8, 5);
        g.fillStyle(0x222222); g.fillCircle(17, 11, 2); g.fillCircle(23, 11, 2);
        g.fillStyle(0xffdbac); g.fillRect(15, 54, 3, 12); g.fillRect(22, 54, 3, 12);
        g.generateTexture('survivor4', 40, 65); g.clear();
        
        // Killer
        g.fillStyle(0x1a1a1a); g.fillRect(8, 20, 24, 35);
        g.fillStyle(0x8B0000); g.fillRect(10, 22, 20, 15);
        g.fillStyle(0x4a0000); g.fillCircle(15, 30, 4); g.fillCircle(25, 35, 3);
        g.fillStyle(0xffdbac); g.fillCircle(20, 12, 12);
        g.fillStyle(0x1a1a1a); g.fillRect(10, 6, 20, 14);
        g.fillStyle(0xff0000); g.fillCircle(15, 12, 4); g.fillCircle(25, 12, 4);
        g.fillStyle(0x330000); g.fillRect(15, 18, 10, 4);
        g.fillStyle(0x1a1a1a); g.fillRect(10, 52, 8, 15); g.fillRect(22, 52, 8, 15);
        g.generateTexture('killer_m', 40, 70); g.clear();
        
        // Generator
        g.fillStyle(0x444444); g.fillRect(0, 0, 35, 25);
        g.fillStyle(0x222222); g.fillRect(2, 2, 15, 21);
        g.fillStyle(0x00ff00); g.fillRect(4, 4, 3, 8);
        g.fillStyle(0xff0000); g.fillCircle(28, 12, 5);
        g.generateTexture('generator', 35, 25); g.clear();
        
        // Exit
        g.fillStyle(0x8B4513); g.fillRect(0, 0, 60, 50);
        g.fillStyle(0x654321); g.fillRect(5, 5, 20, 40); g.fillRect(35, 5, 20, 40);
        g.fillStyle(0xff0000); g.fillCircle(30, 25, 8);
        g.generateTexture('exit', 60, 50); g.clear();
        
        // Wall
        g.fillStyle(0x555555); g.fillRect(0, 0, 40, 15);
        g.fillStyle(0x333333); g.fillRect(0, 0, 38, 3); g.fillRect(0, 6, 38, 3); g.fillRect(0, 12, 38, 3);
        g.generateTexture('wall', 40, 15); g.clear();
        
        // Ground
        g.fillStyle(0x3d6b1e); g.fillRect(0, 0, 32, 32);
        g.fillStyle(0x4a7c23); g.fillCircle(8, 8, 4); g.fillCircle(24, 20, 3);
        g.generateTexture('ground', 32, 32);
    }
    
    function create() {
        var mapW = 1200, mapH = 900;
        for (var x = 0; x < mapW; x += 32) {
            for (var y = 0; y < mapH; y += 32) {
                var t = this.add.image(x + 16, y + 16, 'ground');
                t.setAlpha(0.5 + Math.random() * 0.5);
            }
        }
        
        var treePositions = [{x: 50, y: 50}, {x: 150, y: 80}, {x: 80, y: 150}, {x: 1100, y: 50}, {x: 1050, y: 120}, {x: 1150, y: 150}, {x: 50, y: 800}, {x: 120, y: 850}, {x: 80, y: 750}, {x: 1100, y: 800}, {x: 1050, y: 850}, {x: 1150, y: 750}, {x: 600, y: 50}, {x: 300, y: 300}, {x: 900, y: 300}, {x: 300, y: 600}, {x: 900, y: 600}];
        treePositions.forEach(function(p) { this.add.image(p.x, p.y, 'tree').setDepth(p.y); }, this);
        
        var bushPositions = [{x: 200, y: 200}, {x: 400, y: 150}, {x: 800, y: 200}, {x: 200, y: 700}, {x: 1000, y: 400}, {x: 600, y: 700}];
        bushPositions.forEach(function(p) { this.add.image(p.x, p.y, 'bush').setDepth(p.y); }, this);
        
        var walls = [{x: 600, y: 200}, {x: 300, y: 450}, {x: 900, y: 450}, {x: 600, y: 700}];
        walls.forEach(function(w) { this.add.image(w.x, w.y, 'wall'); }, this);
        
        var genPositions = [{x: 150, y: 150}, {x: 1050, y: 150}, {x: 600, y: 350}, {x: 150, y: 750}, {x: 1050, y: 750}];
        genPositions.forEach(function(p, i) {
            var gen = this.add.sprite(p.x, p.y, 'generator');
            gen.progress = 0; gen.repaired = false;
            var bar = this.add.graphics();
            bar.x = p.x - 20; bar.y = p.y - 20;
            gen.bar = bar;
            generators.push(gen);
        }, this);
        
        this.exit = this.add.sprite(1150, 450, 'exit');
        this.exit.setTint(0x440000);
        
        player = isKiller ? this.add.sprite(600, 450, 'killer_m') : this.add.sprite(150, 150, 'survivor1');
        this.physics.add.existing(player);
        player.body.setCollideWorldBounds(true);
        player.setDepth(1000);
        
        if (!isKiller) {
            this.survivors = [];
            var survivorPositions = [{x: 1050, y: 150}, {x: 150, y: 750}, {x: 1050, y: 750}];
            var survivorTextures = ['survivor2', 'survivor3', 'survivor4'];
            survivorPositions.forEach(function(p, i) {
                var s = this.add.sprite(p.x, p.y, survivorTextures[i]);
                s.alive = true;
                this.physics.add.existing(s);
                s.body.setCollideWorldBounds(true);
                s.setDepth(p.y);
                this.survivors.push(s);
            }, this);
        } else {
            this.survivors = [];
        }
        
        this.cameras.main.setBounds(0, 0, mapW, mapH);
        this.cameras.main.startFollow(player);
        
        initInput(this);
    }
    
    function update(time, delta) {
        if (!player) return;
        
        var vec = getInputVector();
        var speed = isKiller ? CONFIG.KILLER_SPEED : CONFIG.PLAYER_SPEED;
        player.body.setVelocity(vec.x * speed, vec.y * speed);
        
        if (!isKiller) {
            this.survivors.forEach(function(s) {
                if (s.alive) {
                    if (Math.random() < 0.02) s.body.setVelocity((Math.random() - 0.5) * 60, (Math.random() - 0.5) * 60);
                    var dist = Phaser.Math.Distance.Between(s.x, s.y, player.x, player.y);
                    if (dist < 150) {
                        var angle = Phaser.Math.Angle.Between(s.x, s.y, player.x, player.y);
                        s.body.setVelocity(Math.cos(angle) * 80, Math.sin(angle) * 80);
                    }
                }
            });
            
            if (isActionPressed()) {
                generators.forEach(function(gen) {
                    if (!gen.repaired) {
                        var dist = Phaser.Math.Distance.Between(player.x, player.y, gen.x, gen.y);
                        if (dist < 50) {
                            gen.progress += delta / 100;
                            gen.bar.clear();
                            gen.bar.fillStyle(0x000000, 0.7);
                            gen.bar.fillRect(-20, -20, 40, 6);
                            gen.bar.fillStyle(0xffff00);
                            gen.bar.fillRect(-19, -19, 38 * (gen.progress / 100), 4);
                            if (gen.progress >= 100) {
                                gen.repaired = true;
                                gen.setTint(0x00ff00);
                                UI.showToast('Генератор починен!');
                            }
                        }
                    }
                });
            }
            
            var repaired = generators.filter(function(g) { return g.repaired; }).length;
            if (repaired >= CONFIG.GENERATOR_COUNT && !exitOpen) {
                exitOpen = true;
                this.exit.setTint(0x00ff00);
                UI.showToast('ВЫХОД ОТКРЫТ!');
            }
            
            if (exitOpen) {
                var dist = Phaser.Math.Distance.Between(player.x, player.y, this.exit.x, this.exit.y);
                if (dist < 50) {
                    UI.showGameOver(true);
                    stopGame();
                    return;
                }
            }
        }
        
        if (isKiller && catchCooldown > 0) catchCooldown -= delta / 1000;
        
        if (isKiller) {
            this.survivors.forEach(function(s) {
                if (s.alive) {
                    var dist = Phaser.Math.Distance.Between(player.x, player.y, s.x, s.y);
                    if (dist < CONFIG.CATCH_DISTANCE && catchCooldown <= 0) {
                        s.alive = false;
                        s.setAlpha(0.3);
                        survivorsLeft--;
                        catchCooldown = CONFIG.CATCH_COOLDOWN;
                        UI.showToast('Пойман!');
                    }
                }
            });
            if (survivorsLeft <= 0) {
                UI.showGameOver(false);
                stopGame();
                return;
            }
        }
        
        player.setDepth(player.y + 1000);
        
        var repaired = generators.filter(function(g) { return g.repaired; }).length;
        document.getElementById('player-role').textContent = isKiller ? 'Убийца' : 'Выживший';
        document.getElementById('gen-count').textContent = repaired + '/5';
        document.getElementById('exit-state').textContent = exitOpen ? 'открыт' : 'закрыт';
        document.getElementById('alive-count').textContent = 'Выжившие: ' + survivorsLeft;
    }
    
    UI.showGameOver = function(won) {
        document.getElementById('game-result-title').textContent = won ? 'ПОБЕДА!' : 'ПОРАЖЕНИЕ';
        document.getElementById('game-result-message').textContent = won ? 'Ты сбежал!' : isKiller ? 'Ты поймал всех!' : 'Тебя поймали!';
        UI.showScreen('game-over');
    };
    
    var inputVec = { x: 0, y: 0 };
    var actionPressed = false;
    var js, jb, ab;
    
    function initInput(scene) {
        js = document.createElement('div');
        js.style.cssText = 'position:fixed;bottom:30px;left:30px;width:110px;height:110px;z-index:200;touch-action:none;';
        js.innerHTML = '<div style="width:100%;height:100%;background:rgba(255,255,255,0.15);border:3px solid rgba(255,255,255,0.4);border-radius:50%;position:relative;"><div id="stick" style="width:45px;height:45px;background:rgba(255,50,50,0.9);border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)"></div></div>';
        document.body.appendChild(js);
        
        ab = document.createElement('div');
        ab.textContent = 'ДЕЙСТВИЕ';
        ab.style.cssText = 'position:fixed;bottom:50px;right:30px;width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#ff6600,#ff3300);border:3px solid rgba(255,255,255,0.5);color:#fff;font-size:11px;font-weight:bold;display:flex;align-items:center;justify-content:center;z-index:200;touch-action:none;';
        document.body.appendChild(ab);
        
        var touching = false, maxDist = 45, base = js.firstChild, stick = base.firstChild;
        
        js.addEventListener('touchstart', function(e) { e.preventDefault(); touching = true; updateJoystick(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
        js.addEventListener('touchmove', function(e) { e.preventDefault(); if(touching) updateJoystick(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
        js.addEventListener('touchend', function() { touching = false; inputVec.x = 0; inputVec.y = 0; stick.style.transform = 'translate(-50%,-50%)'; });
        js.addEventListener('mousedown', function(e) { touching = true; updateJoystick(e.clientX, e.clientY); });
        document.addEventListener('mousemove', function(e) { if(touching) updateJoystick(e.clientX, e.clientY); });
        document.addEventListener('mouseup', function() { touching = false; inputVec.x = 0; inputVec.y = 0; stick.style.transform = 'translate(-50%,-50%)'; });
        
        function updateJoystick(cx, cy) {
            var rect = base.getBoundingClientRect();
            var cx2 = rect.left + rect.width/2;
            var cy2 = rect.top + rect.height/2;
            var dx = cx - cx2, dy = cy - cy2;
            var dist = Math.sqrt(dx*dx + dy*dy);
            var limitedDist = Math.min(dist, maxDist);
            var angle = Math.atan2(dy, dx);
            var nx = (limitedDist/maxDist) * Math.cos(angle);
            var ny = (limitedDist/maxDist) * Math.sin(angle);
            stick.style.transform = 'translate(calc(-50% + ' + (nx*maxDist) + 'px), calc(-50% + ' + (ny*maxDist) + 'px))';
            inputVec.x = nx; inputVec.y = ny;
        }
        
        ab.addEventListener('touchstart', function(e) { e.preventDefault(); actionPressed = true; ab.style.transform = 'scale(0.95)'; }, {passive:false});
        ab.addEventListener('touchend', function() { actionPressed = false; ab.style.transform = 'scale(1)'; });
        ab.addEventListener('mousedown', function() { actionPressed = true; ab.style.transform = 'scale(0.95)'; });
        ab.addEventListener('mouseup', function() { actionPressed = false; ab.style.transform = 'scale(1)'; });
    }
    
    function getInputVector() { return inputVec; }
    function isActionPressed() { return actionPressed; }
    
    document.getElementById('btn-single').onclick = function() { UI.showScreen('role-select'); };
    document.getElementById('btn-play-killer').onclick = function() { startGame(true); };
    document.getElementById('btn-play-survivor').onclick = function() { startGame(false); };
    document.getElementById('btn-back-menu').onclick = function() { stopGame(); UI.showScreen('main-menu'); };
    
    // Check Phaser
    var checkInterval = setInterval(function() {
        if (typeof Phaser !== 'undefined' && Phaser) {
            clearInterval(checkInterval);
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('main-menu').style.display = 'flex';
            console.log('Ready');
        }
    }, 100);
    
    // Telegram
    var tg = document.createElement('script');
    tg.src = 'https://telegram.org/js/telegram-web-app.js';
    tg.onload = function() { try { Telegram.WebApp.ready(); Telegram.WebApp.expand(); } catch(e) {} };
    document.head.appendChild(tg);
    </script>
</body>
</html>
