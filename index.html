        <div id="loading-screen" class="screen active"><div class="loader"></div><p>Загрузка...</p></div>

        <div id="lobby-create" class="screen"><h2>Лобби</h2><div id="lobby-status">Создание лобби...</div><div id="lobby-players"></div><button id="btn-start-game" class="btn primary" disabled>Начать игру</button><button id="btn-leave-lobby" class="btn secondary">Выйти</button></div>
        <div id="lobby-join" class="screen"><h2>Поиск игры</h2><div id="search-status">Поиск доступных лобби...</div><div id="search-count"></div><button id="btn-leave-search" class="btn secondary">Назад</button></div>
        <div id="game-screen" class="screen"><div id="game-container"></div><div id="hud"><div id="role-indicator">Роль: <span id="player-role">---</span></div><div id="generators-info">Генераторы: <span id="gen-count">0/5</span></div><div id="exit-status">Выход: <span id="exit-state">закрыт</span></div></div><div id="player-list-hud"><div id="alive-count">Выжившие: 4/4</div></div></div>
        <div id="game-over" class="screen"><h2 id="game-result-title">Победа!</h2><p id="game-result-message"></p><button id="btn-back-menu" class="btn primary">В меню</button></div>
    </div>
    <div id="toast"></div>

    <script>
    (function(){
        var UI = { 
            showScreen: function(n){
                var s = ['loading-screen', 'main-menu', 'role-select', 'lobby-create', 'lobby-join', 'game-screen', 'game-over'];
                s.forEach(function(x){
                    var el = document.getElementById(x);
                    if(el) el.classList.remove('active');
                });
                var target = document.getElementById(n);
                if(target) target.classList.add('active');
            }, 
            showToast: function(m){var t=document.getElementById('toast');if(t){t.textContent=m;t.classList.remove('show');void t.offsetWidth;t.classList.add('show');}},
            showGameOver: function(won){var title=document.getElementById('game-result-title');var msg=document.getElementById('game-result-message');if(title)title.textContent=won?'ПОБЕДА!':'ПОРАЖЕНИЕ';if(msg)msg.textContent=won?'Ты сбежал!':isKiller?'Ты поймал всех!':'Тебя поймали!';UI.showScreen('game-over');}
        };
        var CONFIG = { PLAYER_SPEED: 140, KILLER_SPEED: 160, GENERATOR_COUNT: 5, CATCH_DISTANCE: 45, CATCH_COOLDOWN: 2 };
        var game = null, player = null, generators = [], isKiller = false, exitOpen = false, survivorsLeft = 4, catchCooldown = 0;

        function startGame(km){ 
            isKiller = km; 
            exitOpen = false; 
            survivorsLeft = 4; 
            catchCooldown = 0; 
            generators = []; 
            UI.showScreen('game-screen'); 
            UI.showToast(isKiller ? 'Поймай всех!' : 'Найди генераторы!'); 
            initGame(); 
        }

        function stopGame(){ 
            if(game){ 
                game.destroy(true); 
                game = null; 
                player = null; 
            } 
            var existingJoystick = document.querySelector('[data-joystick]');
            var existingActionBtn = document.querySelector('[data-action-btn]');
            if(existingJoystick) existingJoystick.remove();
            if(existingActionBtn) existingActionBtn.remove();
        }

        function initGame(){ 
            var container = document.getElementById('game-container');
            if(container) container.innerHTML = '';
            game = new Phaser.Game({
                type: Phaser.AUTO, 
                parent: 'game-container', 
                width: window.innerWidth, 
                height: window.innerHeight, 
                backgroundColor: '#2d5a27', 
                physics: { default: 'arcade', arcade: { gravity: { y: 0 } } }, 
                scene: { preload: preload, create: create, update: update }
            }); 
        }

            g.fillStyle(0x4E342E);g.fillRect(0,55,100,15);g.fillStyle(0x6D4C41);g.fillRect(5,15,90,40);g.fillStyle(0x5D4037);g.fillRect(0,10,100,8);g.fillStyle(0x81D4FA);g.fillRect(15,25,12,15);g.fillRect(65,25,12,15);g.fillStyle(0x3E2723);g.fillRect(42,35,16,20);g.fillStyle(0xFFEB3B);g.fillRect(20,30,8,10);g.fillRect(70,30,8,10);g.generateTexture('building',100,70);g.clear();
            
            g.fillStyle(0x5D4037);g.fillRect(0,0,4,30);g.fillRect(26,0,4,30);g.fillRect(52,0,4,30);g.fillRect(78,0,4,30);g.fillStyle(0x8D6E63);g.fillRect(4,4,22,4);g.fillRect(4,14,22,4);g.fillRect(30,4,22,4);g.fillRect(30,14,22,4);g.fillStyle(0x6D4C41);g.fillRect(10,20,10,10);g.fillRect(60,20,10,10);g.generateTexture('wall',100,30);g.clear();
            
            g.fillStyle(0x4E342E);g.fillRect(2,25,46,20);g.fillStyle(0x5D4037);g.fillRect(0,20,50,8);g.fillStyle(0x6D4C41);g.fillRect(5,30,15,10);g.fillStyle(0x3E2723);g.fillRect(35,30,10,15);g.fillStyle(0xFFA726);g.fillRect(20,20,10,10);g.generateTexture('shack',50,48);g.clear();
            
            g.fillStyle(0x795548);g.fillRect(2,2,26,26);g.fillStyle(0x6D4C41);g.fillRect(0,0,30,4);g.fillRect(0,26,30,4);g.fillStyle(0x5D4037);g.fillRect(0,12,30,4);g.fillStyle(0x4E342E);g.fillRect(8,8,14,10);g.generateTexture('crate',30,30);g.clear();
            
            g.fillStyle(0xD32F2F);g.fillRect(10,28,20,25);g.fillStyle(0x1976D2);g.fillRect(10,53,8,12);g.fillRect(22,53,8,12);g.fillStyle(0xFFCCBC);g.fillCircle(20,16,11);g.fillStyle(0xFFAB91);g.fillCircle(16,14,3);g.fillCircle(24,14,3);g.fillStyle(0x5D4037);g.fillCircle(20,10,11);g.fillStyle(0x212121);g.fillRect(16,9,3,3);g.fillRect(21,9,3,3);g.fillStyle(0xFFFFFF);g.fillRect(18,12,4,2);g.generateTexture('survivor1',40,65);g.clear();
            
            g.fillStyle(0x7B1FA2);g.fillRect(12,28,16,25);g.fillStyle(0x4A148C);g.fillRect(12,53,16,12);g.fillStyle(0xFFCCBC);g.fillCircle(20,16,10);g.fillStyle(0xFF8F00);g.fillCircle(20,10,10);g.fillStyle(0xFF6F00);g.fillCircle(14,14,5);g.fillCircle(26,14,5);g.fillStyle(0x212121);g.fillCircle(17,14,2);g.fillCircle(23,14,2);g.fillStyle(0xFFECB3);g.fillCircle(20,8,3);g.generateTexture('survivor2',40,65);g.clear();
            
            g.fillStyle(0x388E3C);g.fillRect(10,28,20,25);g.fillStyle(0x1565C0);g.fillRect(10,53,8,12);g.fillRect(22,53,8,12);g.fillStyle(0xD7CCC8);g.fillCircle(20,16,11);g.fillStyle(0x424242);g.fillCircle(20,8,11);g.fillStyle(0x212121);g.fillRect(16,7,3,2);g.fillRect(21,7,3,2);g.fillStyle(0xFFD700);g.fillCircle(28,12,4);g.generateTexture('survivor3',40,65);g.clear();
            
            g.fillStyle(0xFF5722);g.fillRect(12,28,16,25);g.fillStyle(0x3F51B5);g.fillRect(12,53,16,12);g.fillStyle(0xFFCCBC);g.fillCircle(20,16,10);g.fillStyle(0x8D6E63);g.fillCircle(20,9,10);g.fillStyle(0x6D4C41);g.fillCircle(12,14,4);g.fillCircle(28,14,4);g.fillStyle(0x212121);g.fillCircle(17,14,2);g.fillCircle(23,14,2);g.fillStyle(0xE91E63);g.fillRect(15,22,10,6);g.generateTexture('survivor4',40,65);g.clear();
            
            g.fillStyle(0x212121);g.fillRect(8,28,24,30);g.fillStyle(0xB71C1C);g.fillRect(5,24,30,18);g.fillStyle(0x7f0000);g.fillCircle(12,35,5);g.fillCircle(20,38,4);g.fillCircle(28,35,5);g.fillStyle(0xD7CCC8);g.fillCircle(20,14,12);g.fillStyle(0x37474F);g.fillRect(8,6,24,18);g.fillStyle(0xFF1744);g.fillCircle(14,10,4);g.fillCircle(26,10,4);g.fillStyle(0x000000);g.fillRect(15,18,10,4);g.fillStyle(0xFFFFFF);g.fillCircle(17,16,2);g.fillCircle(23,16,2);g.generateTexture('killer_m',40,70);g.clear();
            
            g.fillStyle(0x546E7A);g.fillRect(2,2,36,26);g.fillStyle(0x37474F);g.fillRect(4,4,14,10);g.fillRect(22,4,14,10);g.fillStyle(0x00E676);g.fillRect(6,6,5,6);g.fillRect(24,6,5,6);g.fillStyle(0xF44336);g.fillCircle(18,15,8);g.fillStyle(0xFFFFFF);g.fillCircle(18,15,4);g.generateTexture('generator',40,30);g.clear();
            
            g.fillStyle(0x4E342E);g.fillRect(0,0,70,55);g.fillStyle(0x3E2723);g.fillRect(5,5,25,45);g.fillRect(40,5,25,45);g.fillStyle(0x2E1B15);g.fillRect(3,0,8,10);g.fillRect(59,0,8,10);g.fillStyle(0xF44336);g.fillCircle(17,25,8);g.fillCircle(53,25,8);g.fillStyle(0x212121);g.fillRect(30,35,10,15);g.fillStyle(0x4CAF50);g.fillRect(15,15,40,20);g.generateTexture('exit',70,55);g.clear();
            
            g.fillStyle(0x2E7D32);g.fillRect(0,0,32,32);g.fillStyle(0x388E3C);g.fillCircle(8,8,5);g.fillCircle(24,20,4);g.fillCircle(16,28,3);g.fillStyle(0x1B5E20);g.fillCircle(12,16,3);g.generateTexture('ground',32,32);g.clear();
            
            g.fillStyle(0x424242);g.fillCircle(15,15,12);g.fillStyle(0x616161);g.fillCircle(15,15,8);g.fillStyle(0x757575);g.fillCircle(15,15,4);g.generateTexture('hook',30,30);g.clear();
        }

        function create(){
            var mw = 1200, mh = 900;
            for(var x = 0; x < mw; x += 32){
                for(var y = 0; y < mh; y += 32){
                    var t = this.add.image(x + 16, y + 16, 'ground');
                    t.setAlpha(0.5 + Math.random() * 0.5);
                }
            }
            
            var trees = [{x:50,y:50},{x:150,y:80},{x:1100,y:50},{x:1050,y:120},{x:50,y:800},{x:120,y:850},{x:1100,y:800},{x:1050,y:850},{x:600,y:50},{x:300,y:300},{x:900,y:300},{x:300,y:600},{x:900,y:600}];
            trees.forEach(function(p){this.add.image(p.x, p.y, 'tree').setDepth(p.y);}, this);
            
            var bushes = [{x:200,y:200},{x:400,y:150},{x:800,y:200},{x:200,y:700},{x:1000,y:400},{x:600,y:700}];
            bushes.forEach(function(p){this.add.image(p.x, p.y, 'bush').setDepth(p.y);}, this);
            
            this.colliders = [];
            var builds = [{x:200,y:200},{x:900,y:200},{x:200,y:600},{x:900,y:600},{x:550,y:400}];
            builds.forEach(function(b){
                var bl = this.add.image(b.x, b.y, 'building');
                bl.setDepth(b.y);
                this.colliders.push(bl);
            }, this);
            
            var shacks = [{x:100,y:400},{x:1050,y:300},{x:350,y:650},{x:800,y:100}];
            shacks.forEach(function(s){
                var sh = this.add.image(s.x, s.y, 'shack');
                sh.setDepth(s.y);
                this.colliders.push(sh);
            }, this);
            
            var fences = [{x:300,y:150},{x:850,y:350},{x:150,y:500},{x:1000,y:650}];
            fences.forEach(function(f){
                var fe = this.add.image(f.x, f.y, 'wall');
                fe.setDepth(f.y);
                this.colliders.push(fe);
            }, this);
            
            var crates = [{x:280,y:350},{x:920,y:500},{x:400,y:200},{x:750,y:650}];
            crates.forEach(function(c){
                var cr = this.add.image(c.x, c.y, 'crate');
                cr.setDepth(c.y);
                this.colliders.push(cr);
            }, this);
            
            var group = this.physics.add.group();
            this.colliders.forEach(function(obj){
                obj.body = obj.body || {};
                obj.body.immovable = true;
                group.add(obj);
            });
            group.setImmovable(true);
            
            this.physics.add.collider(player, group);
            
            var genPos = [{x:150,y:150},{x:1050,y:150},{x:600,y:350},{x:150,y:750},{x:1050,y:750}];
            genPos.forEach(function(p){
                var gen = this.add.sprite(p.x, p.y, 'generator');
                gen.progress = 0;
                gen.repaired = false;
                gen.beingRepaired = false;
                var bar = this.add.graphics();
                bar.x = p.x - 20;
                bar.y = p.y - 20;
                gen.bar = bar;
                var light = this.add.circle(p.x + 15, p.y - 12, 5, 0x00ff00);
                light.setAlpha(0);
                light.setDepth(p.y + 1);
                gen.light = light;
                this.physics.add.existing(gen);
                gen.body.setImmovable(true);
                gen.body.setCollideWorldBounds(false);
                generators.push(gen);
            }, this);
            
            this.exit = this.add.sprite(1150, 450, 'exit');
            this.exit.setTint(0x440000);
            
            var hookPositions = [{x:350,y:250},{x:800,y:250},{x:350,y:650},{x:800,y:650},{x:575,y:450}];
            this.hooks = [];
            hookPositions.forEach(function(hp){
                var hook = this.add.sprite(hp.x, hp.y, 'hook');
                hook.setTint(0x888888);
                hook.setScale(1.2);
                hook.occupied = false;
                this.hooks.push(hook);
            }, this);
            
            player = isKiller ? this.add.sprite(600, 450, 'killer_m') : this.add.sprite(150, 150, 'survivor1');
            this.physics.add.existing(player);
            player.body.setCollideWorldBounds(false);
            player.setDepth(1000);
            
            this.physics.add.collider(player, group);
            
            if(isKiller){
                this.survivors = [];
                var sp = [{x:1050,y:150},{x:150,y:750},{x:1050,y:750}];
                var st = ['survivor2', 'survivor3', 'survivor4'];
                sp.forEach(function(p, i){
                    var s = this.add.sprite(p.x, p.y, st[i]);
                    s.alive = true;
                    s.dying = false;
                    s.hooked = false;
                    this.physics.add.existing(s);
                    s.body.setCollideWorldBounds(false);
                    s.setDepth(p.y);
                    this.physics.add.collider(s, group);
                    this.survivors.push(s);
                }, this);
            } else {
                this.survivors = [];
            }
            
            this.cameras.main.setBounds(0, 0, 0, 0);
            this.cameras.main.setZoom(1);
            
            initInput(this);
        }

        function update(time, dt){
            if(!player) return;
            
            var vec = getInputVector();
            var spd = isKiller ? CONFIG.KILLER_SPEED : CONFIG.PLAYER_SPEED;
            player.body.setVelocity(vec.x * spd, vec.y * spd);
            
            if(isKiller && isActionPressed()){
                this.survivors.forEach(function(s){
                    if(s.alive && !s.dying){
                        var d = Phaser.Math.Distance.Between(player.x, player.y, s.x, s.y);
                        if(d < 50){
                            s.alive = false;
                            s.dying = true;
                            s.setTint(0x888888);
                            UI.showToast('Выживший сбит! Отнеси на крюк!');
                        }
                    } else if(s.dying && !s.hooked){
                        var d = Phaser.Math.Distance.Between(player.x, player.y, s.x, s.y);
                        if(d < 50 && Math.abs(vec.x) < 0.3 && Math.abs(vec.y) < 0.3){
                            var hook = this.hooks.find(function(h){ return !h.occupied; });
                            if(hook){
                                s.x = hook.x;
                                s.y = hook.y;
                                s.hooked = true;
                                hook.occupied = true;
                                hook.setTint(0xff0000);
                                UI.showToast('Выживший повешен!');
                                survivorsLeft--;
                            }
                        }
                    }
                }, this);
                
                generators.forEach(function(gen){
                    var d = Phaser.Math.Distance.Between(player.x, player.y, gen.x, gen.y);
                    if(d < 50 && gen.progress > 0){
                        gen.progress = 0;
                        gen.bar.clear();
                        gen.setTint(0x444444);
                        UI.showToast('Генератор сломан!');
                    } else if(d < 50 && !gen.repaired){
                        gen.beingRepaired = true;
                    }
                });
            } else if(isKiller) {
                generators.forEach(function(gen){
                    gen.beingRepaired = false;
                });
            }
            
            if(isKiller && this.survivors){
                this.survivors.forEach(function(s){
                    if(s.alive){
                        if(Math.random() < 0.02){
                            s.body.setVelocity((Math.random() - 0.5) * 60, (Math.random() - 0.5) * 60);
                        }
                        var d = Phaser.Math.Distance.Between(s.x, s.y, player.x, player.y);
                        if(d < 150){
                            var a = Phaser.Math.Angle.Between(s.x, s.y, player.x, player.y);
                            s.body.setVelocity(Math.cos(a) * 80, Math.sin(a) * 80);
                        }
                    } else if(s.dying && !s.hooked && !isActionPressed()){
                        s.body.setVelocity(0, 0);
                    }
                });
            }
            
            if(!isKiller){
                var nearGenerator = false;
                if(isActionPressed()){
                    generators.forEach(function(gen){
                        if(!gen.repaired){
                            var d = Phaser.Math.Distance.Between(player.x, player.y, gen.x, gen.y);
                            if(d < 50){
                                nearGenerator = true;
                                gen.progress += dt / 100;
                                gen.bar.clear();
                                gen.bar.fillStyle(0x000000, 0.7);
                                gen.bar.fillRect(-20, -20, 40, 6);
                                gen.bar.fillStyle(0xffff00);
                                gen.bar.fillRect(-19, -19, 38 * (gen.progress / 100), 4);
                                if(gen.progress >= 100){
                                    gen.repaired = true;
                                    gen.light.setAlpha(1);
                                    gen.setTint(0x00ff00);
                                    UI.showToast('Генератор починен!');
                                }
                            }
                        }
                    });
                }
                
                if(nearGenerator){
                    player.body.setVelocity(0, 0);
                }
                
                var rep = generators.filter(function(g){ return g.repaired; }).length;
                if(rep >= CONFIG.GENERATOR_COUNT && !exitOpen){
                    exitOpen = true;
                    this.exit.setTint(0x00ff00);
                    UI.showToast('ВЫХОД ОТКРЫТ!');
                }
                
                if(exitOpen){
                    var d = Phaser.Math.Distance.Between(player.x, player.y, this.exit.x, this.exit.y);
                    if(d < 50){
                        UI.showGameOver(true);
                        stopGame();
                        return;
                    }
                }
            }
            
            if(isKiller && catchCooldown > 0) catchCooldown -= dt / 1000;
            
            if(isKiller && this.survivors){
                var allDead = this.survivors.every(function(s){ return s.hooked; });
                if(allDead && this.survivors.length > 0){
                    UI.showGameOver(false);
                    stopGame();
                    return;
                }
            }
            
            player.setDepth(player.y + 1000);
            
            var rep = generators.filter(function(g){ return g.repaired; }).length;
            var roleEl = document.getElementById('player-role');
            var genEl = document.getElementById('gen-count');
            var exitEl = document.getElementById('exit-state');
            var aliveEl = document.getElementById('alive-count');
            
            if(roleEl) roleEl.textContent = isKiller ? 'Убийца' : 'Выживший';
            if(genEl) genEl.textContent = rep + '/5';
            if(exitEl) exitEl.textContent = exitOpen ? 'открыт' : 'закрыт';
            if(aliveEl) aliveEl.textContent = 'Выжившие: ' + survivorsLeft;
        }
                        var d = Phaser.Math.Distance.Between(s.x, s.y, player.x, player.y);
                        if(d < 150){
                            var a = Phaser.Math.Angle.Between(s.x, s.y, player.x, player.y);
                            s.body.setVelocity(Math.cos(a) * 80, Math.sin(a) * 80);
                        }
                    }
                });
            }
            
            if(!isKiller){
                if(isActionPressed()){
                    generators.forEach(function(gen){
                        if(!gen.repaired){
                            var d = Phaser.Math.Distance.Between(player.x, player.y, gen.x, gen.y);
                            if(d < 50){
                                gen.progress += dt / 100;
                                gen.bar.clear();
                                gen.bar.fillStyle(0x000000, 0.7);
                                gen.bar.fillRect(-20, -20, 40, 6);
                                gen.bar.fillStyle(0xffff00);
                                gen.bar.fillRect(-19, -19, 38 * (gen.progress / 100), 4);
                                if(gen.progress >= 100){
                                    gen.repaired = true;
                                    gen.light.setAlpha(1);
                                    gen.setTint(0x00ff00);
                                    UI.showToast('Генератор починен!');
                                }
                            }
                        }
                    });
                }
                
                generators.forEach(function(gen){
                    if(gen.repaired && gen.light){
                        gen.x += (Math.random() - 0.5) * 1.5;
                        gen.y += (Math.random() - 0.5) * 1.5;
                    }
                });
                
                var rep = generators.filter(function(g){ return g.repaired; }).length;
                if(rep >= CONFIG.GENERATOR_COUNT && !exitOpen){
                    exitOpen = true;
                    this.exit.setTint(0x00ff00);
                    UI.showToast('ВЫХОД ОТКРЫТ!');
                }
                
                if(exitOpen){
                    var d = Phaser.Math.Distance.Between(player.x, player.y, this.exit.x, this.exit.y);
                    if(d < 50){
                        UI.showGameOver(true);
                        stopGame();
                        return;
                    }
                }
            }
            
            if(isKiller && catchCooldown > 0) catchCooldown -= dt / 1000;
            
            if(isKiller && this.survivors){
                this.survivors.forEach(function(s){
                    if(s.alive){
                        var d = Phaser.Math.Distance.Between(player.x, player.y, s.x, s.y);
                        if(d < CONFIG.CATCH_DISTANCE && catchCooldown <= 0){
                            s.alive = false;
                            s.setAlpha(0.3);
                            survivorsLeft--;
                            catchCooldown = CONFIG.CATCH_COOLDOWN;
                            UI.showToast('Пойман!');
                        }
                    }
                });
                if(survivorsLeft <= 0){
                    UI.showGameOver(false);
                    stopGame();
                    return;
                }
            }
            
            player.setDepth(player.y + 1000);
            
            var rep = generators.filter(function(g){ return g.repaired; }).length;
            var roleEl = document.getElementById('player-role');
            var genEl = document.getElementById('gen-count');
            var exitEl = document.getElementById('exit-state');
            var aliveEl = document.getElementById('alive-count');
            
            if(roleEl) roleEl.textContent = isKiller ? 'Ужийца' : 'Выживший';
            if(genEl) genEl.textContent = rep + '/5';
            if(exitEl) exitEl.textContent = exitOpen ? 'открыт' : 'закрыт';
            if(aliveEl) aliveEl.textContent = 'Выжившие: ' + survivorsLeft;
        }

        var inputVector = {x: 0, y: 0};
        var actionPressed = false;
        
        function initInput(scene){
            var joystick = document.createElement('div');
            joystick.setAttribute('data-joystick', 'true');
            joystick.style.cssText = 'position:fixed;bottom:30px;left:30px;width:110px;height:110px;z-index:200;touch-action:none;';
            joystick.innerHTML = '<div style="width:100%;height:100%;background:rgba(255,255,255,0.15);border:3px solid rgba(255,255,255,0.4);border-radius:50%;position:relative;"><div style="width:45px;height:45px;background:rgba(255,50,50,0.9);border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)"></div></div>';
            document.body.appendChild(joystick);
            
            var actionBtn = document.createElement('div');
            actionBtn.setAttribute('data-action-btn', 'true');
            actionBtn.textContent = 'ДЕЙСТВИЕ';
            actionBtn.style.cssText = 'position:fixed;bottom:50px;right:30px;width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#ff6600,#ff3300);border:3px solid rgba(255,255,255,0.5);color:#fff;font-size:11px;font-weight:bold;display:flex;align-items:center;justify-content:center;z-index:200;touch-action:none;';
            document.body.appendChild(actionBtn);
            
            var joystickInner = joystick.firstChild;
            var knob = joystickInner.firstChild;
            var touching = false;
            var maxDist = 45;
            var joystickId = null;
            
            function updateJoystick(clientX, clientY){
                var rect = joystickInner.getBoundingClientRect();
                var dx = clientX - (rect.left + rect.width / 2);
                var dy = clientY - (rect.top + rect.height / 2);
                var dist = Math.min(Math.sqrt(dx * dx + dy * dy), maxDist);
                var angle = Math.atan2(dy, dx);
                var normX = dist / maxDist * Math.cos(angle);
                var normY = dist / maxDist * Math.sin(angle);
                knob.style.transform = 'translate(calc(-50% + ' + (normX * maxDist) + 'px), calc(-50% + ' + (normY * maxDist) + 'px))';
                inputVector.x = normX;
                inputVector.y = normY;
            }
            
            joystick.addEventListener('touchstart', function(e){
                e.preventDefault();
                e.stopPropagation();
                touching = true;
                joystickId = e.changedTouches[0].identifier;
                updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
            }, {passive: false});
            
            joystick.addEventListener('touchmove', function(e){
                e.preventDefault();
                e.stopPropagation();
                if(touching){
                    for(var i = 0; i < e.changedTouches.length; i++){
                        if(e.changedTouches[i].identifier === joystickId){
                            updateJoystick(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
                            break;
                        }
                    }
                }
            }, {passive: false});
            
            joystick.addEventListener('touchend', function(e){
                e.preventDefault();
                e.stopPropagation();
                touching = false;
                joystickId = null;
                inputVector.x = 0;
                inputVector.y = 0;
                knob.style.transform = 'translate(-50%,-50%)';
            });
            
            joystick.addEventListener('touchcancel', function(){
                touching = false;
                joystickId = null;
                inputVector.x = 0;
                inputVector.y = 0;
                knob.style.transform = 'translate(-50%,-50%)';
            });
            
            actionBtn.addEventListener('touchstart', function(e){
                e.preventDefault();
                e.stopPropagation();
                actionPressed = true;
                actionBtn.style.transform = 'scale(0.95)';
            }, {passive: false});
            
            actionBtn.addEventListener('touchend', function(e){
                e.preventDefault();
                e.stopPropagation();
                actionPressed = false;
                actionBtn.style.transform = 'scale(1)';
            });
            
            actionBtn.addEventListener('touchcancel', function(){
                actionPressed = false;
                actionBtn.style.transform = 'scale(1)';
            });
        }
        
        function getInputVector(){ return inputVector; }
        function isActionPressed(){ return actionPressed; }
        
        var attempts = 0;
        
        function initApp(){
            if(window.phaserLoaded && typeof Phaser !== 'undefined' && typeof Phaser.Game !== 'undefined'){
                document.getElementById('loading-screen').classList.remove('active');
                document.getElementById('main-menu').classList.add('active');
                setupButtons();
                initTelegram();
                return true;
            }
            return false;
        }
        
        function tryInit(){
            if(initApp()) return;
            attempts++;
            var loadingText = document.querySelector('#loading-screen p');
            if(attempts <= 30){
                if(loadingText) loadingText.textContent = 'Загрузка... (' + attempts + ')';
                setTimeout(tryInit, 150);
            } else if(window.phaserLoadError){
                if(loadingText) loadingText.textContent = 'Ошибка загрузки. Проверьте соединение.';
            } else {
                if(loadingText) loadingText.textContent = 'Загрузка...';
                setTimeout(tryInit, 300);
            }
        }
        
        function initTelegram(){
            var tg = document.createElement('script');
            tg.src = 'https://telegram.org/js/telegram-web-app.js';
            tg.onload = function(){
                try{ Telegram.WebApp.ready(); Telegram.WebApp.expand(); }catch(e){}
            };
            document.head.appendChild(tg);
        }
        
        tryInit();
        
        var currentPlayerId = 'player_' + Math.random().toString(36).substr(2, 9);
        var currentRoomId = null;
        var isHost = false;
        var roomUnsubscribe = null;
        var lobbyData = null;
        
        function createLobby(){
            if(!window.firebaseLoaded){
                UI.showToast('Firebase не загружена');
                return;
            }
            var code = 'room_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            currentRoomId = code;
            isHost = true;
            document.getElementById('lobby-status').textContent = 'Ожидание игроков...';
            document.getElementById('lobby-players').innerHTML = '<div class="player-slot host">👹 Маньяк (Вы)</div>';
            UI.showScreen('lobby-create');
            UI.showToast('Лобби создано');
            
            var roomRef = firebase.database().ref('rooms/' + code);
            roomRef.set({
                code: code,
                hostId: currentPlayerId,
                status: 'waiting',
                createdAt: Date.now(),
                players: {}
            }).then(function(){
                listenToRoom(code);
            }).catch(function(err){
                document.getElementById('lobby-status').textContent = 'Ошибка: ' + err.message;
            });
        }
        
        function joinLobby(){
            if(!window.firebaseLoaded){
                UI.showToast('Firebase не загружена');
                return;
            }
            UI.showScreen('lobby-join');
            document.getElementById('search-status').textContent = 'Поиск лобби...';
            
            var searchInterval = setInterval(function(){
                var roomsRef = firebase.database().ref('rooms');
                roomsRef.orderByChild('status').equalTo('waiting').once('value').then(function(snapshot){
                    var found = false;
                    var count = 0;
                    snapshot.forEach(function(child){
                        var room = child.val();
                        var players = room.players || {};
                        var pCount = Object.keys(players).length;
                        count++;
                        if(pCount < 4 && !found){
                            currentRoomId = child.key;
                            isHost = false;
                            found = true;
                            players[currentPlayerId] = { id: currentPlayerId, role: 'survivor', joinedAt: Date.now() };
                            firebase.database().ref('rooms/' + currentRoomId + '/players').set(players).then(function(){
                                clearInterval(searchInterval);
                                UI.showScreen('lobby-create');
                                document.getElementById('lobby-status').textContent = 'Подключено к лобби';
                                document.getElementById('btn-start-game').style.display = 'none';
                                listenToRoom(currentRoomId);
                                UI.showToast('Подключился к лобби');
                            });
                            return true;
                        }
                    });
                    if(!found){
                        document.getElementById('search-status').textContent = 'Поиск лобби... (' + count + ' проверено)';
                    }
                }).catch(function(err){
                    document.getElementById('search-status').textContent = 'Ошибка: ' + err.message;
                    clearInterval(searchInterval);
                });
            }, 2000);
            
            document.getElementById('btn-leave-search').onclick = function(){
                clearInterval(searchInterval);
                UI.showScreen('main-menu');
            };
        }
        
        function listenToRoom(roomCode){
            var roomRef = firebase.database().ref('rooms/' + roomCode);
            roomUnsubscribe = roomRef.on('value', function(snapshot){
                var data = snapshot.val();
                if(!data) return;
                lobbyData = data;
                var players = data.players || {};
                var playerList = document.getElementById('lobby-players');
                var html = '<div class="player-slot host">👹 Маньяк</div>';
                var count = 1;
                for(var pid in players){
                    if(pid !== data.hostId){
                        html += '<div class="player-slot">🏃 Выживший ' + count + '</div>';
                        count++;
                    }
                }
                for(var i = count; i <= 4; i++){
                    html += '<div class="player-slot empty">⏳ Ожидание...</div>';
                }
                playerList.innerHTML = html;
                var btnStart = document.getElementById('btn-start-game');
                if(isHost && count >= 2){
                    btnStart.disabled = false;
                    btnStart.textContent = 'Начать игру (' + count + '/4)';
                } else if(isHost) {
                    btnStart.disabled = true;
                    btnStart.textContent = 'Начать (нужно 2+ игрока)';
                }
                if(data.status === 'playing'){
                    if(roomUnsubscribe) roomRef.off('value', roomUnsubscribe);
                    startMultiplayerGame(data);
                }
            });
        }
        
        function leaveLobby(){
            if(roomUnsubscribe && currentRoomId){
                firebase.database().ref('rooms/' + currentRoomId).off('value', roomUnsubscribe);
            }
            if(currentRoomId && !isHost){
                firebase.database().ref('rooms/' + currentRoomId + '/players/' + currentPlayerId).remove();
            }
            if(isHost && currentRoomId){
                firebase.database().ref('rooms/' + currentRoomId).remove();
            }
            currentRoomId = null;
            isHost = false;
            lobbyData = null;
            UI.showScreen('main-menu');
        }
        
        function startGameAsHost(){
            if(!currentRoomId || !isHost) return;
            firebase.database().ref('rooms/' + currentRoomId + '/status').set('playing').then(function(){
                UI.showToast('Игра началась!');
            });
        }
        
        function startMultiplayerGame(roomData){
            isKiller = (currentPlayerId === roomData.hostId);
            exitOpen = false;
            survivorsLeft = 4;
            catchCooldown = 0;
            generators = [];
            UI.showScreen('game-screen');
            UI.showToast(isKiller ? 'Поймай всех!' : 'Найди генераторы!');
            initGame();
        }
        
        function setupButtons(){
            var btnSolo = document.getElementById('btn-solo');
            var btnMulti = document.getElementById('btn-multi');
            var btnKiller = document.getElementById('btn-play-killer');
            var btnSurvivor = document.getElementById('btn-play-survivor');
            var btnBack = document.getElementById('btn-back-menu');
            var btnStartGame = document.getElementById('btn-start-game');
            var btnLeaveLobby = document.getElementById('btn-leave-lobby');
            var btnLeaveSearch = document.getElementById('btn-leave-search');
            
            if(btnSolo) btnSolo.onclick = function(){
                UI.showScreen('role-select');
            };
            
            if(btnMulti) btnMulti.onclick = function(){
                UI.showScreen('role-select');
            };
            
            if(btnKiller) btnKiller.onclick = function(){
                createLobby();
            };
            
            if(btnSurvivor) btnSurvivor.onclick = function(){
                joinLobby();
            };
            
            if(btnBack) btnBack.onclick = function(){
                stopGame();
                leaveLobby();
                UI.showScreen('main-menu');
            };
            
            if(btnStartGame) btnStartGame.onclick = function(){
                startGameAsHost();
            };
            
            if(btnLeaveLobby) btnLeaveLobby.onclick = function(){
                leaveLobby();
            };
            
            if(btnLeaveSearch) btnLeaveSearch.onclick = function(){
                UI.showScreen('main-menu');
            };
        }
    })();
    </script>
