#app{width:100%;height:100%;position:relative;overflow:hidden}
.screen{position:fixed;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,#111 0%,#1a1a1a 100%)}
.screen.active{display:flex}
#game-screen.active{display:block!important;padding:0;background:#1a1a1a}
h1{font-size:28px;color:#ff3333;margin-bottom:30px;text-align:center;text-shadow:0 0 20px rgba(255,51,51,.5)}
h2{font-size:22px;color:#ff3333;margin-bottom:20px;text-align:center}
.btn{width:210px;padding:14px 20px;margin:7px 0;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;background:#333;color:#fff;touch-action:manipulation}
.btn.primary{background:linear-gradient(135deg,#ff3333,#cc0000)}
.btn.secondary{background:#444}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:active{transform:scale(.97)}
.menu-buttons{display:flex;flex-direction:column;align-items:center}
.player-slot{padding:10px 18px;background:rgba(255,255,255,.08);border-radius:6px;text-align:center;border:1px solid rgba(255,255,255,.15);font-size:15px;margin:4px 0;width:100%;max-width:280px}
.player-slot.host{background:rgba(255,51,51,.25);border-color:#ff3333;color:#ff8888}
.player-slot.empty{color:#555;font-style:italic}
#lobby-players{display:flex;flex-direction:column;align-items:center;margin:15px 0;width:100%}
#lobby-status,#search-status{font-size:15px;color:#aaa;margin-bottom:8px;text-align:center}
.version{position:absolute;bottom:15px;color:#555;font-size:11px}
#toast{position:fixed;bottom:140px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.92);color:#fff;padding:11px 22px;border-radius:8px;font-size:14px;z-index:99999;display:none;white-space:nowrap;pointer-events:none}
#toast.show{display:block;animation:fadeInOut 2.5s forwards}
@keyframes fadeInOut{0%{opacity:0;transform:translateX(-50%) translateY(15px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}75%{opacity:1}100%{opacity:0}}
#hud{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none;z-index:9000;flex-wrap:wrap;gap:4px}
#hud>div{background:rgba(0,0,0,.75);padding:6px 10px;border-radius:6px;font-size:11px;white-space:nowrap}
#hud #role-indicator{color:#ff8888;font-weight:700}

#game-over{z-index:10000}

.loader-tips{font-size:11px;color:#555;margin-top:10px;max-width:260px;text-align:center;line-height:1.5}

/* ═══════ FIREBASE DB FUNCTIONS ═══════ */
var db = null;
var firebaseReady = false;

function initFirebaseDB() {
  return new Promise(function(resolve, reject) {
    if (typeof firebase === 'undefined') {
      console.error('Firebase НЕ загружен!');
      reject(new Error('Firebase SDK не загружен'));

    try {

      resolve(true);
    } catch (error) {
      console.error('Ошибка Firebase Database:', error);
      reject(error);
    }
  });
}

function isFirebaseReady() {
  return firebaseReady && db !== null && db !== undefined;
}

/* ═══════ ROOM FUNCTIONS ═══════ */
function createRoom(roomName, maxPlayers, hostId, hostName) {
  if (!firebaseReady) return Promise.reject(new Error('Firebase не готова'));

  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var roomCode = '';
  for (var i = 0; i < 6; i++) {
    roomCode += chars.charAt(Math.floor(Math.random() * chars.length));
  }

  var roomData = {
    code: roomCode, name: roomName || 'Комната', maxPlayers: maxPlayers || 4,
    hostId: hostId, hostName: hostName, status: 'waiting', createdAt: Date.now(), players: {}
  };
  roomData.players[hostId] = { id: hostId, name: hostName, role: 'killer', isHost: true, ready: true, joinedAt: Date.now() };

  return db.ref('rooms/' + roomCode).set(roomData)
    .then(function() { return { success: true, roomId: roomCode, roomData: roomData }; })
    .catch(function(error) {
      console.error('Ошибка создания комнаты:', error);
      return { success: false, error: error.message };
    });
}

function joinRoom(roomCode, playerId, playerName) {
  if (!firebaseReady) return Promise.reject(new Error('Firebase не готова'));

  return db.ref('rooms/' + roomCode.toUpperCase()).once('value')
    .then(function(snapshot) {
      if (!snapshot.exists()) return { success: false, error: 'Комната не найдена' };
      var roomData = snapshot.val();
      var playerCount = Object.keys(roomData.players || {}).length;
      if (playerCount >= roomData.maxPlayers) return { success: false, error: 'Комната полна' };
      if (roomData.status === 'playing') return { success: false, error: 'Игра уже началась' };

      var playerData = { id: playerId, name: playerName, role: 'survivor', isHost: false, ready: true, joinedAt: Date.now() };
      return db.ref('rooms/' + roomCode.toUpperCase() + '/players/' + playerId).set(playerData)
        .then(function() {
          roomData.players[playerId] = playerData;
          return { success: true, roomId: roomCode.toUpperCase(), roomData: roomData };
        });
    })
    .catch(function(error) {
      console.error('Ошибка присоединения:', error);
      return { success: false, error: error.message };
    });
}

function startGame(roomCode) {
  console.log('[FB] startGame called:', roomCode);
  if (!firebaseReady) return Promise.reject(new Error('Firebase не готова'));

  return db.ref('rooms/' + roomCode).once('value')
    .then(function(snapshot) {
      var roomData = snapshot.val();
      var playerIds = Object.keys(roomData.players || {});
      console.log('[FB] startGame playerIds:', playerIds);
      if (playerIds.length < 2) return { success: false, error: 'Нужно минимум 2 игрока' };

      var updates = { status: 'playing', startedAt: Date.now() };
      playerIds.forEach(function(id) {
        updates['players/' + id + '/role'] = (id === roomData.hostId) ? 'killer' : 'survivor';
      });
      console.log('[FB] startGame updates:', updates);
      return db.ref('rooms/' + roomCode).update(updates)
        .then(function() {
          console.log('[FB] Game started in room:', roomCode);
          return { success: true };
        });
    })
    .catch(function(error) { return { success: false, error: error.message }; });
}

/* ═══════ GAME SESSION SYNC ═══════ */
var gameSessionRef = null;
var gameSessionListenerRef = null;
var gameSessionCallback = null;

function initGameSession(roomCode, playerId, isKiller) {
  console.log('[FB] initGameSession called:', roomCode, playerId, isKiller, 'firebaseReady:', firebaseReady);
  if (!firebaseReady) return Promise.reject(new Error('Firebase не готова'));

  gameSessionRef = db.ref('gameSessions/' + roomCode);

  var playerData = {
    id: playerId, role: isKiller ? 'killer' : 'survivor',
    x: isKiller ? 1200 : 200 + Math.random() * 100, y: isKiller ? 900 : 200 + Math.random() * 100,
    state: 'alive', health: isKiller ? null : 100, lastUpdate: Date.now()
  };

  var promise = gameSessionRef.child('players').child(playerId).set(playerData);

  if (isKiller) {
    var generators = {};
    for (var i = 0; i < 5; i++) {
      generators[i] = { id: i, progress: 0, repaired: false, lastUpdate: Date.now() };
    }
    promise = promise.then(function() { return gameSessionRef.child('generators').set(generators); });
  }

  return promise.then(function() {
    console.log('Game session initialized:', playerId);
    return true;
  });
}

function setGameResult(roomCode, winner, message) {
  if (!firebaseReady || !db) return;
  db.ref('gameSessions/' + roomCode).update({
    status: 'finished', winner: winner, resultMessage: message, endedAt: Date.now()
  }).catch(function() {});
}

function subscribeToGameSession(roomCode, callbacks) {
  if (!firebaseReady || !db) return null;

  if (gameSessionListenerRef && gameSessionCallback) {
    gameSessionListenerRef.off('value', gameSessionCallback);
  }

  gameSessionListenerRef = db.ref('gameSessions/' + roomCode);
  gameSessionCallback = function(snapshot) {
    if (!snapshot.exists()) return;
    var data = snapshot.val();
    if (callbacks.onPlayersUpdate) callbacks.onPlayersUpdate(data.players || {});
    if (callbacks.onGeneratorsUpdate) callbacks.onGeneratorsUpdate(data.generators || {});
    if (callbacks.onCrowsUpdate && data.crows) callbacks.onCrowsUpdate(data.crows);
    if (callbacks.onPalletsUpdate && data.pallets) callbacks.onPalletsUpdate(data.pallets);
    if (callbacks.onGateUpdate && data.gate) callbacks.onGateUpdate(data.gate);
    if (callbacks.onHatchUpdate && data.hatch) callbacks.onHatchUpdate(data.hatch);
    if (callbacks.onKillerStun) callbacks.onKillerStun();
    if (callbacks.onGameResult && data.status === 'finished') {
      callbacks.onGameResult(data.winner, data.resultMessage);
    }
  };

  gameSessionListenerRef.on('value', gameSessionCallback, function(error) {
    console.error('[FB] Subscribe error:', error);
    if (callbacks.onError) callbacks.onError(error);
  });

  return function() {
    if (gameSessionListenerRef && gameSessionCallback) {
      gameSessionListenerRef.off('value', gameSessionCallback);
      gameSessionListenerRef = null;
      gameSessionCallback = null;
    }
  };
}

function leaveGameSession(roomCode, playerId) {
  if (!firebaseReady || !db) return;
  db.ref('gameSessions/' + roomCode).child('players/' + playerId).remove().catch(function() {});
  if (gameSessionListenerRef && gameSessionCallback) {
    gameSessionListenerRef.off('value', gameSessionCallback);
    gameSessionListenerRef = null;
    gameSessionCallback = null;
  }
}

/* ═══════ LOBBY FUNCTIONS ═══════ */
function unsubscribeFromLobby() {
  if (gRoomRef && gRoomCallback) {
    gRoomRef.off('value', gRoomCallback);
    gRoomRef = null;
    gRoomCallback = null;
  }
}

function createLobby() {
  if (!isFirebaseReady()) { showToast('Firebase не загружен'); return; }

  gMyId = getMyId();
  gMyRole = 'killer';
  gIsHost = true;
  var hName = getPlayerName();

  showScreen('lobby-create');
  document.getElementById('display-room-code').textContent = 'Создание...';
  document.getElementById('lobby-status').textContent = 'Создание лобби...';
  document.getElementById('btn-start-game').disabled = true;
  document.getElementById('btn-start-game').style.background = '#555';

  createRoom('Комната', 4, gMyId, hName).then(function(result) {
    if (result.success) {
      gRoomId = result.roomId;
      document.getElementById('display-room-code').textContent = result.roomId;
      document.getElementById('lobby-status').textContent = 'Код лобби: ' + result.roomId;
      subscribeToLobby(gRoomId);
      showToast('Лобби создано: ' + result.roomId);
    } else {
      showToast('Ошибка: ' + result.error);
      showScreen('main-menu');
    }
  }).catch(function(e) {
    console.error('Create lobby error:', e);
    showToast('Ошибка создания лобби');
    showScreen('main-menu');
  });
}

function findAndJoinLobby() {
  if (!isFirebaseReady()) { showToast('Firebase не загружен'); return; }

  showScreen('lobby-join');
  gMyId = getMyId();
  gMyRole = 'survivor';
  var sName = getPlayerName();

  document.getElementById('found-lobbies').innerHTML = '<p style="color:#aaa">Поиск лобби...</p>';

  var roomsQuery = db.ref('rooms').orderByChild('status').equalTo('waiting');
  window._roomsQuery = roomsQuery;
  var foundLobby = false;

  roomsQuery.on('child_added', function(snapshot) {
    if (foundLobby) return;
    var room = snapshot.val();
    var playerCount = Object.keys(room.players || {}).length;
    if (playerCount < 4 && room.hostId !== gMyId) {
      foundLobby = true;
      roomsQuery.off();
      joinRoom(snapshot.key, gMyId, sName).then(function(result) {
        if (result.success) {
          gRoomId = result.roomId;
          gIsHost = false;
          showScreen('lobby-create');
          document.getElementById('display-room-code').textContent = result.roomId;
          document.getElementById('lobby-status').textContent = 'Вы присоединились!';
          subscribeToLobby(gRoomId);
          showToast('Подключился к лобби!');
        } else {
          showToast('Ошибка: ' + result.error);
          showScreen('main-menu');
        }
      }).catch(function(e) {
        console.error('Join lobby error:', e);
        showScreen('main-menu');
      });
    }
  });

  setTimeout(function() {
    if (!foundLobby) {
      roomsQuery.off();
      document.getElementById('found-lobbies').innerHTML = '<p style="color:#666">Нет доступных лобби...</p>';
    }
  }, 10000);

  document.getElementById('btn-leave-search').onclick = function() {
    roomsQuery.off();
    showScreen('loading-screen');
    var menuBtns = document.getElementById('menu-buttons');
    if (menuBtns) menuBtns.style.display = 'flex';
  };
}

function subscribeToLobby(roomCode) {
  unsubscribeFromLobby();

  gRoomRef = db.ref('rooms/' + roomCode);
  gRoomCallback = function(snapshot) {
    if (!snapshot.exists()) {
      showToast('Лобби закрыто!');
      showScreen('main-menu');
      return;
    }
    var room = snapshot.val();
    if (room.status === 'closed') {
      showToast('Лобби закрыто!', 3000);
      showScreen('main-menu');
      return;
    }

    var players = room.players || {};
    var playerIds = Object.keys(players);
    var survivorCount = 0;
    playerIds.forEach(function(id) {
      if (players[id].role === 'survivor') survivorCount++;
    });

    var el = document.getElementById('lobby-players');
    if (el) {
      el.innerHTML = '';
      playerIds.forEach(function(pid) {
        if (players[pid].role !== 'killer') return;
        var div = document.createElement('div');
        div.className = 'player-slot host';
        div.textContent = '🔪 ' + players[pid].name + (players[pid].isHost ? ' (хост)' : '');
        el.appendChild(div);
      });
      playerIds.forEach(function(pid) {
        if (players[pid].role !== 'survivor') return;
        var div = document.createElement('div');
        div.className = 'player-slot';
        div.textContent = '🏃 ' + players[pid].name;
        el.appendChild(div);
      });
      for (var i = playerIds.length; i < 4; i++) {
        var div2 = document.createElement('div');
        div2.className = 'player-slot empty';
        div2.textContent = '⏳ Ожидание...';
        el.appendChild(div2);
      }
    }

    var btn = document.getElementById('btn-start-game');
    if (gIsHost && gMyRole === 'killer') {
      if (survivorCount >= 1) {
        btn.disabled = false;
        btn.style.background = 'linear-gradient(135deg,#ff3333,#cc0000)';
        btn.textContent = '▶ Начать игру (' + playerIds.length + '/4)';
      } else {
        btn.disabled = true;
        btn.style.background = '#555';
        btn.textContent = 'Ждём игроков...';
      }
    }

    if (room.status === 'playing') {
      unsubscribeFromLobby();
      var isKiller = (gMyRole === 'killer');
      gGameSessionId = roomCode;
      initGameSession(roomCode, gMyId, isKiller).then(function() {
        if (typeof Game !== 'undefined') {
          Game.start(isKiller, true, roomCode, gMyId);
        }
      }).catch(function(e) {
        console.error('[FB] Game session error:', e);
      });
    }
  };

  gRoomRef.on('value', gRoomCallback, function(error) {
    console.error('[FB] Lobby listen error:', error);
  });
}

window.leaveLobby = function() {
  var wasKiller = (gMyRole === 'killer');
  if (wasKiller) {
    var confirmed = confirm('Ты уверен что хочешь выйти? Все выжившие будут исключены из лобби!');
    if (!confirmed) return;
    if (gRoomId) db.ref('rooms/' + gRoomId).remove().catch(function() {});
    showToast('Лобби закрыто');
  } else {
    if (gRoomId) db.ref('rooms/' + gRoomId + '/players/' + gMyId).remove().catch(function() {});
  }

  unsubscribeFromLobby();
  gRoomId = null;
  gIsHost = false;
  gMyRole = null;
  showScreen('main-menu');
  if (!wasKiller) showToast('Вышли из лобби');
};

/* ═══════ SOLO GAME ═══════ */
function startSoloGame(killerMode) {
  console.log('startSoloGame called, killerMode:', killerMode);
  try {
    if (typeof Game !== 'undefined' && Game.start) {
      Game.start(killerMode, false, null, null);
    } else {
      console.error('Game or Game.start not found!');
    }
  } catch (e) {
    console.error('Error starting game:', e);
    alert('Ошибка запуска игры: ' + e.message);
  }
}

/* ═══════ BUTTON SETUP ═══════ */
function setupButtons() {
  function on(id, fn) {
    var el = document.getElementById(id);
    if (el) el.onclick = fn;
  }
  
  // Multiplayer buttons
  on('btn-multiplayer', function() {
    gameMode = 'multiplayer';
    showScreen('role-select');
  });
  
  // Solo button
  on('btn-solo', function() {
    gameMode = 'solo';
    showScreen('role-select');
  });
  
  // Role selection
  on('btn-play-killer', function() {
    if (gameMode === 'solo') {
      startSoloGame(true);
    } else {
      createLobby();
    }
  });
  
  on('btn-play-survivor', function() {
    if (gameMode === 'solo') {
      startSoloGame(false);
    } else {
      findAndJoinLobby();
    }
  });
  
  on('btn-back-menu', function() {
    if (typeof Game !== 'undefined') Game.stop();
    gameMode = null;
    showScreen('loading-screen');
    var menuBtns = document.getElementById('menu-buttons');
    if (menuBtns) menuBtns.style.display = 'flex';
  });
  
  on('btn-start-game', function() {
    if (!gRoomId || !gIsHost) return;
    showToast('Начинаем игру...');
    startGame(gRoomId).then(function(result) {
      if (result.success) {
        showToast('Игра начинается...');
        var isKiller = (gMyRole === 'killer');
        if (typeof Game !== 'undefined') {
          Game.start(isKiller, true, gRoomId, gMyId);
        }
      } else {
        showToast('Ошибка: ' + result.error);
      }
    }).catch(function(e) {
      console.error('[FB] Start game error:', e);
      showToast('Ошибка запуска игры: ' + e.message);
    });
  });
  
  on('btn-leave-lobby', window.leaveLobby);
  on('btn-leave-search', function() {
    if (window._roomsQuery) window._roomsQuery.off();
    showScreen('loading-screen');
    var menuBtns = document.getElementById('menu-buttons');
    if (menuBtns) menuBtns.style.display = 'flex';
  });
}

  if (!isFirebaseReady() || !db) return;
  var generators = {};
  for (var i = 0; i < CONFIG.GENERATOR_COUNT; i++) {
    generators[i] = { id: i, progress: 0, repaired: false, repairingBy: null, lastUpdate: Date.now() };
  }
  db.ref('gameSessions/' + roomCode).child('generators').set(generators).catch(function() {});
}

function updateCrows(roomCode, crows) {
  if (!isFirebaseReady() || !db) return;
  var crowsData = {};
  crows.forEach(function(crow, i) {
    crowsData[i] = {
      state: crow.state, x: crow.sprite.x, y: crow.sprite.y,
      targetX: crow.targetX, targetY: crow.targetY, flipX: crow.sprite.flipX,
      landingX: crow.landingSpot ? crow.landingSpot.x : null,
      landingY: crow.landingSpot ? crow.landingSpot.y : null
    };
  });
  db.ref('gameSessions/' + roomCode).child('crows').set(crowsData).catch(function() {});
}

// Wait for Phaser + game.js, then show menu
var _initTries = 0;
function tryInit() {
  if (typeof Phaser !== 'undefined' && typeof Phaser.Game !== 'undefined') {
    initUser(function(user) {
      setProgress(5, 'Готово!');
      setTimeout(function() {
        // Hide loading bar and status, show menu buttons
        var loadBarWrap = document.querySelector('.loader-bar-wrap');
        var loadStatusEl = document.getElementById('load-status');
        var loadTipEl = document.getElementById('load-tip');
        if (loadBarWrap) loadBarWrap.style.display = 'none';

        var menuBtns = document.getElementById('menu-buttons');
        if (menuBtns) menuBtns.style.display = 'flex';
        
        setupButtons();
        console.log('App ready. User:', user, 'Low-end device:', isLowEndDevice);
      }, 300);
    });
    return;

    setTimeout(tryInit, 100);
  } else {

  }
}
