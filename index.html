        <div id="game-over" class="screen"><h2 id="game-result-title">Победа!</h2><p id="game-result-message"></p><button id="btn-back-menu" class="btn primary">В меню</button></div>
        <div id="browser-warning" class="screen"><h2>Доступно только в Telegram</h2><p>Эта игра работает только в Telegram Web Apps</p><p>Откройте игру через бота @YourBotName</p></div>

    <div id="toast"></div>

    <script>
    (function(){
        var UI = { 
            showScreen: function(n){
                var s = ['loading-screen', 'main-menu', 'role-select', 'lobby-create', 'lobby-join', 'game-screen', 'game-over', 'browser-warning'];
                s.forEach(function(x){
                    var el = document.getElementById(x);
                    if(el) el.classList.remove('active');
                });
                var target = document.getElementById(n);
                if(target) target.classList.add('active');
            }, 
            showToast: function(m){var t=document.getElementById('toast');if(t){t.textContent=m;t.classList.remove('show');void t.offsetWidth;t.classList.add('show');}},
            showGameOver: function(won){var title=document.getElementById('game-result-title');var msg=document.getElementById('game-result-message');if(title)title.textContent=won?'ПОБЕДА!':'ПОРАЖЕНИЕ';if(msg)msg.textContent=won?'Ты сбежал!':isKiller?'Ты поймал всех!':'Тебя поймали!';UI.showScreen('game-over');}
        };
        var CONFIG = Object.freeze({ 
            PLAYER_SPEED: 155, 
            KILLER_SPEED: 170, 
            INJURED_SPEED: 185,
            DYING_SPEED: 30,
            GENERATOR_COUNT: 5, 
            CATCH_DISTANCE: 50, 
            CATCH_COOLDOWN: 1.5,
            HIT_DISTANCE: 55,
            STUN_TIME: 1.5,
            HOOK_TIME: 60,
            HEAL_TIME: 15,
            GATE_OPEN_TIME: 20,
            HATCH_APPEAR_CHANCE: 0.3
        });
        
        var CONSTANTS = Object.freeze({
            MAP_WIDTH: 1200,
            MAP_HEIGHT: 900,
            MAX_VIOLATIONS: 5,
            ACTION_COOLDOWN: 500,
            MAX_SPEED_MULTIPLIER: 2
        });
        var game = null, player = null, generators = [], isKiller = false, exitOpen = false, survivorsLeft = 4, catchCooldown = 0;
        var killerStunned = 0;
        var survivorSpeedBoost = 0;
        
        var AntiCheat = {
            lastPosition: {x: 0, y: 0},
            lastTimestamp: 0,
            violations: 0,
            lastActionTime: {},
            actionCooldowns: {hit: 0, heal: 0, hook: 0, sabo: 0, gate: 0},
            maxViolations: 5,
            
            reset: function(){
                this.lastPosition = {x: 0, y: 0};
                this.lastTimestamp = 0;
                this.violations = 0;
                this.lastActionTime = {};
                this.actionCooldowns = {hit: 0, heal: 0, hook: 0, sabo: 0, gate: 0};
            },
            
            checkConfigIntegrity: function(){
                if(CONFIG.PLAYER_SPEED !== 155 || CONFIG.KILLER_SPEED !== 170 || CONFIG.INJURED_SPEED !== 185){
                    this.violations += 10;
                    this.logViolation('CONFIG_MODIFIED', {});
                    return false;
                }
                return true;
            },
            
            validatePosition: function(x, y, scene){
                if(x < -100 || x > 1300 || y < -100 || y > 1000){
                    this.violations++;
                    this.logViolation('OUT_OF_BOUNDS', {x: x, y: y});
                    return false;
                }
                return true;
            },
            
            validateSpeed: function(oldX, oldY, newX, newY, dt){
                if(this.lastTimestamp > 0){
                    var dist = Math.sqrt(Math.pow(newX - oldX, 2) + Math.pow(newY - oldY, 2));
                    var time = dt / 1000;
                    var speed = dist / time;
                    var maxSpeed = isKiller ? CONFIG.KILLER_SPEED * 2 : CONFIG.PLAYER_SPEED * 2;
                    
                    if(speed > maxSpeed && time > 0.01){
                        this.violations++;
                        this.logViolation('SPEED_HACK', {speed: Math.round(speed), max: maxSpeed});
                        return false;
                    }
                }
                this.lastPosition = {x: newX, y: newY};
                this.lastTimestamp = Date.now();
                return true;
            },
            
            validateAction: function(actionType){
                var now = Date.now();
                var minInterval = 500;
                
                if(this.lastActionTime[actionType]){
                    if(now - this.lastActionTime[actionType] < minInterval){
                        this.violations++;
                        this.logViolation('ACTION_FLOOD', {action: actionType});
                        return false;
                    }
                }
                this.lastActionTime[actionType] = now;
                return true;
            },
            
            validateGeneratorProgress: function(progress){
                if(progress < 0 || progress > 100){
                    this.violations++;
                    this.logViolation('INVALID_GEN_PROGRESS', {progress: progress});
                    return false;
                }
                return true;
            },
            
            logViolation: function(type, data){
                console.warn('[ANTICHEAT] ' + type, data);
                if(this.violations >= this.maxViolations){
                    this.banPlayer(type);
                }
            },
            
            banPlayer: function(reason){
                UI.showToast('Обнаружена подозрительная активность!');
                console.error('[ANTICHEAT] Player banned for:', reason);
                stopGame();
                UI.showScreen('main-menu');
            }
        };
        
        var GameState = {
            roomId: null,
            isHost: false,
            
            syncToServer: function(state){
                if(!this.roomId || !window.db) return;
                window.db.collection('rooms').doc(this.roomId).collection('gameState').doc('current').set(state, {merge: true}).catch(function(e){ console.error('Sync error:', e); });
            },
            
            validateAction: function(action, data){
                if(!this.roomId || !window.db) return true;
                return true;
            }
        };

        function startGame(km){ 
            isKiller = km; 
            exitOpen = false; 
            survivorsLeft = 4; 
            catchCooldown = 0; 
            generators = []; 
            AntiCheat.reset();
            
            var gameScreen = document.getElementById('game-screen');
            var gameContainer = document.getElementById('game-container');
            if(gameScreen) gameScreen.style.display = 'block';
            if(gameContainer) {
                gameContainer.style.display = 'block';
                gameContainer.style.visibility = 'visible';
                gameContainer.style.opacity = '1';
            }
            
            UI.showScreen('game-screen'); 
            UI.showToast(isKiller ? 'Поймай всех!' : 'Найди генераторы!'); 
            initGame(); 
        }

        function stopGame(){ 
            if(game){ 
                game.destroy(true); 
                game = null; 
                player = null; 
            } 
            var existingJoystick = document.querySelector('[data-joystick]');
            var existingActionBtn = document.querySelector('[data-action-btn]');
            if(existingJoystick) existingJoystick.remove();
            if(existingActionBtn) existingActionBtn.remove();
        }

        function initGame(){ 
            if(game){
                game.destroy(true);
                game = null;
            }
            var container = document.getElementById('game-container');
            if(container){
                container.innerHTML = '';
                container.style.display = 'block';
                container.style.visibility = 'visible';
                container.style.opacity = '1';
                container.style.backgroundColor = '#1a1a1a';
            }
            console.log('Initializing game, isKiller:', isKiller);
            console.log('Window size:', window.innerWidth, 'x', window.innerHeight);
            console.log('Device pixel ratio:', window.devicePixelRatio);
            var renderer = Phaser.AUTO;
            try {
                var testCanvas = document.createElement('canvas');
                var gl = testCanvas.getContext('webgl') || testCanvas.getContext('experimental-webgl');
                if(!gl) {
                    renderer = Phaser.CANVAS;
                    console.log('WebGL not supported, using Canvas renderer');
                }
            } catch(e) {
                renderer = Phaser.CANVAS;
                console.log('WebGL check failed, using Canvas renderer');
            }
            
            game = new Phaser.Game({
                type: renderer,
                parent: 'game-container', 
                width: window.innerWidth || window.screen.width, 
                height: window.innerHeight || window.screen.height, 
                backgroundColor: '#1a1a1a',
                render: { pixelArt: false, antialias: true, clearBeforeRender: true },
                physics: { default: 'arcade', arcade: { gravity: { y: 0 }, debug: false } }, 
                scene: { preload: preload, create: create, update: update },
                scale: {
                    mode: Phaser.Scale.RESIZE,
                    autoCenter: Phaser.Scale.CENTER_BOTH,
                    width: window.innerWidth || window.screen.width,
                    height: window.innerHeight || window.screen.height
                }
            });
            
            game.events.on('ready', function() {
                console.log('Phaser game ready');
            });
            
            game.events.on('error', function(err) {
                console.error('Phaser game error:', err);
                UI.showToast('Ошибка игры: ' + err.message);
            });
            
            setTimeout(function() {
                var container = document.getElementById('game-container');
                var canvas = container ? container.querySelector('canvas') : null;
                if(!canvas) {
                    console.error('Canvas not created!');
                    UI.showToast('Ошибка: канва не создана');
                    container.innerHTML = '<div style="width:100%;height:100%;background:#1a1a1a;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;">Ошибка загрузки игры</div>';
                } else {
                    console.log('Canvas size:', canvas.width, 'x', canvas.height);
                    canvas.style.backgroundColor = '#1a1a1a';
                }
            }, 3000);
        }

        function create(){
            var mw = 1200, mh = 900;
            for(var x = 0; x < mw; x += 32){
                for(var y = 0; y < mh; y += 32){
                    var t = this.add.image(x + 16, y + 16, 'ground');
                    t.setAlpha(0.5 + Math.random() * 0.5);
                }
            }
            
            var colliders = [];
            var solidColliders = [];
            
            var borderFences = [];
            for(var x = 30; x < mw; x += 50){
                borderFences.push({x: x, y: 30});
                borderFences.push({x: x, y: mh - 30});
            }
            for(var y = 30; y < mh; y += 50){
                borderFences.push({x: 30, y: y});
                borderFences.push({x: mw - 30, y: y});
            }
            borderFences.forEach(function(p){
                var f = this.add.image(p.x, p.y, 'fence');
                f.setDepth(p.y);
                f.body = { immovable: true };
                solidColliders.push(f);
            }, this);
            
            var trees = [
                {x:80,y:80},{x:180,y:100},{x:1100,y:60},{x:1050,y:140},
                {x:60,y:820},{x:140,y:860},{x:1100,y:800},{x:1050,y:860},
                {x:600,y:60},{x:320,y:320},{x:920,y:320},{x:320,y:620},{x:920,y:620},
                {x:200,y:450},{x:1000,y:450},{x:450,y:200},{x:750,y:200}
            ];
            trees.forEach(function(p){
                var t = this.add.image(p.x, p.y, 'tree');
                t.setDepth(p.y);
                colliders.push(t);
            }, this);
            
            var rocks = [
                {x:250,y:180},{x:450,y:150},{x:850,y:180},{x:250,y:700},
                {x:950,y:500},{x:600,y:720},{x:400,y:450},{x:800,y:450}
            ];
            rocks.forEach(function(p){
                var r = this.add.image(p.x, p.y, 'rock');
                r.setDepth(p.y);
                r.body = { immovable: true };
                solidColliders.push(r);
            }, this);
            
            var bushes = [
                {x:180,y:280},{x:380,y:180},{x:780,y:220},{x:180,y:680},
                {x:1020,y:420},{x:580,y:680},{x:450,y:350},{x:750,y:550}
            ];
            bushes.forEach(function(p){

            var fences = [
                {x:280,y:120},{x:920,y:320},{x:120,y:480},{x:1080,y:620}
            ];
            fences.forEach(function(f){
                var fe = this.add.image(f.x, f.y, 'wall');
                fe.setDepth(f.y);

            var crates = [

            var group = this.physics.add.group();

                obj.body.setImmovable(true);
                obj.body.setCollideWorldBounds(false);
                group.add(obj);
            }, this);
            group.setImmovable(true);
            
            this.physics.add.collider(player, group);
            
            var genPos = [
                {x:120,y:120},{x:1080,y:120},{x:600,y:450},
                {x:120,y:780},{x:1080,y:780}
            ];
            genPos.forEach(function(p){
                var gen = this.add.sprite(p.x, p.y, 'generator');
                gen.progress = 0;
                gen.repaired = false;
                gen.beingRepaired = false;
                gen.damageProgress = 0;
                var bar = this.add.graphics();
                bar.x = p.x - 20;
                bar.y = p.y - 20;
                gen.bar = bar;
                var light = this.add.circle(p.x + 15, p.y - 12, 5, 0x00ff00);
                light.setAlpha(0);
                light.setDepth(p.y + 1);
                gen.light = light;
                this.physics.add.existing(gen);
                gen.body.setImmovable(true);
                gen.body.setCollideWorldBounds(false);
                generators.push(gen);
            }, this);
            
            var gatePositions = [
                {x:60,y:450},{x:1140,y:450}
            ];
            this.gates = [];
            gatePositions.forEach(function(gp){
                var gate = this.add.sprite(gp.x, gp.y, 'gate');
                gate.progress = 0;

                gate.bar = null;
                this.physics.add.existing(gate);
                gate.body.setImmovable(true);
                gate.body.setCollideWorldBounds(false);
                this.gates.push(gate);

            this.exit = this.add.sprite(600, 450, 'exit');

            this.exit.setVisible(false);
            
            var hookPositions = [
                {x:300,y:200},{x:900,y:200},{x:300,y:700},{x:900,y:700},{x:600,y:450}
            ];
            this.hooks = [];
            hookPositions.forEach(function(hp){
                var hook = this.add.sprite(hp.x, hp.y, 'hook');
                hook.setTint(0x888888);
                hook.setScale(1.2);
                hook.occupied = false;
                hook.hookedPlayer = null;
                hook.hookTimer = 0;
                this.hooks.push(hook);
            }, this);
            
            this.hatch = null;
            
            this.physics.add.collider(player, group);
            
            var killerSpawn = {x:600, y:450};
            var survivorSpawns = [
                {x:100,y:100},{x:1100,y:100},{x:100,y:800},{x:1100,y:800}
            ];
            
            player = isKiller ? this.add.sprite(killerSpawn.x, killerSpawn.y, 'killer_m') : this.add.sprite(survivorSpawns[0].x, survivorSpawns[0].y, 'survivor1');
            player.health = 100;
            player.injured = false;
            player.dying = false;
            player.hooked = false;
            player.carriedBy = null;
            this.physics.add.existing(player);
            player.body.setCollideWorldBounds(false);
            player.setDepth(1000);
            
            if(isKiller){
                this.survivors = [];

                    {x:survivorSpawns[1].x,y:survivorSpawns[1].y},
                    {x:survivorSpawns[2].x,y:survivorSpawns[2].y},

                ];

                    s.injured = false;
                    s.dying = false;
                    s.hooked = false;
                    s.carriedBy = null;

                    this.physics.add.existing(s);
                    s.body.setCollideWorldBounds(false);
                    s.setDepth(p.y);
                    this.physics.add.collider(s, group);
                    this.survivors.push(s);

        function update(time, dt){
            if(!player) return;
            
            if(!AntiCheat.checkConfigIntegrity()){
                return;
            }
            
            var vec = getInputVector();
            var spd = CONFIG.PLAYER_SPEED;
            
            if(isKiller){
                if(killerStunned > 0){
                    killerStunned -= dt / 1000;
                    player.body.setVelocity(0, 0);
                } else {
                    spd = CONFIG.KILLER_SPEED;
                    player.body.setVelocity(vec.x * spd, vec.y * spd);
                }
            } else {
                if(survivorSpeedBoost > 0){
                    survivorSpeedBoost -= dt / 1000;
                    spd = CONFIG.INJURED_SPEED;
                }
                if(player.injured) spd = CONFIG.INJURED_SPEED;
                if(player.dying) spd = CONFIG.DYING_SPEED;
                if(player.hooked) spd = 0;
                
                if(spd > 0){
                    player.body.setVelocity(vec.x * spd, vec.y * spd);
                }
            }
            
            if(player && player.x && player.y){
                if(!AntiCheat.validatePosition(player.x, player.y, this)){
                    player.body.setVelocity(0, 0);
                    player.x = 600;
                    player.y = 450;
                }
                if(!AntiCheat.validateSpeed(AntiCheat.lastPosition.x, AntiCheat.lastPosition.y, player.x, player.y, dt)){
                    player.body.setVelocity(0, 0);
                }
            }
            
            if(isKiller && isActionPressed() && killerStunned <= 0){
                if(!AntiCheat.validateAction('hit')){
                    return;
                }
                this.survivors.forEach(function(s){
                    if(s.alive && !s.hooked){
                        var d = Phaser.Math.Distance.Between(player.x, player.y, s.x, s.y);
                        if(d < CONFIG.HIT_DISTANCE){
                            if(s.injured){
                                s.dying = true;
                                s.setTint(0x666666);
                                UI.showToast('Выживший сбит с ног!');
                            } else {
                                s.injured = true;
                                s.setTint(0xff6666);
                                survivorSpeedBoost = 2;
                                killerStunned = CONFIG.STUN_TIME;
                                UI.showToast('Выживший ранен! +Ускорение');
                            }
                        }
                    } else if(s.dying && !s.hooked && !s.carriedBy){
                        var d = Phaser.Math.Distance.Between(player.x, player.y, s.x, s.y);
                        if(d < CONFIG.HIT_DISTANCE && Math.abs(vec.x) < 0.3 && Math.abs(vec.y) < 0.3){
                            var hook = this.hooks.find(function(h){ return !h.occupied; });
                            if(hook){
                                s.carriedBy = player;
                                s.x = player.x;
                                s.y = player.y - 30;
                            }
                        }
                    }
                }, this);
                
                generators.forEach(function(gen){
                    var d = Phaser.Math.Distance.Between(player.x, player.y, gen.x, gen.y);
                    if(d < 50 && gen.progress > 0){
                        gen.progress = Math.max(0, gen.progress - dt / 50);
                        gen.bar.clear();
                        gen.bar.fillStyle(0x000000, 0.7);
                        gen.bar.fillRect(-20, -20, 40, 6);
                        gen.bar.fillStyle(0xff0000);
                        gen.bar.fillRect(-19, -19, 38 * (gen.progress / 100), 4);
                        if(gen.progress <= 0){
                            gen.setTint(0x444444);
                            UI.showToast('Генератор сломан!');
                        }
                    }
                });
                
                if(this.gates){
                    this.gates.forEach(function(gate){
                        var d = Phaser.Math.Distance.Between(player.x, player.y, gate.x, gate.y);
                        if(d < 50 && !gate.opened){
                            if(AntiCheat.validateAction('gate')){
                                gate.progress += dt / 100;
                            }
                            if(!AntiCheat.validateGeneratorProgress(gate.progress)){
                                gate.progress = Math.max(0, Math.min(100, gate.progress));
                            }
                            if(!gate.bar) gate.bar = this.add.graphics();
                            gate.bar.clear();
                            gate.bar.fillStyle(0x000000, 0.7);
                            gate.bar.fillRect(-20, -30, 40, 6);
                            gate.bar.fillStyle(0xff0000);
                            gate.bar.fillRect(-19, -29, 38 * (gate.progress / 100), 4);
                            if(gate.progress >= 100){
                                gate.opened = true;
                                gate.setTint(0x00ff00);
                                UI.showToast('Ворота открыты!');
                            }
                        }
                    }, this);
                }
                
                if(this.hatch){
                    var d = Phaser.Math.Distance.Between(player.x, player.y, this.hatch.x, this.hatch.y);
                    if(d < 40 && this.hatch.active){
                        this.hatch.destroy();
                        this.hatch = null;
                        UI.showToast('Люк закрыт!');
                    }
                }
            }
            
            if(isKiller && player.carriedSurvivor){
                player.carriedSurvivor.x = player.x;
                player.carriedSurvivor.y = player.y - 30;
                var hook = this.hooks.find(function(h){ return !h.occupied; });
                if(hook && isActionPressed()){
                    player.carriedSurvivor.hooked = true;
                    player.carriedSurvivor.x = hook.x;
                    player.carriedSurvivor.y = hook.y;
                    hook.occupied = true;
                    hook.hookedPlayer = player.carriedSurvivor;
                    hook.hookTimer = CONFIG.HOOK_TIME;
                    player.carriedSurvivor = null;
                    UI.showToast('Выживший повешен!');
                    survivorsLeft--;
                }
            }
            
            if(isKiller && killerStunned <= 0){
                this.survivors.forEach(function(s){
                    if(s.alive && !s.hooked){
                        if(Math.random() < 0.02){
                            s.body.setVelocity((Math.random() - 0.5) * 60, (Math.random() - 0.5) * 60);
                        }
                        var d = Phaser.Math.Distance.Between(s.x, s.y, player.x, player.y);
                        if(d < 150){
                            var a = Phaser.Math.Angle.Between(s.x, s.y, player.x, player.y);
                            var runSpd = s.injured ? CONFIG.INJURED_SPEED : CONFIG.PLAYER_SPEED;
                            s.body.setVelocity(Math.cos(a) * runSpd, Math.sin(a) * runSpd);
                        }
                    } else if(s.dying && !s.hooked && !s.carriedBy && !isActionPressed()){
                        s.body.setVelocity(0, 0);
                    }
                });
            }
            
            if(!isKiller && !player.dying && !player.hooked){
                var nearGenerator = false;
                if(isActionPressed()){
                    generators.forEach(function(gen){
                        if(!gen.repaired){
                            var d = Phaser.Math.Distance.Between(player.x, player.y, gen.x, gen.y);
                            if(d < 50){
                                nearGenerator = true;
                                if(!AntiCheat.validateAction('repair')){
                                    gen.progress += 0;
                                } else {
                                    gen.progress += dt / 100;
                                }
                                if(!AntiCheat.validateGeneratorProgress(gen.progress)){
                                    gen.progress = Math.max(0, Math.min(100, gen.progress));
                                }
                                gen.bar.clear();
                                gen.bar.fillStyle(0x000000, 0.7);
                                gen.bar.fillRect(-20, -20, 40, 6);
                                gen.bar.fillStyle(0xffff00);
                                gen.bar.fillRect(-19, -19, 38 * (gen.progress / 100), 4);
                                if(gen.progress >= 100){
                                    gen.repaired = true;
                                    gen.light.setAlpha(1);
                                    gen.setTint(0x00ff00);
                                    UI.showToast('Генератор починен!');
                                }
                            }
                        }
                    });
                    
                    if(this.hatch && !player.injured && !player.dying){
                        var d = Phaser.Math.Distance.Between(player.x, player.y, this.hatch.x, this.hatch.y);
                        if(d < 40){
                            UI.showGameOver(true);
                            stopGame();
                            return;
                        }
                    }
                }
                
                if(nearGenerator){
                    player.body.setVelocity(0, 0);
                }
                
                this.survivors.forEach(function(s){
                    if(s && s.hooked && s.hookTimer > 0){
                        s.hookTimer -= dt / 1000;
                        if(s.hookTimer <= 0){
                            UI.showGameOver(false);
                            stopGame();
                        }
                    }
                }, this);
                
                var rep = generators.filter(function(g){ return g.repaired; }).length;
                if(rep >= CONFIG.GENERATOR_COUNT && !exitOpen && !this.hatch){
                    if(Math.random() < CONFIG.HATCH_APPEAR_CHANCE){
                        var hx = 100 + Math.random() * 1000;
                        var hy = 100 + Math.random() * 700;
                        this.hatch = this.add.sprite(hx, hy, 'hatch');
                        this.hatch.setTint(0xffaa00);
                        this.hatch.active = true;
                        UI.showToast('Появился ЛЮК!');
                    }
                    exitOpen = true;
                    this.exit.setTint(0x00ff00);
                    this.exit.setVisible(true);
                    UI.showToast('ВЫХОД ОТКРЫТ!');
                }
            }
            
            if(killerStunned > 0) killerStunned -= dt / 1000;
            if(survivorSpeedBoost > 0) survivorSpeedBoost -= dt / 1000;
            
            if(isKiller && this.survivors){
                var allHooked = this.survivors.every(function(s){ return s.hooked; });
                if(allHooked && this.survivors.length > 0){
                    UI.showGameOver(false);
                    stopGame();
                    return;
                }
            }
            
            player.setDepth(player.y + 1000);
            
            var rep = generators.filter(function(g){ return g.repaired; }).length;
            var roleEl = document.getElementById('player-role');
            var genEl = document.getElementById('gen-count');
            var exitEl = document.getElementById('exit-state');
            var aliveEl = document.getElementById('alive-count');
            
            if(roleEl) roleEl.textContent = isKiller ? 'Убийца' : (player.injured ? 'Ранен' : (player.dying ? 'Падает' : 'Выживший'));
            if(genEl) genEl.textContent = rep + '/5';
            if(exitEl) exitEl.textContent = exitOpen ? 'открыт' : 'закрыт';
            if(aliveEl) aliveEl.textContent = 'Выжившие: ' + survivorsLeft;
            
            if(this.fogParticles){
                this.fogParticles.forEach(function(fog){
                    fog.x += fog.speedX * (dt / 100);
                    fog.y += fog.speedY * (dt / 100);
                    if(fog.x < -50) fog.x = 1250;
                    if(fog.x > 1250) fog.x = -50;
                    if(fog.y < -50) fog.y = 950;
                    if(fog.y > 950) fog.y = -50;
                });
            }
            
            if(!this.serverSyncTimer) this.serverSyncTimer = 0;
            this.serverSyncTimer += dt;
            if(this.serverSyncTimer > 1000 && GameState.roomId){
                this.serverSyncTimer = 0;
                var state = {
                    playerId: window.userId || 'guest',
                    role: isKiller ? 'killer' : 'survivor',
                    x: player ? Math.round(player.x) : 0,
                    y: player ? Math.round(player.y) : 0,
                    generatorsRepaired: rep,
                    exitOpen: exitOpen,
                    survivorsLeft: survivorsLeft,
                    timestamp: Date.now()
                };
                GameState.syncToServer(state);
            }
        }

            document.getElementById('game-result-message').textContent = won ? 'Ты сбежал!' : isKiller ? 'Ты поймал всех!' : 'Тебя поймали!';

        function initInput(scene){
            var joystick = document.createElement('div');
            joystick.setAttribute('data-joystick', 'true');
            joystick.style.cssText = 'position:fixed;bottom:30px;left:30px;width:110px;height:110px;z-index:200;touch-action:none;';
            joystick.innerHTML = '<div style="width:100%;height:100%;background:rgba(255,255,255,0.15);border:3px solid rgba(255,255,255,0.4);border-radius:50%;position:relative;"><div style="width:45px;height:45px;background:rgba(255,50,50,0.9);border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)"></div></div>';
            document.body.appendChild(joystick);
            
            var actionBtn = document.createElement('div');
            actionBtn.setAttribute('data-action-btn', 'true');
            actionBtn.textContent = 'ДЕЙСТВИЕ';
            actionBtn.style.cssText = 'position:fixed;bottom:50px;right:30px;width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#ff6600,#ff3300);border:3px solid rgba(255,255,255,0.5);color:#fff;font-size:11px;font-weight:bold;display:flex;align-items:center;justify-content:center;z-index:200;touch-action:none;';
            document.body.appendChild(actionBtn);
            
            var joystickInner = joystick.firstChild;
            var knob = joystickInner.firstChild;
            var touching = false;
            var maxDist = 45;
            var joystickId = null;
            
            function updateJoystick(clientX, clientY){
                var rect = joystickInner.getBoundingClientRect();
                var dx = clientX - (rect.left + rect.width / 2);
                var dy = clientY - (rect.top + rect.height / 2);
                var dist = Math.min(Math.sqrt(dx * dx + dy * dy), maxDist);
                var angle = Math.atan2(dy, dx);
                var normX = dist / maxDist * Math.cos(angle);
                var normY = dist / maxDist * Math.sin(angle);
                knob.style.transform = 'translate(calc(-50% + ' + (normX * maxDist) + 'px), calc(-50% + ' + (normY * maxDist) + 'px))';
                inputVector.x = normX;
                inputVector.y = normY;
            }
            
            joystick.addEventListener('touchstart', function(e){
                e.preventDefault();
                e.stopPropagation();
                touching = true;
                joystickId = e.changedTouches[0].identifier;
                updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
            }, {passive: false});
            
            joystick.addEventListener('touchmove', function(e){
                e.preventDefault();
                e.stopPropagation();
                if(touching){
                    for(var i = 0; i < e.changedTouches.length; i++){
                        if(e.changedTouches[i].identifier === joystickId){
                            updateJoystick(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
                            break;
                        }
                    }
                }
            }, {passive: false});
            
            joystick.addEventListener('touchend', function(e){
                e.preventDefault();
                e.stopPropagation();
                touching = false;
                joystickId = null;
                inputVector.x = 0;
                inputVector.y = 0;
                knob.style.transform = 'translate(-50%,-50%)';
            });
            
            joystick.addEventListener('touchcancel', function(){
                touching = false;
                joystickId = null;
                inputVector.x = 0;
                inputVector.y = 0;
                knob.style.transform = 'translate(-50%,-50%)';
            });
            
            actionBtn.addEventListener('touchstart', function(e){
                e.preventDefault();
                e.stopPropagation();
                actionPressed = true;
                actionBtn.style.transform = 'scale(0.95)';
            }, {passive: false});
            
            actionBtn.addEventListener('touchend', function(e){
                e.preventDefault();
                e.stopPropagation();
                actionPressed = false;
                actionBtn.style.transform = 'scale(1)';
            });
            
            actionBtn.addEventListener('touchcancel', function(){
                actionPressed = false;
                actionBtn.style.transform = 'scale(1)';
            });
        }

        }
        
        function getSavedRoomState(){
            var roomId = localStorage.getItem('roomId');
            var host = localStorage.getItem('isHost') === 'true';
            return roomId ? {roomId: roomId, isHost: host} : null;
        }
        
        function getTelegramId(){
            try{
                if(Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user){
                    return 'tg_' + Telegram.WebApp.initDataUnsafe.user.id;
                }
            } catch(e){}
            var saved = localStorage.getItem('userId');
            if(saved) return saved;
            var newId = 'guest_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            localStorage.setItem('userId', newId);
            return newId;
        }
        
        function isTelegram(){
            try{
                return !!(Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user);
            } catch(e){}
            return false;
        }
        
        function initUserData(){
            if(!isTelegram()) return;
            if(localStorage.getItem('userInitialized') === 'true') return;
            if(!window.firebaseLoaded) return;
            
            var userId = getTelegramId();
            var userName = 'Игрок';
            var avatarUrl = '';
            var isTG = isTelegram();
            
            if(isTG){
                try{
                    var u = Telegram.WebApp.initDataUnsafe.user;
                    userName = u.first_name || u.username || 'Игрок';
                    avatarUrl = u.photo_url || '';
                } catch(e){}
            }
            
            window.db.collection('users').doc(userId).get().then(function(doc){
                if(doc.exists){
                    localStorage.setItem('userInitialized', 'true');
                    window.db.collection('users').doc(userId).update({
                        lastSeen: Date.now(),
                        lastRoom: localStorage.getItem('roomId') || null
                    });
                } else {
                    localStorage.setItem('userInitialized', 'true');
                    window.db.collection('users').doc(userId).set({
                        id: userId,
                        name: userName,
                        avatar: avatarUrl,
                        isTelegram: isTG,
                        createdAt: Date.now(),
                        lastSeen: Date.now(),
                        gamesPlayed: 0,
                        gamesWon: 0,
                        gamesLost: 0
                    });
                }
            }).catch(function(err){
                console.log('User init error:', err);
            });
        }
        
        tryInit();
        setTimeout(initUserData, 1000);
         
        var currentPlayerId = getTelegramId();
        var currentRoomId = null;
        var isHost = false;
        var roomUnsubscribe = null;
        var lobbyData = null;
        var currentGameState = null;
        
        function saveGameState(state){
            localStorage.setItem('gameState', JSON.stringify(state));
        }
        
        function getSavedGameState(){
            var saved = localStorage.getItem('gameState');
            return saved ? JSON.parse(saved) : null;
        }
        
        function restoreRoomOrGame(){
            var savedGame = getSavedGameState();
            if(savedGame && savedGame.status === 'playing' && window.firebaseLoaded){
                window.db.collection('rooms').doc(savedGame.roomId).get().then(function(doc){
                    if(doc.exists){
                        var data = doc.data();
                        if(data.status === 'playing'){
                            currentRoomId = savedGame.roomId;
                            isHost = (savedGame.role === 'killer');
                            clearRoomState();
                            saveGameState({roomId: savedGame.roomId, status: 'playing', role: savedGame.role});
                            UI.showScreen('game-screen');
                            UI.showToast('Восстановление игры...');
                            setTimeout(function(){
                                initGame();
                            }, 100);
                            return;
                        }
                    }
                    restoreLobby();
                }).catch(function(){
                    restoreLobby();
                });
            } else {
                restoreLobby();
            }
        }
        
        function restoreLobby(){
            var saved = getSavedRoomState();
            if(saved && window.firebaseLoaded){
                currentRoomId = saved.roomId;
                isHost = saved.isHost;
                window.db.collection('rooms').doc(saved.roomId).get().then(function(doc){
                    if(doc.exists && doc.data().status === 'waiting'){
                        UI.showScreen('lobby-create');
                        if(isHost){
                            document.getElementById('lobby-status').textContent = 'Ожидание игроков...';
                            document.getElementById('lobby-players').innerHTML = '<div class="player-slot host">👹 Маньяк (Вы)</div>';
                            document.getElementById('btn-start-game').style.display = 'block';
                        } else {
                            document.getElementById('lobby-status').textContent = 'Подключено к лобби';
                            document.getElementById('lobby-players').innerHTML = '<div class="player-slot">Загрузка...</div>';
                            document.getElementById('btn-start-game').style.display = 'none';
                        }
                        listenToRoom(currentRoomId);
                        UI.showToast('Восстановлено подключение');
                    } else {
                        clearRoomState();
                    }
                }).catch(function(){
                    clearRoomState();
                });
            }
        }
        
        function createLobby(){
            if(!window.firebaseLoaded){
                UI.showToast('Firebase не загружена');
                return;
            }
            clearGameState();
            var code = 'room_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            currentRoomId = code;
            isHost = true;
            saveRoomState(code, true);
            document.getElementById('lobby-status').textContent = 'Создание лобби...';
            document.getElementById('lobby-players').innerHTML = '<div class="player-slot host">👹 Маньяк (Вы)</div>';
            UI.showScreen('lobby-create');
            UI.showToast('Создание лобби...');
            
            console.log('Creating room:', code);
            
            var hostName = 'Маньяк';
            try{
                if(Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user){
                    hostName = Telegram.WebApp.initDataUnsafe.user.first_name || 'Маньяк';
                }
            } catch(e){}
            
            window.db.collection('rooms').doc(code).set({
                code: code,
                hostId: currentPlayerId,
                hostName: hostName,
                status: 'waiting',
                createdAt: Date.now(),
                players: {}
            }).then(function(){
                var playersRef = window.db.collection('rooms').doc(code).collection('players').doc(currentPlayerId);
                return playersRef.set({
                    id: currentPlayerId,
                    name: hostName,
                    role: 'killer',
                    isHost: true,
                    joinedAt: Date.now()
                });
            }).then(function(){
                console.log('Room created:', code);
                UI.showToast('Лобби создано!');
                document.getElementById('lobby-status').textContent = 'Ожидание игроков...';
                listenToRoom(code);
            }).catch(function(err){
                console.error('Room create error:', err);
                document.getElementById('lobby-status').textContent = 'Ошибка: ' + err.message;
                UI.showToast('Ошибка: ' + err.message);
            });
        }
        
        function joinLobby(){
            if(!window.firebaseLoaded){
                UI.showToast('Firebase не загружена');
                return;
            }
            clearGameState();
            UI.showScreen('lobby-join');
            document.getElementById('search-status').textContent = 'Поиск лобби...';
            
            var survivorName = 'Выживший';
            try{
                if(Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user){
                    survivorName = Telegram.WebApp.initDataUnsafe.user.first_name || 'Выживший';
                }
            } catch(e){}
            
            var searchInterval = setInterval(function(){
                window.db.collection('rooms').get().then(function(snapshot){
                    var found = false;
                    var count = 0;
                    snapshot.forEach(function(doc){
                        var room = doc.data();
                        if(room.status !== 'waiting') return;
                        var players = room.players || {};
                        var pCount = Object.keys(players).length;
                        count++;
                        if(pCount < 4 && !found){
                            currentRoomId = doc.id;
                            isHost = false;
                            found = true;
                            players[currentPlayerId] = { id: currentPlayerId, role: 'survivor', joinedAt: Date.now() };
                            saveRoomState(doc.id, false);
                            window.db.collection('rooms').doc(currentRoomId).update({players: players}).then(function(){
                                return window.db.collection('rooms').doc(currentRoomId).collection('players').doc(currentPlayerId).set({
                                    id: currentPlayerId,
                                    name: survivorName,
                                    role: 'survivor',
                                    isHost: false,
                                    joinedAt: Date.now()
                                });
                            }).then(function(){
                                clearInterval(searchInterval);
                                UI.showScreen('lobby-create');
                                document.getElementById('lobby-status').textContent = 'Подключено к лобби';
                                document.getElementById('btn-start-game').style.display = 'none';
                                listenToRoom(currentRoomId);
                                UI.showToast('Подключился к лобби');
                            });
                        }
                    });
                    if(!found){
                        document.getElementById('search-status').textContent = 'Поиск лобби... (' + count + ' комнат)';
                    }
                }).catch(function(err){
                    document.getElementById('search-status').textContent = 'Ошибка: ' + err.message;
                    clearInterval(searchInterval);
                });
            }, 2000);
            
            document.getElementById('btn-leave-search').onclick = function(){
                clearInterval(searchInterval);
                UI.showScreen('main-menu');
            };
        }
        
        function listenToRoom(roomCode){
            roomUnsubscribe = window.db.collection('rooms').doc(roomCode).onSnapshot(function(doc){
                if(!doc.exists) return;
                var data = doc.data();
                lobbyData = data;
                var players = data.players || {};
                var playerList = document.getElementById('lobby-players');
                var html = '<div class="player-slot host">👹 Маньяк</div>';
                var count = 1;
                for(var pid in players){
                    if(pid !== data.hostId){
                        var playerName = players[pid].name || ('Выживший ' + count);
                        html += '<div class="player-slot">🏃 ' + playerName + '</div>';
                        count++;
                    }
                }
                for(var i = count; i <= 4; i++){
                    html += '<div class="player-slot empty">⏳ Ожидание...</div>';
                }
                playerList.innerHTML = html;
                var btnStart = document.getElementById('btn-start-game');
                if(isHost && count >= 2){
                    btnStart.disabled = false;
                    btnStart.textContent = 'Начать игру (' + count + '/4)';
                    btnStart.style.background = '#ff3333';
                } else if(isHost) {
                    btnStart.disabled = true;
                    btnStart.textContent = 'Начать (ждём игроков)';
                    btnStart.style.background = '#666';
                }
                if(data.status === 'playing'){
                    if(roomUnsubscribe) roomUnsubscribe();
                    saveGameState({roomId: roomCode, status: 'playing', role: isHost ? 'killer' : 'survivor'});
                    startMultiplayerGame(data);
                }
            }, function(err){
                console.error('Error listening to room:', err);
            });
        }
        
        function leaveLobby(){
            if(roomUnsubscribe){
                roomUnsubscribe();
                roomUnsubscribe = null;
            }
            if(currentRoomId){
                if(!isHost){
                    window.db.collection('rooms').doc(currentRoomId).get().then(function(doc){
                        if(doc.exists){
                            var data = doc.data();
                            var players = data.players || {};
                            delete players[currentPlayerId];
                            window.db.collection('rooms').doc(currentRoomId).update({players: players});
                        }
                    });
                } else {
                    window.db.collection('rooms').doc(currentRoomId).delete();
                }
            }
            clearRoomState();
            clearGameState();
            currentRoomId = null;
            isHost = false;
            lobbyData = null;
            UI.showScreen('main-menu');
        }
        
        function startGameAsHost(){
            if(!currentRoomId || !isHost) return;
            window.db.collection('rooms').doc(currentRoomId).update({status: 'playing'}).then(function(){
                UI.showToast('Игра началась!');
            });
        }
        
        function startMultiplayerGame(roomData){
            clearRoomState();
            isKiller = (currentPlayerId === roomData.hostId);
            saveGameState({roomId: currentRoomId, status: 'playing', role: isKiller ? 'killer' : 'survivor'});
            exitOpen = false;
            survivorsLeft = 4;
            catchCooldown = 0;
            generators = [];
            UI.showScreen('game-screen');
            UI.showToast(isKiller ? 'Поймай всех!' : 'Найди генераторы!');
            setTimeout(function(){
                initGame();
            }, 100);
        }
        
        function setupButtons(){
            var btnSolo = document.getElementById('btn-solo');
            var btnMulti = document.getElementById('btn-multi');
            var btnKiller = document.getElementById('btn-play-killer');
            var btnSurvivor = document.getElementById('btn-play-survivor');
            var btnBack = document.getElementById('btn-back-menu');
            var btnStartGame = document.getElementById('btn-start-game');
            var btnLeaveLobby = document.getElementById('btn-leave-lobby');
            var btnLeaveSearch = document.getElementById('btn-leave-search');
            
            if(btnSolo) btnSolo.onclick = function(){
                UI.showScreen('role-select');
            };
            
            if(btnMulti) btnMulti.onclick = function(){
                UI.showScreen('role-select');
            };
            
            if(btnKiller) btnKiller.onclick = function(){
                createLobby();
            };
            
            if(btnSurvivor) btnSurvivor.onclick = function(){
                joinLobby();
            };
            
            if(btnBack) btnBack.onclick = function(){
                stopGame();
                leaveLobby();
                UI.showScreen('main-menu');
            };
            
            if(btnStartGame) btnStartGame.onclick = function(){
                startGameAsHost();
            };
            
            if(btnLeaveLobby) btnLeaveLobby.onclick = function(){
                leaveLobby();
            };
            
            if(btnLeaveSearch) btnLeaveSearch.onclick = function(){
                UI.showScreen('main-menu');
            };
        }
        
        } // end of Telegram check
        
    })();
    </script>
</body>
</html>
