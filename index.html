<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Miasma Massacre</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <div id="loading-screen" class="screen active">
            <div class="loader"></div>
            <p>Загрузка...</p>
        </div>
        
        <div id="main-menu" class="screen">
            <h1>Miasma Massacre</h1>
            <div class="menu-buttons">
                <button id="btn-single" class="btn primary">Играть (Solo)</button>
            </div>
            <div class="version">v1.0.0</div>
        </div>
        
        <div id="role-select" class="screen">
            <h2>Выбери роль</h2>
            <div class="menu-buttons">
                <button id="btn-play-killer" class="btn primary">Убийца</button>
                <button id="btn-play-survivor" class="btn secondary">Выживший</button>
            </div>
        </div>
        
        <div id="game-screen" class="screen">
            <div id="game-container"></div>
            <div id="hud">
                <div id="role-indicator">Роль: <span id="player-role">---</span></div>
                <div id="generators-info">Генераторы: <span id="gen-count">0/5</span></div>
                <div id="exit-status">Выход: <span id="exit-state">закрыт</span></div>
            </div>
            <div id="player-list-hud">
                <div id="alive-count">Выжившие: 4/4</div>
            </div>
        </div>
        
        <div id="game-over" class="screen">
            <h2 id="game-result-title">Победа!</h2>
            <p id="game-result-message"></p>
            <button id="btn-back-menu" class="btn primary">В меню</button>
        </div>
    </div>
    
    <div id="toast"></div>
    
    <script src="src/game/game.js"></script>
    <script src="src/game/input.js"></script>
    <script src="app.js"></script>
</body>
</html>
